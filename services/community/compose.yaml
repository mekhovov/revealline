services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: revealline
      POSTGRES_USER: revealline
      POSTGRES_PASSWORD: revealline
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revealline -d revealline']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - community-postgres:/var/lib/postgresql/data

  migrate:
    image: postgres:17.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: revealline
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - >-
        for file in /migrations/*.sql; do
          psql --host=postgres --username=revealline --dbname=revealline
          --set=ON_ERROR_STOP=1 --file="$file";
        done
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: services/community/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      COMMUNITY_HOST: 0.0.0.0
      COMMUNITY_PORT: 8787
      COMMUNITY_DATABASE_URL: postgres://revealline:revealline@postgres:5432/revealline
      COMMUNITY_BLOB_STORAGE: disk
      COMMUNITY_BLOB_ROOT: /data/blobs
      COMMUNITY_TUS_ROOT: /data/tus
      COMMUNITY_TUS_EXPIRATION_SECONDS: 86400
      COMMUNITY_TUS_CLEANUP_INTERVAL_SECONDS: 300
      COMMUNITY_TUS_CLEANUP_BATCH_SIZE: 32
      COMMUNITY_TUS_CLEANUP_LEASE_SECONDS: 120
      COMMUNITY_TUS_LOCK_TIMEOUT_SECONDS: 30
      COMMUNITY_TUS_LOCK_POOL_SIZE: 20
      COMMUNITY_MAX_PACKAGE_BYTES: 268435456
      COMMUNITY_VALIDATOR_VERSION: creator-bundle-v1
      COMMUNITY_ALLOW_DEV_AUTH: ${COMMUNITY_ALLOW_DEV_AUTH:-true}
      COMMUNITY_DEV_TOKENS: '{"local-creator-token":"local-creator"}'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      COMMUNITY_EMAIL_VERIFICATION_EXPIRES_SECONDS: ${COMMUNITY_EMAIL_VERIFICATION_EXPIRES_SECONDS:-3600}
      COMMUNITY_PASSWORD_RESET_EXPIRES_SECONDS: ${COMMUNITY_PASSWORD_RESET_EXPIRES_SECONDS:-1800}
      COMMUNITY_ACCOUNT_MAIL_WEBHOOK_URL: ${COMMUNITY_ACCOUNT_MAIL_WEBHOOK_URL:-}
      COMMUNITY_ACCOUNT_MAIL_WEBHOOK_TOKEN: ${COMMUNITY_ACCOUNT_MAIL_WEBHOOK_TOKEN:-}
      COMMUNITY_ACCOUNT_MAIL_TIMEOUT_MS: ${COMMUNITY_ACCOUNT_MAIL_TIMEOUT_MS:-5000}
      COMMUNITY_ADMIN_SUBJECTS: ${COMMUNITY_ADMIN_SUBJECTS:-}
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - community-blobs:/data/blobs
      - community-tus:/data/tus
      - community-recovery:/data/recovery

  worker:
    build:
      context: ../..
      dockerfile: services/community/Dockerfile
    command: ['node', 'src/worker-runner.mjs']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      COMMUNITY_DATABASE_URL: postgres://revealline:revealline@postgres:5432/revealline
      COMMUNITY_BLOB_STORAGE: disk
      COMMUNITY_BLOB_ROOT: /data/blobs
      COMMUNITY_MAX_PACKAGE_BYTES: 268435456
      COMMUNITY_VALIDATOR_VERSION: creator-bundle-v1
      COMMUNITY_WORKER_POLL_MS: 1000
    volumes:
      - community-blobs:/data/blobs

volumes:
  community-postgres:
  community-blobs:
  community-tus:
  community-recovery:
