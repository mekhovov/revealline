services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: revealline
      POSTGRES_USER: revealline
      POSTGRES_PASSWORD: revealline
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revealline -d revealline']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - community-postgres:/var/lib/postgresql/data

  migrate:
    image: postgres:17.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: revealline
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        'psql',
        '--host=postgres',
        '--username=revealline',
        '--dbname=revealline',
        '--set=ON_ERROR_STOP=1',
        '--file=/migrations/001_initial.sql',
      ]
    restart: 'no'

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      COMMUNITY_HOST: 0.0.0.0
      COMMUNITY_PORT: 8787
      COMMUNITY_DATABASE_URL: postgres://revealline:revealline@postgres:5432/revealline
      COMMUNITY_BLOB_ROOT: /data/blobs
      COMMUNITY_MAX_PACKAGE_BYTES: 268435456
      COMMUNITY_VALIDATOR_VERSION: creator-bundle-v1
      COMMUNITY_ALLOW_DEV_AUTH: 'true'
      COMMUNITY_DEV_TOKENS: '{"local-creator-token":"local-creator"}'
    ports:
      - '8787:8787'
    volumes:
      - community-blobs:/data/blobs

volumes:
  community-postgres:
  community-blobs:
