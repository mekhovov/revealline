<!doctype html>
<meta charset="utf-8" />
<title>Reveal Line — prepared rotor review</title>
<style>
  body {
    background: #07111c;
    color: #edf3e8;
    font: 16px system-ui;
    margin: 24px;
    max-width: 1100px;
  }
  button,
  select {
    font: inherit;
    min-height: 44px;
    background: #182b43;
    color: inherit;
    border: 1px solid #738d91;
    padding: 8px;
  }
  label {
    display: inline-block;
    margin: 8px;
  }
  canvas {
    image-rendering: pixelated;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(408px, 1fr));
    gap: 16px;
  }
  figure {
    margin: 0;
    padding: 10px;
    border: 1px solid #334f68;
  }
  figcaption {
    margin-bottom: 8px;
  }
  pre {
    white-space: pre-wrap;
  }
  output {
    display: block;
    margin: 16px 0;
    color: #ffd64a;
  }
</style>
<h1>Prepared rotor review</h1>
<p>
  Actual compiled PNGs and shared canvas renderers. Left: Solo/Versus. Right: Team actor path. Four
  headings, 20/24/32px occupied-size targets. The lower row enlarges the 32px raster 3×.
</p>
<button id="pause">Pause</button>
<label><input id="reduced" type="checkbox" /> Reduced effects</label>
<label
  >Sample rate
  <select id="fps">
    <option>4</option>
    <option>30</option>
    <option selected>60</option>
    <option>120</option>
  </select></label
>
<button id="check">Run frame checks</button>
<output id="status">Loading prepared bodies…</output>
<div id="grid"></div>
<pre id="report"></pre>
<script type="module" src="./review.mjs"></script>
