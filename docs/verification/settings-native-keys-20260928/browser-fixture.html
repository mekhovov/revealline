<!doctype html>
<html lang="uk">
  <meta charset="utf-8" /><title>Settings native key regression fixture</title
  ><style>
    body {
      background: #0b1120;
      color: #eef5ff;
      font: 20px system-ui;
      padding: 30px;
    }
    button {
      padding: 14px;
      margin: 5px;
    }
    button:focus {
      outline: 4px solid #3be9ff;
    }
    [aria-selected='true'] {
      background: #80dbec;
    }
    section {
      padding: 24px;
      border: 1px solid #789;
    }
    #status {
      font-family: monospace;
    }
  </style>
  <h1>Cold Ukrainian Settings navigation</h1>
  <p>Regression fixture for actual shared Settings module. Not the full game.</p>
  <button id="language">Switch to English</button>
  <main id="settings-dialog">
    <div class="field-kit-settings-tabs" role="tablist" aria-label="Settings">
      <button role="tab" id="tab-first" aria-controls="panel-first">First / Audio</button
      ><button role="tab" id="tab-middle" aria-controls="panel-middle" aria-selected="true">
        Middle / Controls</button
      ><button role="tab" id="tab-last" aria-controls="panel-last">Last / Data</button>
    </div>
    <section id="panel-first">First panel</section>
    <section id="panel-middle">Middle panel</section>
    <section id="panel-last">Last panel</section>
  </main>
  <p id="status">Loading</p>
  <script type="module">
    import { setLocale, getLocale } from '../../../game/i18n/index.mjs';
    setLocale('uk', { persist: false });
    const { attachSettingsPanels, settingsTabOwnsKey } = await import(
      '../../../game/ui/settings-panels.mjs?native-key-fix=1'
    );
    const root = document.querySelector('main');
    const settings = attachSettingsPanels({ root });
    const status = document.querySelector('#status');
    const show = () =>
      (status.textContent = JSON.stringify({
        locale: getLocale(),
        selected: settings.selected(),
        focused: document.activeElement?.id,
      }));
    document.querySelector('#language').onclick = () => {
      setLocale(getLocale() === 'uk' ? 'en' : 'uk', { persist: false });
      show();
    };
    document.addEventListener(
      'keydown',
      (event) => {
        const owned = settingsTabOwnsKey(event, root);
        queueMicrotask(() => {
          show();
          status.textContent +=
            ' key=' + event.key + ' owned=' + owned + ' prevented=' + event.defaultPrevented;
        });
      },
      true,
    );
    document.addEventListener('focusin', show);
    settings.primary().focus();
    show();
  </script>
</html>
