<!doctype html>
<meta charset="utf-8" />
<title>World host explicit disposal qualification</title>
<style>
  body {
    font: 16px system-ui;
    background: #111c22;
    color: #e4eceb;
    margin: 18px;
  }
  button,
  textarea {
    font: inherit;
  }
  iframe {
    width: 1100px;
    height: 650px;
    border: 1px solid #586b72;
  }
  textarea {
    width: 100%;
    height: 100px;
  }
  pre {
    white-space: pre-wrap;
  }
</style>
<h1>World host explicit disposal</h1>
<p>
  Real host, WebGL and isolated IndexedDB. Controlled RAF delivery retains the real execution-gap
  guard. No device-performance claim.
</p>
<button id="run">Run bounded qualification</button>
<p id="status">Ready</p>
<pre id="summary"></pre>
<iframe id="player" title="Actual World host"></iframe>
<label>Full receipt<textarea id="receipt" readonly></textarea></label>
<script type="module">
  const $ = (id) => document.getElementById(id),
    sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const result = {
    format: 'FPVWorldDisposalBrowser.v3',
    started: null,
    checks: [],
    cases: [],
    errors: [],
  };
  const databases = new Set();
  window.fixtureRegisterDB = (name) => databases.add(name);
  let memory;
  window.fixtureStorage = {
    getItem: (key) => memory.get(key) ?? null,
    setItem: (key, value) => memory.set(key, String(value)),
    removeItem: (key) => memory.delete(key),
  };
  function must(ok, label, detail) {
    result.checks.push({ label, pass: Boolean(ok), ...(detail === undefined ? {} : { detail }) });
    if (!ok) throw Error(label);
  }
  async function bounded(p, label, ms = 30000) {
    let timer;
    try {
      return await Promise.race([
        p,
        new Promise(
          (_, reject) => (timer = setTimeout(() => reject(Error('Timeout: ' + label)), ms)),
        ),
      ]);
    } finally {
      clearTimeout(timer);
    }
  }
  async function until(fn, label, ms = 30000) {
    const start = performance.now();
    while (!fn()) {
      if (performance.now() - start > ms) throw Error('Timeout: ' + label);
      await sleep(15);
    }
  }
  function copy(v) {
    return JSON.parse(JSON.stringify(v));
  }
  function update() {
    const summary = {
      checks: result.checks.length,
      passed: result.checks.filter((x) => x.pass).length,
      errors: result.errors,
      cases: result.cases.map((x) => ({
        variant: x.variant,
        mode: x.mode,
        dispose: x.dispose,
        renderer: x.renderer,
        openDatabases: x.databases?.filter((d) => !d.closes).length,
        registered: x.resources?.registered,
        faultAborts: x.fault?.aborts,
        postDisposeRAF: x.postDisposeRAF,
      })),
    };
    $('summary').textContent = JSON.stringify(summary, null, 2);
    $('receipt').value = JSON.stringify(result, null, 2);
  }
  async function load(variant, mode, delay = '') {
    memory = new Map([
      [
        'revealline.fpv.world-settings.v1',
        JSON.stringify({
          'world-language': 'en',
          'flight-source': 'keyboard',
          'flight-quality': 'balanced',
          'flight-mode': 'self-level',
          'sim-motion': 'reduced',
        }),
      ],
    ]);
    const prefix = 'fpv-disposal-' + Date.now() + '-' + variant + '-' + mode + '-';
    const frame = $('player'),
      url = new URL('player.html', location.href);
    url.searchParams.set('variant', variant);
    url.searchParams.set('database', prefix);
    if (delay) url.searchParams.set('delay', delay);
    const loaded = new Promise((resolve) => (frame.onload = resolve));
    frame.src = url.href;
    await bounded(loaded, 'native iframe load');
    await until(() => frame.contentWindow?.fixtureApp, 'host mount');
    const w = frame.contentWindow;
    if (!delay) await bounded(w.fixtureApp.ready, 'host ready');
    w.focus();
    return { w, d: w.document, app: w.fixtureApp, prefix };
  }
  async function session(prefix) {
    const db = await new Promise((resolve, reject) => {
      const req = indexedDB.open(prefix + 'revealline.fpv.world-records.v1');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('session', 'readonly'),
          req = tx.objectStore('session').get('active');
        req.onsuccess = () => resolve(req.result ?? null);
        req.onerror = () => reject(req.error);
      });
    } finally {
      db.close();
    }
  }
  async function warm(ctx) {
    const { w } = ctx;
    for (let i = 0; i < 3; i++) {
      w.fixtureRAF.deliver(0);
      await sleep(15);
    }
  }
  async function arm(ctx) {
    const { w, d } = ctx;
    d.getElementById('world-viewport').focus();
    d.getElementById('world-arm').click();
    must(
      /Flight active/.test(d.getElementById('flight-status').textContent),
      'Explicit Arm starts real flight',
    );
    w.fixtureRAF.deliver(0);
    await sleep(10);
    w.fixtureRAF.deliver(200);
    must(
      w.fixtureDrawState?.ticks > 0 && w.fixtureDrawState.status === 'active',
      'Actual real flight advances and draws',
    );
  }
  async function runCase(variant, mode) {
    $('status').textContent = variant + ' / ' + mode;
    const ctx = await load(variant, mode),
      { w, d, app, prefix } = ctx;
    const row = { variant, mode, prefix };
    result.cases.push(row);
    if (mode !== 'lobby') {
      await bounded(app.startFlight(w.fixtureEntry), 'start canonical Clearing check-in');
      await warm(ctx);
      await arm(ctx);
      row.before = copy(w.fixtureDrawState);
      row.resourcesBefore = copy(w.fixtureRenderer.resources());
      must(
        row.resourcesBefore.registered.geometries > 0,
        'Actual renderer has owned scene geometry',
      );
    }
    const saveFailure = mode.endsWith('save-failure');
    if (saveFailure) {
      app.pause();
      await until(
        () => w.fixtureWrites.some((x) => x.outcome === 'complete'),
        'initial recovery saved',
      );
      row.savedRecoveryBefore = await session(prefix);
      must(
        row.savedRecoveryBefore?.proof?.frames?.length > 0,
        'Prior recovery exists before injected failure',
      );
      await warm(ctx);
      await arm(ctx);
      w.fixtureFault.armed = true;
      if (mode === 'pending-save-failure') app.pause();
    }
    const start = performance.now();
    const operation = app.dispose();
    if (variant === 'candidate')
      must(operation === app.dispose(), 'Concurrent disposal shares one promise');
    let failure;
    try {
      await bounded(operation, 'explicit dispose');
      row.dispose = { resolved: true };
    } catch (e) {
      failure = e;
      row.dispose = { resolved: false, error: String(e), stack: e.stack };
    }
    row.dispose.durationMs = performance.now() - start;
    await sleep(30);
    row.renderer = copy(w.fixtureRendererEvents);
    row.physics = copy(w.fixturePhysics);
    row.resources = w.fixtureRenderer ? copy(w.fixtureRenderer.resources()) : null;
    row.databases = copy(w.fixtureDBs);
    row.writes = copy(w.fixtureWrites);
    row.fault = copy(w.fixtureFault);
    row.errors = copy(w.fixtureErrors);
    row.postDisposeRAF = w.fixtureRAF.pending();
    if (saveFailure) {
      row.savedRecoveryAfter = await session(prefix);
      must(
        row.fault.aborts > 0 && !row.dispose.resolved,
        'Injected native session transaction abort is reported by dispose',
      );
      must(
        JSON.stringify(row.savedRecoveryBefore) === JSON.stringify(row.savedRecoveryAfter),
        'Failed writes preserve prior saved recovery',
      );
      row.cleanupComplete =
        (!w.fixtureRenderer || row.renderer.disposed === 1) &&
        row.databases.every((x) => x.closes === 1) &&
        row.postDisposeRAF === 0;
      if (variant === 'candidate') {
        must(row.cleanupComplete, 'Save rejection still closes every database, renderer and RAF');
        must(
          Object.values(row.resources.registered).every((x) => x === 0),
          'Save rejection releases all owned GPU resources',
        );
        must(
          row.physics.length > 0 && row.physics.every((x) => x.frees === 1),
          'Save rejection frees every actual Rapier world once',
          row.physics,
        );
        must(
          app.dispose() === operation,
          'Repeated failed disposal returns the original operation',
        );
        let repeated;
        try {
          await app.dispose();
        } catch (e) {
          repeated = e;
        }
        must(repeated === failure, 'Repeated disposal preserves the original rejection identity');
        await sleep(30);
        must(
          JSON.stringify(row.databases) === JSON.stringify(w.fixtureDBs) &&
            JSON.stringify(row.renderer) === JSON.stringify(w.fixtureRendererEvents),
          'Rejected repeated disposal does not repeat cleanup',
        );
        must(
          w.fixtureErrors.length === 0,
          'Save rejection creates no unhandled browser errors',
          copy(w.fixtureErrors),
        );
      }
    } else if (variant === 'baseline' && mode === 'lobby') {
      must(
        !row.dispose.resolved && /append|Cannot read properties/.test(row.dispose.error),
        'Baseline reproduces removed-main teardown failure',
      );
    } else {
      must(row.dispose.resolved, 'Explicit disposal resolves for this host context');
      must(
        row.databases.length > 0 && row.databases.every((x) => x.closes === 1),
        'All actual host IndexedDB handles close exactly once',
        row.databases,
      );
      must(row.postDisposeRAF === 0, 'All scheduled host callbacks cancelled');
      if (mode !== 'lobby') {
        must(row.renderer.disposed === 1, 'Actual renderer disposed exactly once');
        must(
          Object.values(row.resources.registered).every((x) => x === 0),
          'All registered GPU scene resources released',
        );
        must(
          row.physics.length > 0 && row.physics.every((x) => x.frees === 1),
          'Every actual Rapier world freed exactly once',
          row.physics,
        );
      }
      const before = JSON.stringify({
        db: row.databases,
        renderer: row.renderer,
        storage: [...memory],
      });
      await bounded(app.dispose(), 'second explicit dispose');
      d.dispatchEvent(
        new w.KeyboardEvent('keydown', {
          code: 'Space',
          key: ' ',
          bubbles: true,
          cancelable: true,
        }),
      );
      w.dispatchEvent(new w.Event('blur'));
      w.dispatchEvent(new w.Event('focus'));
      w.dispatchEvent(new w.Event('resize'));
      for (let i = 0; i < 3; i++) w.fixtureRAF.deliver(200);
      await sleep(30);
      row.afterRepeat = {
        db: copy(w.fixtureDBs),
        renderer: copy(w.fixtureRendererEvents),
        storage: [...memory],
      };
      must(
        before === JSON.stringify(row.afterRepeat),
        'Double dispose and later input/focus/RAF are inert',
      );
      must(w.fixtureErrors.length === 0, 'No unexpected browser errors', copy(w.fixtureErrors));
    }
    update();
    // Native navigation isolates known failing baseline; does not misrepresent app cleanup.
    const unloaded = new Promise((resolve) => ($('player').onload = resolve));
    $('player').src = 'about:blank';
    await bounded(unloaded, 'unload case');
  }
  async function hydrationCase(phase) {
    $('status').textContent = 'candidate / delayed-' + phase;
    const { w, app, prefix } = await load('candidate', 'delayed-' + phase, phase);
    const row = { variant: 'candidate', mode: 'delayed-' + phase, prefix };
    result.cases.push(row);
    await until(() => w.fixtureHydration.pending.length > 0, 'native hydration delivery held');
    row.held = w.fixtureHydration.held;
    const operation = app.dispose();
    must(operation === app.dispose(), 'Pending hydration disposal shares one promise');
    let settled = false;
    operation.then(
      () => (settled = true),
      () => (settled = true),
    );
    await sleep(30);
    must(
      !settled && Boolean(w.document.querySelector('main')),
      'Disposal retains hydration DOM until native delivery settles',
    );
    w.fixtureHydration.release();
    await bounded(operation, 'dispose delayed hydration');
    await bounded(app.ready, 'late host ready settlement');
    row.dispose = { resolved: true };
    row.databases = copy(w.fixtureDBs);
    row.renderer = copy(w.fixtureRendererEvents);
    row.postDisposeRAF = w.fixtureRAF.pending();
    row.physics = copy(w.fixturePhysics);
    row.errors = copy(w.fixtureErrors);
    must(
      row.databases.length > 0 && row.databases.every((x) => x.closes === 1),
      'All delayed hydration databases close exactly once',
      row.databases,
    );
    must(
      row.postDisposeRAF === 0 && row.renderer.created === 0,
      'Disposed hydration starts no renderer or remaining RAF',
    );
    must(
      app.dispose() === operation,
      'Post-hydration repeated dispose returns same completed operation',
    );
    must(
      row.errors.length === 0,
      'Delayed hydration has no detached-DOM/unhandled errors',
      row.errors,
    );
    update();
    const unloaded = new Promise((resolve) => ($('player').onload = resolve));
    $('player').src = 'about:blank';
    await bounded(unloaded, 'unload hydration');
  }
  async function removeDBs() {
    for (const name of databases) {
      await bounded(
        new Promise((resolve, reject) => {
          const req = indexedDB.deleteDatabase(name);
          req.onsuccess = resolve;
          req.onerror = () => reject(req.error);
          req.onblocked = () => reject(Error('Database remains open: ' + name));
        }),
        'delete isolated DB',
      );
    }
  }
  $('run').onclick = async () => {
    $('run').disabled = true;
    result.started = new Date().toISOString();
    result.visibility = { state: document.visibilityState, focused: document.hasFocus() };
    try {
      must(
        document.visibilityState === 'visible' && document.hasFocus(),
        'Fixture begins visible and focused',
      );
      result.manifest = await fetch('manifest.json').then((r) => r.json());
      for (const mode of ['lobby', 'flight', 'save-failure'])
        for (const variant of ['baseline', 'candidate']) await runCase(variant, mode);
      await runCase('candidate', 'pending-save-failure');
      for (const phase of ['open', 'session']) await hydrationCase(phase);
    } catch (e) {
      result.errors.push({ message: String(e), stack: e.stack });
    } finally {
      try {
        $('player').src = 'about:blank';
        await sleep(30);
        await removeDBs();
      } catch (e) {
        result.errors.push({ cleanup: String(e) });
      }
      result.finished = new Date().toISOString();
      update();
      $('status').textContent = result.errors.length
        ? 'FAILED'
        : 'PASS; historical baseline failures retained';
    }
  };
</script>
