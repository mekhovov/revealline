name: Temporary Solo final a6 Linux correctness

on:
  pull_request:
    paths:
      - 'scripts/test-solo-final-correctness.mjs'
      - '.github/workflows/solo-remote-final-correctness-temporary.yml'
      - 'scripts/run-solo-remote-correctness.mjs'
      - 'scripts/test-solo-current-native-wave.mjs'
      - 'scripts/solo-remote-archive.py'
      - 'scripts/verify-solo-build.mjs'
      - 'scripts/solo-build-worker-closure.mjs'
      - 'scripts/test-solo-build-worker-closure.mjs'
      - 'scripts/test-solo-remote-correctness.mjs'
      - 'scripts/solo-remote-baseline.mjs'
      - 'scripts/test-solo-remote-baseline.mjs'
      - 'docs/performance/solo-remote-final-correctness-plan.json'
      - 'docs/performance/fixtures/solo-remote-correctness/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-final-correctness-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  correctness:
    # One reviewed current-source correctness wave; later pushes cannot rerun it.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'a6eacee2f09f06f9ffa76fe8cd5d674aff0475a4'
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Initialize paths after the runner is assigned
        timeout-minutes: 1
        shell: bash
        run: |
          printf '%s\n' \
            "SOLO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/solo-browser-tools/node_modules/playwright/index.mjs" \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solo-browser-binaries" \
            "OUTPUT=$RUNNER_TEMP/solo-linux-final-correctness" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-remote-current-correctness-temporary.yml
            /.github/workflows/solo-remote-current-transitions-temporary.yml
            /.github/workflows/solo-remote-final-correctness-temporary.yml
            /docs/performance/fixtures/solo-remote-correctness/current-native-a6-source.json
            /docs/performance/fixtures/solo-remote-correctness/first30.qualification.fixture
            /docs/performance/fixtures/solo-remote-sustained/first-return.xonix.fixture
            /docs/performance/fixtures/solo-remote-sustained/next-first-return-anchored-preflight.qualification.fixture
            /docs/performance/fixtures/solo-remote-sustained/retry-first-return-anchored-preflight.qualification.fixture
            /docs/performance/solo-remote-correctness-plan.json
            /docs/performance/solo-remote-current-correctness-plan.json
            /docs/performance/solo-remote-current-next-plan.json
            /docs/performance/solo-remote-current-retry-plan.json
            /docs/performance/solo-remote-final-correctness-plan.json
