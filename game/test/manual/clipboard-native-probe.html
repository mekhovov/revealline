<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Native clipboard verification</title>
  <h1>Native clipboard verification</h1>
  <p>
    After explicitly copying a known test artifact, Tab to this field and use the native Paste
    shortcut. This page has no scripts, storage, network requests or clipboard API calls. Compare
    only against the known artifact; do not retain unrelated clipboard contents.
  </p>
  <label for="clipboard-probe">Pasted test artifact</label>
  <textarea id="clipboard-probe" rows="20" cols="70" spellcheck="false"></textarea>
</html>
