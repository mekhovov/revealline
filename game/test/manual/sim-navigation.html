<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>SIM entry — isolated navigation preview</title>
    <link rel="stylesheet" href="../../ui/optional-practice-panel.css" />
    <script src="../../vendor/i18next-26.4.2.min.js"></script>
    <script src="../../i18n/catalogs.mjs"></script>
    <script src="../../i18n/bootstrap.mjs"></script>
    <style>
      body {
        background: #091324;
        color: #edf2e8;
        font: 18px system-ui;
        padding: 24px;
      }
      button,
      a {
        padding: 12px;
        color: inherit;
        background: #203036;
      }
    </style>
  </head>
  <body>
    <h1>SIM entry preview</h1>
    <p>
      Uses the production entry controller. Opens the real simulator; no arcade profile or access
      gate is loaded by this fixture.
    </p>
    <nav id="entry"><button id="sim">SIM</button></nav>
    <script type="module">
      import { mountOptionalPracticePanel } from '../../ui/optional-practice-panel.mjs';
      import { fpvWorldLaunchURL } from '../../fpv-entry.mjs';
      const href = new URL('../../?journey=legacy', location.href).href;
      const unavailable = new URL(location.href).searchParams.has('unavailable');
      mountOptionalPracticePanel({
        document,
        container: document.getElementById('entry'),
        opener: document.getElementById('sim'),
        href,
        bundledHref: fpvWorldLaunchURL(href),
        packageId: 'fpv-worlds',
        preferDirect: true,
        pause() {},
        timeoutMs: 4000,
        ...(unavailable
          ? {
              fetcher: async () => {
                throw new TypeError('Preview: unavailable connection');
              },
            }
          : {}),
      });
    </script>
  </body>
</html>
