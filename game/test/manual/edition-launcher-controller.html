<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Compiled edition launcher controller check</title>
  <button id="run">Run launcher controller check</button>
  <pre id="status">Ready</pre>
  <iframe
    id="launcher"
    title="Actual compiled launcher"
    style="width: 100%; height: 600px"
  ></iframe>
  <script type="module">
    const frame = document.querySelector('#launcher'),
      status = document.querySelector('#status');
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function until(predicate) {
      const start = performance.now();
      while (!predicate()) {
        if (performance.now() - start > 10000) throw new Error('Launcher state timed out');
        await wait(30);
      }
    }
    document.querySelector('#run').onclick = async () => {
      try {
        status.textContent = 'Running…';
        const loaded = new Promise((resolve) =>
          frame.addEventListener('load', resolve, { once: true }),
        );
        frame.src = '/editions/coupa-all/app/';
        await loaded;
        const win = frame.contentWindow,
          doc = frame.contentDocument;
        const buttons = Array.from({ length: 17 }, () => ({ pressed: false, value: 0 }));
        const pad = {
          id: 'Compiled launcher verification',
          index: 0,
          mapping: 'standard',
          connected: true,
          axes: [0, 0, 0, 0],
          buttons,
          timestamp: performance.now(),
        };
        Object.defineProperty(win.navigator, 'getGamepads', {
          configurable: true,
          value: () => [pad],
        });
        frame.focus();
        win.focus();
        async function pulse(index) {
          buttons[index] = { pressed: true, value: 1 };
          pad.timestamp = performance.now();
          await wait(80);
          buttons[index] = { pressed: false, value: 0 };
          pad.timestamp = performance.now();
          await wait(80);
        }
        await wait(150);
        await pulse(0);
        await until(() => !doc.querySelector('#prepare').hidden);
        const prepare = doc.querySelector('#prepare');
        const href = prepare.href;
        if (!href.includes('/editions/coupa-all/releases/v0.142.1/site/game/company.html'))
          throw new Error('Unexpected validated release link');
        await pulse(1); // Back selects the launcher's preferred available action.
        if (doc.activeElement !== prepare) throw new Error('Back did not focus Prepare');
        await pulse(0);
        await until(() => win.location.pathname.includes('/releases/v0.142.1/site/game/'));
        status.textContent = JSON.stringify(
          {
            result: 'PASS',
            input: 'virtual standard pad',
            check: 'Confirm release revealed Prepare',
            back: 'Prepare focused',
            prepare: href,
            landed: win.location.href,
          },
          null,
          2,
        );
      } catch (error) {
        status.textContent = JSON.stringify({ result: 'FAIL', error: error.message });
      }
    };
  </script>
</html>
