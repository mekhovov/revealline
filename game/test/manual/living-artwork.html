<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Living landing artwork · RevealLine</title>
    <link rel="stylesheet" href="../../ui/menu-scenes.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #080e18;
        color: #edf4ff;
        font: 16px system-ui;
      }
      #landing {
        position: fixed;
        inset: 0;
      }
      #review {
        position: fixed;
        inset: auto 24px 24px;
        z-index: 3;
        padding: 16px 20px;
        background: #080e18ed;
        border: 1px solid #7495a3;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 20px 0 0;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        background: #17283b;
        border: 1px solid #7cd8e9;
        min-height: 44px;
        padding: 8px 12px;
      }
      :focus-visible {
        outline: 3px solid #ffd566;
        outline-offset: 3px;
      }
      #status {
        width: 100%;
        color: #aec4cf;
        font-size: 13px;
      }
      @media (max-width: 540px) {
        #review {
          inset: auto 12px 12px;
          padding: 12px;
          gap: 8px;
        }
        select {
          max-width: 210px;
        }
        h1 {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main id="landing" aria-label="Animated landing artwork preview"></main>
    <section id="review" aria-label="Preview controls">
      <h1>Living artwork</h1>
      <label
        >Scene
        <select id="theme"></select
      ></label>
      <button id="pause">Pause animation</button>
      <label><input type="checkbox" id="reduced" /> Still image</label>
      <label><input type="checkbox" id="fallback" /> Static picture fallback</label>
      <output id="status" aria-live="polite">Loading the original artwork…</output>
    </section>
    <script type="module" src="./living-artwork.mjs"></script>
  </body>
</html>
