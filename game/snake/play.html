<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script
      src="../presentation/theme-bootstrap.mjs"
      data-theme-density="player"
      data-theme-follow-context="true"
    ></script>
    <link
      rel="stylesheet"
      href="../presentation/industrial-workshop.css"
      data-industrial-workshop
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111c21" />
    <title>Classic Snake · FPV / LINE</title>
    <link rel="stylesheet" href="../ui/mode-play-shell.css" />
    <link rel="stylesheet" href="../ui/menu-scenes.css" />
    <link rel="stylesheet" href="../ui/optional-practice-panel.css" />
    <link rel="stylesheet" href="classic.css" />
    <link rel="stylesheet" href="../ui/mode-choice.css" />
    <link rel="stylesheet" href="../ui/mode-settings-view.css" />
    <link rel="stylesheet" href="../ui/global-settings-view.css" />
    <link rel="stylesheet" href="../ui/pause-menu.css" />
    <link rel="stylesheet" href="../ui/journey.css" />
    <script
      defer
      src="../ui/direct-tool-launch.js"
      data-module="./classic-app.mjs"
      data-status="boot-status"
    ></script>
  </head>
  <body class="field-kit snake-player">
    <p id="boot-status" role="status">Preparing classic Snake…</p>
    <main id="snake-shell" hidden></main>
    <div id="snake-panels" hidden>
      <div id="snake-mode-links"></div>
      <section id="snake-missions">
        <p id="progress-summary" role="status"></p>
        <nav class="progress-links" aria-label="Campaign progress">
          <button id="recent-level" hidden></button><button id="uncleared-level" hidden></button>
        </nav>
      </section>
      <section id="snake-expert">
        <nav id="mode-tabs" aria-label="Play mode">
          <button data-mode="solo">Solo</button><button data-mode="versus">Versus</button>
          <button data-mode="team">Team</button>
        </nav>
        <p data-word="changeHelp"></p>
        <div class="setup variants" aria-label="Round rules">
          <label
            ><span data-word="format"></span
            ><select id="format">
              <option value="campaign">Campaign</option>
              <option value="endless">Endless</option>
            </select></label
          >
          <label
            ><span data-word="pace"></span
            ><select id="pace">
              <option value="slow">Slow</option>
              <option value="normal">Normal</option>
              <option value="fast">Fast</option>
            </select></label
          >
          <label
            ><span data-word="targetRules"></span
            ><select id="target-rules">
              <option value="authored">As designed</option>
              <option value="moving">Moving-target remix</option>
              <option value="varied">Varied prey</option>
            </select></label
          >
          <label id="preset-field"
            ><span data-word="preset"></span
            ><select id="preset">
              <option value="classic">Classic</option>
              <option value="pursuit">Pursuit</option>
              <option value="tactical">Tactical</option>
              <option value="arcade">Arcade</option>
            </select></label
          >
          <label id="duel-field"
            ><span data-word="duel"></span
            ><select id="duel">
              <option value="score">Score duel · 3 min</option>
              <option value="survival">Survival duel</option>
            </select></label
          >
        </div>
        <div class="sortie-actions">
          <button id="featured" data-word="featured"></button
          ><button id="new-route" data-word="newRoute"></button><span id="seed-label"></span>
        </div>
      </section>
      <section id="snake-briefing">
        <p id="level-description"></p>
        <p id="encounter-summary" class="encounter-summary" role="status"></p>
        <p id="mode-help"></p>
        <p id="speed-note" class="rule-badge"></p>
        <p id="record-summary"></p>
        <p id="snake-rating-criteria"></p>
        <p id="controls-help" class="muted"></p>
      </section>
      <section id="snake-settings" class="setup">
        <label
          ><span data-word="language">Language</span
          ><select id="language">
            <option value="en">English</option>
            <option value="uk">Українська</option>
          </select></label
        >
        <label
          ><span data-word="steering"></span
          ><select id="steering">
            <option value="dpad">Direction pad</option>
            <option value="turns">Turn left / right</option>
          </select></label
        >
        <details>
          <summary data-word="displaySettings"></summary>
          <div id="snake-enemy-appearance"></div>
          <div id="snake-display-reading">
            <label
              ><span data-i18n="interface:textStyle">Text style</span
              ><select id="snake-text-face">
                <option value="pixel" data-i18n="interface:themeFont">Theme font</option>
                <option value="plain" data-i18n="common:text.plain">Plain</option>
              </select></label
            >
            <label
              ><span data-i18n="interface:textSize">Text size</span
              ><select id="snake-text-size">
                <option value="standard" data-i18n="interface:display.textSize.standard">
                  Standard
                </option>
                <option value="large" data-i18n="interface:large">Large</option>
              </select></label
            >
            <p id="snake-display-status" class="micro-note" role="status"></p>
          </div>
          <label
            ><span data-word="boardAppearance"></span
            ><select id="board-style">
              <option value="theme">Game theme</option>
              <option value="retro">Retro Field</option>
              <option value="living-circuit">Living Circuit</option>
            </select></label
          >
          <label id="board-scene-field" hidden>
            <span data-word="boardScene"></span>
            <select id="board-scene">
              <option value="auto">Auto · by chapter</option>
              <option value="orchard">Orchard Workshop</option>
              <option value="workshop">Workshop</option>
              <option value="relay">Field Relay</option>
            </select>
          </label>
          <label
            ><span data-word="castLabel"></span
            ><select id="actor-cast">
              <option value="authored">Campaign cast</option>
              <option value="tactical">Field kit</option>
              <option value="rivals">Worn field kit</option>
              <option value="arcade">Winter kit</option>
            </select></label
          >
          <label
            ><span data-word="appearance"></span
            ><select id="style">
              <option value="cable">Cable</option>
              <option value="signal">Signal</option>
            </select></label
          >
          <label
            ><span data-word="accent"></span
            ><select id="accent"></select
          ></label>
          <label class="check"
            ><input type="checkbox" id="reduced" /><span data-word="reduced"></span
          ></label>
        </details>
        <details>
          <summary data-word="soundSettings"></summary>
          <label class="check"
            ><input type="checkbox" id="muted" /><span data-word="muted"></span
          ></label>
          <label
            ><span data-word="volume"></span
            ><input id="volume" type="range" min="0" max="1" step="0.05"
          /></label>
          <label
            ><span data-word="effectsVolume"></span
            ><input id="effects-volume" type="range" min="0" max="1" step="0.05"
          /></label>
          <div id="snake-reaction-settings"></div>
        </details>
        <details>
          <summary data-word="effects"></summary>
          <label class="check"
            ><input type="checkbox" id="brutal" /><span data-word="brutal"></span
          ></label>
          <label class="check"
            ><input type="checkbox" id="blood" /><span data-word="blood"></span
          ></label>
          <label class="check"
            ><input type="checkbox" id="remains" /><span data-word="remains"></span
          ></label>
          <p data-word="effectHelp"></p>
        </details>
      </section>
      <section id="snake-help">
        <div class="target-guide">
          <canvas id="target-icon" width="64" height="64" aria-hidden="true"></canvas>
          <div>
            <strong id="target-style"></strong>
            <p data-word="readyHelp"></p>
          </div>
        </div>
        <p data-word="controlsHelp"></p>
        <p class="rule-note" data-word="noCapture"></p>
        <details id="field-guide">
          <summary data-word="fieldGuide"></summary>
          <div id="field-guide-cards"></div>
        </details>
        <details>
          <summary data-word="preyDetails"></summary>
          <p data-word="preyLegend"></p>
        </details>
      </section>
      <section id="snake-workshop">
        <nav class="workshop-links">
          <a href="../studio/snake.html" id="studio-link" data-word="studio"></a>
          <a href="./" id="campaign-link">All campaigns</a>
          <a href="../" id="home-link">Main game</a>
          <a
            id="remix-link"
            href="../?journey=snake-hunt-v1&amp;snake-style=capture"
            data-word="remix"
          ></a>
        </nav>
        <details>
          <summary data-word="session"></summary>
          <button id="continue" data-word="continue" hidden></button
          ><button id="export" data-word="save"></button>
          <label class="file-label"
            ><span data-word="load"></span
            ><input type="file" id="import" accept="application/json,.json"
          /></label>
          <p id="save-status" role="status"></p>
        </details>
      </section>
      <section id="snake-results">
        <p id="result-detail"></p>
        <p id="snake-stars" class="snake-stars" role="status"></p>
        <p id="result-record"></p>
        <div class="run-controls">
          <button id="next" hidden>Next level</button
          ><button id="review" data-word="review" hidden></button
          ><button id="slow-offer" data-word="slowOffer" hidden></button>
        </div>
      </section>
      <div id="game">
        <section class="arena" aria-label="Snake game">
          <div class="level-strip">
            <h2 id="level-title"></h2>
            <span id="boundary" class="rule-badge"></span>
            <p id="snake-onboarding" class="snake-onboarding"></p>
          </div>
          <div id="boards"></div>
          <div id="pads"></div>
          <p id="announcement" class="sr-only" role="status"></p>
          <div id="snake-reaction-caption" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </body>
</html>
