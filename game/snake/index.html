<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../presentation/theme-bootstrap.mjs" data-theme-density="player" data-theme-follow-context="true"></script>
    <link rel="stylesheet" href="../presentation/industrial-workshop.css" data-industrial-workshop />
    <script type="module" src="../presentation/theme-entry.mjs"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101b20" />
    <title>Snake hunts · FPV / LINE</title>
    <link rel="stylesheet" href="hub.css" />
    <script type="module" src="hub.mjs"></script>
  </head>
  <body>
    <main>
      <header class="topbar">
        <a href="../" class="brand">FPV / LINE</a>
        <label
          ><span id="language-label">Language</span>
          <select id="language">
            <option value="en">English</option>
            <option value="uk">Українська</option>
          </select></label
        >
      </header>
      <section class="hero" aria-labelledby="title">
        <div>
          <p class="eyebrow" id="eyebrow">A new way to hunt</p>
          <h1 id="title">Catch. Grow.<br />Leave room to turn.</h1>
          <p class="lede" id="intro"></p>
          <nav id="modes" class="actions" aria-label="Play mode"></nav>
          <p class="subtle" id="picker-note"></p>
        </div>
        <figure class="hero-board">
          <svg viewBox="0 0 340 300" role="img" aria-labelledby="diagram-title">
            <title id="diagram-title">
              A growing tail loops around walls toward a humanoid target.
            </title>
            <defs>
              <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M20 0H0V20" fill="none" stroke="#29383b" stroke-width="1" />
              </pattern>
            </defs>
            <rect
              x="1"
              y="1"
              width="338"
              height="298"
              rx="3"
              fill="#101b20"
              stroke="#657d79"
              stroke-width="2"
            />
            <rect x="10" y="10" width="320" height="280" fill="url(#grid)" />
            <path
              d="M160 220H80V80H220V180H160V140"
              fill="none"
              stroke="#76d5aa"
              stroke-width="18"
              stroke-linejoin="miter"
              stroke-dasharray="18 2"
            />
            <path
              d="M170 240H275V100"
              fill="none"
              stroke="#efbe60"
              stroke-width="2"
              stroke-dasharray="4 7"
            />
            <path d="M110 110H180V120H120V190H110Z M235 200H245V255H190V245H235Z" fill="#71828b" />
            <rect x="151" y="128" width="18" height="18" fill="#76d5aa" />
            <rect x="153" y="130" width="5" height="5" fill="#f7eacb" />
            <rect x="162" y="130" width="5" height="5" fill="#f7eacb" />
            <path d="M155 130V133M164 130V133" stroke="#101b20" stroke-width="2" />
            <g fill="#efbe60">
              <rect x="270" y="65" width="10" height="10" />
              <rect x="268" y="77" width="14" height="15" />
              <rect x="263" y="78" width="4" height="14" />
              <rect x="283" y="78" width="4" height="14" />
              <rect x="268" y="93" width="5" height="14" />
              <rect x="277" y="93" width="5" height="14" />
            </g>
          </svg>
          <figcaption id="diagram-caption"></figcaption>
        </figure>
      </section>
      <section class="rules" aria-label="How to play" id="rules"></section>
      <section aria-labelledby="campaign-title">
        <div class="section-heading">
          <h2 id="campaign-title"></h2>
          <p id="campaign-count"></p>
        </div>
        <div id="chapters" class="chapters"></div>
      </section>
      <section class="sim-section" aria-labelledby="sim-title">
        <div class="section-heading">
          <h2 id="sim-title"></h2>
          <p id="sim-count"></p>
        </div>
        <p class="lede" id="sim-intro"></p>
        <div id="sim-chapters" class="chapters"></div>
      </section>
      <footer>
        <p id="footer-note"></p>
        <a id="studio-link" href="../studio/"></a>
      </footer>
    </main>
  </body>
</html>
