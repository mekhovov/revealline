name: Assemble full-test release evidence

on:
  push:
    branches: [codex/full-release-evidence]
  pull_request:
    paths:
      - '.github/workflows/assemble-full-release-evidence.yml'
      - 'publishing/utility/assemble_full_qualification.py'
      - 'publishing/utility/test_assemble_full_qualification.py'
      - 'publishing/utility/ASSEMBLE-FULL.md'
  workflow_dispatch:
    inputs:
      assembly_binding:
        description: Reviewed exact full-test JSON binding; never a waiver
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: full-release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact assembly utility
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            publishing/utility
            .github/workflows
      - name: Run bounded utility tests
        run: python3 -B -m unittest discover -s publishing/utility -p 'test_*.py'

  assemble:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact assembly utility
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
          sparse-checkout: |
            publishing/utility
            .github/workflows

      - name: Validate the reviewed assembly binding
        id: binding
        env:
          ASSEMBLY_BINDING: ${{ inputs.assembly_binding }}
        run: |
          python3 -B -c 'import os,pathlib; pathlib.Path("assembly-binding.json").write_text(os.environ["ASSEMBLY_BINDING"])'
          python3 -B automation/publishing/utility/assemble_full_qualification.py validate assembly-binding.json

      - name: Check out the exact frozen source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.binding.outputs.source }}
          path: qualified
          fetch-depth: 0
          persist-credentials: false

      - name: Retain the actual PR workflow object
        env:
          PR_WORKFLOW_COMMIT: ${{ steps.binding.outputs.pr_workflow }}
          PR_SOURCE_COMMIT: ${{ steps.binding.outputs.pr_source }}
        run: git -C qualified fetch --no-tags origin "$PR_WORKFLOW_COMMIT" "$PR_SOURCE_COMMIT"

      - name: Set up the pinned partition-listing runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x

      - name: Collect only original metadata, logs and bounded inspection evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B automation/publishing/utility/assemble_full_qualification.py collect
          assembly-binding.json --repo qualified --output collected

      - name: Assemble and verify seven small attachments with the frozen source consumer
        run: >-
          python3 -B automation/publishing/utility/assemble_full_qualification.py assemble
          collected/assemble-inputs.json --output small-package

      - name: Retain the exact utility provenance
        env:
          UTILITY_COMMIT: ${{ github.workflow_sha }}
        run: |
          python3 -B -c 'import hashlib,json,os,pathlib; root=pathlib.Path("automation"); names=["publishing/utility/assemble_full_qualification.py","publishing/utility/assemble_waived_qualification.py"]; print(json.dumps({"workflowCommit":os.environ["UTILITY_COMMIT"],"helpers":[{"path":p,"sha256":hashlib.sha256((root/p).read_bytes()).hexdigest()} for p in names]},indent=2))' > assembly-utility.json
          test "$(find small-package -maxdepth 1 -type f | wc -l | tr -d ' ')" = 7
          sha256sum small-package/* > small-package.sha256

      - name: Retain the bounded package for independent review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-test-small-package
          path: |
            small-package/*
            small-package-review.json
            assembly-binding.json
            assembly-utility.json
            small-package.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
