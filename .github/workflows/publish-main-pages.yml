name: Publish GitHub Pages from main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployment is separate from pull-request admission. Let an active publication
# finish so rapid main merges cannot starve Pages; GitHub retains only the newest
# pending run, which publishes after the active one.
concurrency:
  group: pages-production
  cancel-in-progress: false

env:
  # GitHub Pages has a published-site capacity limit. This guards deployment
  # capacity only; it is never a required pull-request check. GitHub Pages
  # permits published sites up to 1 GB; retain a 20 MB deployment margin.
  MAX_PUBLISHED_BYTES: 980000000

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      build_version: ${{ steps.identity.outputs.build_version }}
      game_version: ${{ steps.identity.outputs.game_version }}
      files: ${{ steps.inventory.outputs.files }}
      bytes: ${{ steps.inventory.outputs.bytes }}
    steps:
      - name: Check out the exact protected main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Set up deterministic build runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.2
          cache: npm

      - name: Bind the deployment identity
        id: identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          build_version="main-${source_sha:0:12}"
          game_version="$(node -e "const c=require('./game/build-config.json'); if(!/^(0|[1-9][0-9]{0,4})\\.(0|[1-9][0-9]{0,4})\\.(0|[1-9][0-9]{0,4})$/.test(c.version)) process.exit(1); process.stdout.write(c.version)")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "game_version=$game_version" >> "$GITHUB_OUTPUT"

      - name: Verify exact tracked source before build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-source-identity.mjs --root .

      - name: Install locked build dependencies
        run: npm ci --prefer-offline

      - name: Build the rolling main snapshot
        env:
          GAME_VERSION: ${{ steps.identity.outputs.game_version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/game-cli.mjs build \
            --out "$RUNNER_TEMP/main-pages" \
            --version "$GAME_VERSION" \
            --revision "$SOURCE_SHA" \
            --publication-profile main-pages
          rm "$RUNNER_TEMP/main-pages/distribution.zip" \
            "$RUNNER_TEMP/main-pages/distribution.zip.sha256"

      - name: Stage reviewed Flight practice releases (including an explicit empty directory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/publish-optional-packages.mjs stage-pages \
            --out "$RUNNER_TEMP/main-pages" \
            --selector publishing/pages-controller/optional-packages.json \
            --repository mekhovov/revealline --base-path /revealline/

      - name: Add rolling-channel identity metadata
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.build_version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMITTED_AT="$(git show -s --format=%cI "$SOURCE_SHA")" \
            node scripts/write-main-pages-metadata.mjs

      - name: Verify Pages capacity and record the exact inventory
        id: inventory
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/pages-capacity-evidence.py

      - name: Verify exact tracked source after build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-source-identity.mjs --root .

      - name: Upload deployment receipt
        if: ${{ !cancelled() && (steps.inventory.outcome == 'success' || steps.inventory.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: main-pages-receipt-${{ github.sha }}
          path: |
            ${{ runner.temp }}/main-pages-receipt.json
            ${{ runner.temp }}/main-pages-inventory.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload the exact Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/main-pages
          include-hidden-files: true

      # The pinned composite action leaves the uploaded, uncompressed archive
      # here. Check that actual archive, not a second independently built tar.
      # Uploading is not deployment: any failure below keeps build unsuccessful.
      - name: Verify the uploaded Pages archive against its inventory
        id: archive
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          python3 scripts/pages-archive-evidence.py

      - name: Preserve archive acceptance or failure evidence
        if: ${{ !cancelled() && (steps.archive.outcome == 'success' || steps.archive.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: main-pages-archive-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/main-pages-archive-receipt.json
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact protected main snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the deployed source and selector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            publishing
            game
            optional-practice
            package.json
          sparse-checkout-cone-mode: false

      - name: Set up the matching verification runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.2

      - name: Verify the public root identifies the exact main revision
        env:
          BUILD_VERSION: ${{ needs.build.outputs.build_version }}
          GAME_VERSION: ${{ needs.build.outputs.game_version }}
          PUBLIC_ROOT: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root = process.env.PUBLIC_ROOT.replace(/\/$/, '');
          const expected = {
            format: 'revealline-main-deployment.v1',
            channel: 'main',
            sourceRevision: process.env.SOURCE_SHA,
            buildVersion: process.env.BUILD_VERSION,
            play: 'game/',
          };
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(`${root}/main-deployment.json?main=${process.env.SOURCE_SHA}-${attempt}`, {
                cache: 'no-store',
                headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
                signal: AbortSignal.timeout(15_000),
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const actual = await response.json();
              for (const [key, value] of Object.entries(expected))
                if (actual[key] !== value) throw new Error(`Public ${key} mismatch`);
              console.log(JSON.stringify({ root, ...expected }));
              process.exit(0);
            } catch (error) {
              lastError = error;
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
          }
          throw lastError;
          NODE

      - name: Verify selected practice versions and every published dependency
        env:
          PUBLIC_ROOT: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          node scripts/verify-practice-site.mjs "${PUBLIC_ROOT%/}/" \
            > "$RUNNER_TEMP/practice-site-receipt.json"
          cat "$RUNNER_TEMP/practice-site-receipt.json"

      - name: Preserve the public practice verification receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: practice-site-receipt-${{ needs.build.outputs.source_sha }}
          path: ${{ runner.temp }}/practice-site-receipt.json
          retention-days: 30
          if-no-files-found: error
