name: Published Pages critical-flow smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/published-pages-smoke.yml'
      - 'scripts/solo-pages-smoke*'
      - 'scripts/run-solo-pages-smoke.mjs'
      - 'scripts/run-solo-remote-correctness.mjs'
      - 'scripts/solo-qualification-shared-mode.mjs'
      - 'docs/performance/solo-published-pages-smoke-plan.json'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Fixed optional diagnostic scope
        type: choice
        required: true
        default: none
        options: [none, missions]

permissions:
  contents: read

concurrency:
  group: published-pages-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'mekhovov/revealline' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
