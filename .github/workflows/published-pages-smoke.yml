      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install unchanged owner module dependencies
        run: timeout --signal=TERM --kill-after=15s 4m npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the fixed browser and official Linux dependencies
        timeout-minutes: 10
        run: |
          timeout --signal=TERM --kill-after=30s 4m npm install --prefix "$RUNNER_TEMP/pages-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1
          timeout --signal=TERM --kill-after=30s 6m node "$RUNNER_TEMP/pages-playwright/node_modules/playwright/cli.js" install --with-deps "$PAGES_SMOKE_ENGINE"
      - name: Observe fixed public controls through the ordinary access form
        timeout-minutes: 13
        env:
          EXPECTED_DEPLOYED_SHA: ${{ github.sha }}
          REVEALLINE_PAGES_TEST_PASSWORD: ${{ secrets.REVEALLINE_PAGES_TEST_PASSWORD }}
        run: |
          timeout --signal=TERM --kill-after=30s 12m node scripts/run-solo-pages-smoke.mjs \
            "$EXPECTED_DEPLOYED_SHA" \
            "$RUNNER_TEMP/pages-playwright/node_modules/playwright/index.mjs" \
            "$RUNNER_TEMP/pages-smoke-evidence"
      - name: Bound sanitized evidence only
        id: browser_evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, lstatSync } from 'node:fs';
          const root = process.env.RUNNER_TEMP + '/pages-smoke-evidence/';
          let total = 0, count = 0;
          for (const name of ['summary.json', 'report.json', 'child-log.json', 'failure-envelope.json']) {
            if (!existsSync(root + name)) continue;
            const stat = lstatSync(root + name);
            assert(stat.isFile() && !stat.isSymbolicLink());
            total += stat.size; count++;
          }
          assert(count > 0 && total <= 4 * 1024 ** 2);
          NODE
      - uses: actions/upload-artifact@v4
        if: always() && steps.browser_evidence.outcome == 'success'
        with:
          name: published-pages-controls-${{ matrix.engine }}-${{ inputs.diagnostic || 'none' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pages-smoke-evidence/summary.json
            ${{ runner.temp }}/pages-smoke-evidence/report.json
            ${{ runner.temp }}/pages-smoke-evidence/child-log.json
            ${{ runner.temp }}/pages-smoke-evidence/failure-envelope.json
          if-no-files-found: error
          retention-days: 14
