    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [chromium, webkit]
    env:
      PAGES_SMOKE_ENGINE: ${{ matrix.engine }}
      PAGES_SMOKE_DIAGNOSTIC: ${{ inputs.diagnostic || 'none' }}
    steps:
