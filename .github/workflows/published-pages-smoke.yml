            /scripts/solo-qualification-shared-mode.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install source-control dependencies
        run: timeout --signal=TERM --kill-after=15s 4m npm ci --ignore-scripts --no-audit --no-fund
      - name: Retain exact source identity
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-source-evidence"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 5000 }).trim();
          assert.equal(process.versions.node, '22.13.1');
          assert.equal(git('rev-parse', 'HEAD'), process.env.GITHUB_SHA);
          assert.equal(git('status', '--porcelain=v1', '--untracked-files=no'), '');
          writeFileSync(process.env.RUNNER_TEMP + '/pages-source-evidence/source.json', JSON.stringify({
            format: 'RevealLinePagesSmokeSourceIdentityV1',
            revision: process.env.GITHUB_SHA, tree: git('rev-parse', 'HEAD^{tree}'),
            node: process.versions.node, event: process.env.GITHUB_EVENT_NAME,
            pullRequestHead: process.env.PR_HEAD || null, pullRequestBase: process.env.PR_BASE || null,
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            scope: 'Identity only. Complete TAP and job conclusion establish the source-control result.',
          }, null, 2) + '\n');
          NODE
      - name: Complete source controls
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 5m node --test scripts/solo-pages-smoke.test.mjs \
            | tee "$RUNNER_TEMP/pages-source-evidence/controls.tap"
      - name: Check only the new source and declaration style
        run: |
          timeout --signal=TERM --kill-after=15s 1m npx --no-install eslint scripts/solo-pages-smoke.mjs scripts/run-solo-pages-smoke.mjs scripts/solo-pages-smoke.test.mjs --max-warnings 0
          timeout --signal=TERM --kill-after=15s 1m npx --no-install prettier --check scripts/solo-pages-smoke.mjs scripts/run-solo-pages-smoke.mjs scripts/solo-pages-smoke.test.mjs docs/performance/solo-published-pages-smoke-plan.json .github/workflows/published-pages-smoke.yml
      - name: Bound source evidence
        id: source_evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, lstatSync } from 'node:fs';
          const root = process.env.RUNNER_TEMP + '/pages-source-evidence/';
          let total = 0, count = 0;
          for (const name of ['source.json', 'controls.tap']) {
            if (!existsSync(root + name)) continue;
            const stat = lstatSync(root + name);
            assert(stat.isFile() && !stat.isSymbolicLink());
            total += stat.size; count++;
          }
          assert(count > 0 && total <= 4 * 1024 ** 2);
          NODE
      - uses: actions/upload-artifact@v4
        if: always() && steps.source_evidence.outcome == 'success'
        with:
          name: published-pages-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pages-source-evidence/source.json
            ${{ runner.temp }}/pages-source-evidence/controls.tap
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: source
    if: >-
      github.repository == 'mekhovov/revealline' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
