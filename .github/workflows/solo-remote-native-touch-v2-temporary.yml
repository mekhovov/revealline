      - timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 8b01991942dc764b8aa4726851699ce1985e53ae
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: a6eacee2f09f06f9ffa76fe8cd5d674aff0475a4
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Record setup and install exact source dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "SOLO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/solo-browser-tools/node_modules/playwright/index.mjs" \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solo-browser-binaries" \
            "OUTPUT=$RUNNER_TEMP/solo-linux-native-touch-v2-${{ matrix.job }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/solo-linux-setup"
          test "$(git -C tools rev-parse HEAD)" = "$SOLO_TOOLING_REVISION"
          npm ci --prefix tools --no-audit --no-fund 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/tools-npm.log"
      - name: Install the separately pinned browser cohort
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/solo-browser-tools"
          npm install --prefix "$RUNNER_TEMP/solo-browser-tools" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.62.1 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/browser-install.log"
          "$RUNNER_TEMP/solo-browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/browser-dependencies.log"
          cp "$RUNNER_TEMP/solo-browser-tools/package-lock.json" "$RUNNER_TEMP/solo-linux-setup/browser-package-lock.json"
          {
            timeout --signal=TERM --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y x11-utils
            dpkg-query -W -f='${binary:Package} ${Version}\n' x11-utils xvfb xauth
            for binary in /usr/bin/xvfb-run /usr/bin/Xvfb /usr/bin/xauth /usr/bin/xdpyinfo; do
              test -x "$binary"
            done
            sha256sum /usr/bin/xvfb-run /usr/bin/Xvfb /usr/bin/xauth /usr/bin/xdpyinfo
            timeout 10s /usr/bin/xdpyinfo -version
          } 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/display-dependencies.log"
      - name: Exercise archive rejection and owned timeout cleanup
        timeout-minutes: 3
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 scripts/test-solo-remote-touch.mjs scripts/test-solo-qualification-cadence.mjs scripts/test-solo-qualification-input-mechanics.mjs scripts/test-solo-qualification-replay-identity.mjs scripts/test-solo-build-worker-closure.mjs scripts/test-solo-remote-correctness.mjs scripts/test-solo-remote-baseline.mjs scripts/test-solo-source-verifier-smoke.mjs scripts/test-solo-native-touch-release.mjs scripts/test-solo-native-touch-v2-release.mjs 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/wrapper-tests.tap"
          node scripts/solo-remote-touch.mjs bind-plan docs/performance/solo-native-touch-v2-plan.json "$RUNNER_TEMP/touch-plan.json" "${{ matrix.job }}"
      - name: Run three fixed native touch observations
        timeout-minutes: 78
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=30s 4620s node scripts/run-solo-remote-correctness.mjs "$RUNNER_TEMP/touch-plan.json" "$OUTPUT"
      - name: Describe bounded setup evidence without claiming truncated output complete
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'solo-linux-setup'
          root.mkdir(exist_ok=True)
          rows=[]
          failed=False
          for name in ['tools-npm.log','display-dependencies.log','browser-install.log','browser-dependencies.log','wrapper-tests.tap','browser-package-lock.json']:
              path=root/name
              if not path.exists():
                  rows.append({'path':name,'status':'not-retained-setup-incomplete'})
                  continue
              size=path.stat().st_size
              assert size <= 4*1024*1024, 'Setup file exceeded fixed bound'
              capped=size == 4*1024*1024
              failed |= capped
              rows.append({'path':name,'bytes':size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'status':'cap-reached-completeness-unconfirmed' if capped else 'retained'})
          (root/'retention.json').write_text(json.dumps({'status':'failed-output-cap' if failed else 'retained','files':rows,'maximumTotalBytes':24*1024*1024},indent=2)+'\n')
          if failed: raise SystemExit(1)
          PYCODE
      - name: Retain all complete, failed and partial evidence
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-linux-native-touch-v2-${{ matrix.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solo-linux-native-touch-v2-${{ matrix.job }}/evidence/
            ${{ runner.temp }}/solo-linux-setup/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
