name: Temporary Solo native touch display setup successor

on:
  pull_request:
    paths:
      - 'scripts/test-solo-native-touch-release.mjs'
      - 'scripts/test-solo-remote-touch.mjs'
      - '.github/workflows/solo-remote-native-touch-temporary.yml'
      - 'docs/performance/solo-native-touch-plan.json'
      - 'docs/performance/solo-native-touch-v2-plan.json'
      - '.github/workflows/solo-remote-native-touch-v2-temporary.yml'
      - 'scripts/test-solo-native-touch-v2-release.mjs'
      - 'scripts/solo-remote-touch.mjs'
      - 'scripts/observe-solo-native-touch.mjs'
      - 'scripts/test-solo-source-verifier-smoke.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-native-touch-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  touch:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        job: [chromium-dpad, webkit-dpad, chromium-stick, chromium-swipe]
    # Independent excluded diagnostics on one prospective push edge only.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'c41a02216c0811952232a387fd1743e09452c269'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-remote-native-touch-temporary.yml
            /.github/workflows/solo-remote-native-touch-v2-temporary.yml
