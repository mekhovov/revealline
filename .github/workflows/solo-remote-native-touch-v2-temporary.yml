            /docs/performance/fixtures/solo-remote-timing/cold-first30.qualification.fixture
            /docs/performance/solo-native-touch-plan.json
            /docs/performance/solo-native-touch-v2-plan.json
            /docs/performance/solo-remote-final-earned-raster-plan.json
            /game/build-config.json
