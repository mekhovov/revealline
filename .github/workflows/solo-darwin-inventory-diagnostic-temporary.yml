name: Temporary read-only Darwin inventory denial diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/solo-darwin-inventory-diagnostic-temporary.yml'
      - 'scripts/solo-darwin-process-inventory.c'
      - 'scripts/solo-darwin-process-inventory.mjs'
      - 'scripts/test-solo-darwin-inventory-diagnostic.mjs'

permissions:
  contents: read

concurrency:
  group: solo-darwin-inventory-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnostic:
    # One declared diagnostic only; no browser, media or game observation.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'a7e0219818842f02399317ca6d2a14bdd506da3d'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/solo-darwin-process-inventory.c
            /scripts/solo-darwin-process-inventory.mjs
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        timeout-minutes: 1
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Compile the exact current read-only inventory
        timeout-minutes: 2
        run: |
          set -euo pipefail
          owner_dir=$(mktemp -d /tmp/solo-process-owner.XXXXXX)
          owner_dir=$(cd "$owner_dir" && pwd -P)
          node scripts/solo-darwin-process-inventory.mjs build "$owner_dir" "$RUNNER_TEMP/solo-native-mp3-owner-build.json"
      - name: Retain one bounded inventory result and any denied PID identity hint
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdir, writeFile, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { admitDarwinBuildReceipt } from './scripts/solo-darwin-process-inventory.mjs';
          const out=join(process.env.RUNNER_TEMP,'solo-darwin-inventory-diagnostic');
          await mkdir(out);
          const admitted=admitDarwinBuildReceipt(process.env,process.env.SOLO_TOOLING_REVISION);
          const maximum=8*1024*1024, hash=b=>createHash('sha256').update(b).digest('hex');
          const run=spawnSync(admitted.receipt.binary.path,['all',''],{timeout:3000,maxBuffer:maximum,stdio:['ignore','pipe','pipe']});
          const records=[];
          for(const [name,bytes,limit] of [['stdout',run.stdout??Buffer.alloc(0),maximum],['stderr',run.stderr??Buffer.alloc(0),65536]]){
            const retained=bytes.subarray(0,limit);
            await writeFile(join(out,`inventory-${name}.txt`),retained,{flag:'wx'});
            records.push({name,bytes:retained.length,sha256:hash(retained),capped:bytes.length>=limit});
          }
          const message=(run.stderr??Buffer.alloc(0)).subarray(0,65536).toString('utf8');
          const match=message.match(/identity inspection \((\d+)\) pid=(\d+) selector=(all|one) result=(-?\d+) expected=(\d+)/);
          let deniedIdentityHint=null;
          if(match){
            const pid=Number(match[2]);assert(Number.isSafeInteger(pid)&&pid>0);
            const hint=spawnSync('/bin/ps',['-p',String(pid),'-o','pid=,ppid=,pgid=,uid=,comm='],{timeout:3000,maxBuffer:65536,stdio:['ignore','pipe','pipe']});
            const bytes=(hint.stdout??Buffer.alloc(0)).subarray(0,65536);
            await writeFile(join(out,'denied-pid-ps-hint.txt'),bytes,{flag:'wx'});
            deniedIdentityHint={pid,identityAuthority:false,scope:'Later read-only process hint; PID reuse or disappearance is possible. No ownership or signalling authority.',status:hint.status,signal:hint.signal,error:hint.error?.code??null,bytes:bytes.length,sha256:hash(bytes)};
          }
          const report={format:'SoloDarwinInventoryDenialDiagnosticV1',sourceRevision:process.env.SOLO_TOOLING_REVISION,status:run.status===0&&!run.error&&!records.some(r=>r.capped)?'inventory-observed':'failed-inventory-retained',uid:process.getuid(),euid:process.geteuid(),exitCode:run.status,signal:run.signal,error:run.error?.code??null,command:['all',''],maximumMs:3000,maximumBytes:maximum,records,deniedIdentityHint,mediaObservations:0,ownershipQualification:false,performanceQualification:false,build:admitted.receipt};
          await writeFile(join(out,'report.json'),JSON.stringify(report,null,2)+'\n',{flag:'wx'});
          assert((await readFile(join(out,'report.json'))).length<=1024*1024);
          if(report.status!=='inventory-observed')process.exitCode=1;
          NODE
      - name: Retain the failed or complete original inspection
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-darwin-inventory-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solo-darwin-inventory-diagnostic
            ${{ runner.temp }}/solo-native-mp3-owner-build.json
          if-no-files-found: warn
          retention-days: 14
