name: Temporary Solo final earned native raster

on:
  pull_request:
    paths:
      - 'scripts/test-solo-final-earned-raster.mjs'
      - '.github/workflows/solo-remote-final-earned-raster-temporary.yml'
      - 'scripts/solo-remote-raster.mjs'
      - 'scripts/test-solo-remote-raster.mjs'
      - 'scripts/observe-solo-native-raster.mjs'
      - 'scripts/solo-raster-protocols.mjs'
      - 'docs/performance/fixtures/solo-remote-raster/**'
      - 'scripts/run-solo-remote-correctness.mjs'
      - 'docs/performance/solo-remote-final-earned-raster-plan.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-final-earned-raster-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  raster:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        job: [raster-chromium, raster-webkit]
    # Independent excluded diagnostics on one prospective push edge only.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'a6eacee2f09f06f9ffa76fe8cd5d674aff0475a4'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-remote-final-earned-raster-temporary.yml
