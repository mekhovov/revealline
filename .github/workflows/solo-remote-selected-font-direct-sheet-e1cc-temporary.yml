name: HELD Solo e1cc selected font direct stylesheet successor

on:
  pull_request:
    paths:
      - 'scripts/solo-remote-readiness.mjs'
      - '.github/workflows/solo-remote-selected-font-direct-sheet-e1cc-temporary.yml'
      - 'docs/performance/solo-selected-font-direct-sheet-e1cc-plan.json'
      - 'scripts/solo-qualification-readiness.mjs'
      - 'scripts/solo-readiness-gpu.mjs'
      - '.github/workflows/solo-remote-readiness-ab45-temporary.yml'
      - 'docs/performance/solo-readiness-font-dpr-c696-plan.json'
      - 'docs/performance/fixtures/solo-readiness-resume/**'
      - 'docs/performance/fixtures/solo-remote-timing/public-effects-*.qualification.fixture'
      - 'scripts/solo-qualification-observation.mjs'
      - 'scripts/qualify-solo-runtime.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-selected-font-direct-sheet-e1cc-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  readiness:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [webkit]
    # Reviewed excluded diagnostics on one exact prospective push edge only.
    # Held until reviewed release of the exact existing-link observation correction.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == '39774cce8697d412d138ef4da11ac547a5f8e535'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
