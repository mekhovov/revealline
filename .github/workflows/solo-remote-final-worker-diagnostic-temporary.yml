name: Temporary Solo final WebKit worker interruption diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/solo-remote-final-worker-diagnostic-temporary.yml'
      - 'docs/performance/solo-final-worker-diagnostic-plan.json'
      - 'scripts/external-distribution.mjs'
      - 'scripts/optional-artwork.mjs'
      - 'scripts/optional-distribution.mjs'
      - 'scripts/run-solo-remote-correctness.mjs'
      - 'scripts/solo-remote-worker-diagnostic.mjs'
      - 'scripts/soundtrack-distribution.mjs'
      - 'scripts/test-solo-build-worker-closure.mjs'
      - 'scripts/test-solo-final-worker-diagnostic.mjs'
      - 'scripts/test-solo-remote-correctness.mjs'
      - 'scripts/test-solo-remote-worker-confirmation.mjs'
      - 'scripts/test-solo-remote-worker-diagnostic.mjs'
      - 'scripts/test-solo-source-verifier-smoke.mjs'
      - 'scripts/test-solo-worker-diagnostics.mjs'
      - 'scripts/verify-solo-build.mjs'
      - 'scripts/verify-solo-mp3-worker.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-final-worker-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  worker-diagnostic:
    # One prospective push edge only; later commits cannot silently repeat these six windows.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'a7e0219818842f02399317ca6d2a14bdd506da3d'
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Initialize paths after the runner is assigned
        timeout-minutes: 1
        shell: bash
        run: |
          printf '%s\n' \
            "SOLO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/solo-browser-tools/node_modules/playwright/index.mjs" \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solo-browser-binaries" \
            "OUTPUT=$RUNNER_TEMP/solo-linux-final-worker-diagnostic" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-remote-correctness-temporary.yml
            /.github/workflows/solo-remote-final-worker-diagnostic-temporary.yml
            /.github/workflows/solo-remote-worker-confirmation-temporary.yml
            /.github/workflows/solo-remote-worker-diagnostic-temporary.yml
