name: Stage unallocated pull requests

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  pull-requests: write

concurrency:
  group: stage-unallocated-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stage:
    # A release title allocates a product slot. A maintainer can explicitly
    # allocate a non-product change by applying the release-train-approved
    # label before making it ready for review.
    if: >-
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.title, 'Release v') &&
      !contains(github.event.pull_request.labels.*.name, 'release-train-approved')
    runs-on: ubuntu-latest
    steps:
      - name: Return unallocated work to draft
        uses: actions/github-script@v7
        with:
          script: |
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) {
                  pullRequest { number isDraft }
                }
              }`,
              { pullRequestId: context.payload.pull_request.node_id },
            );
