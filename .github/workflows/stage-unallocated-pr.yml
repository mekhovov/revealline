name: Record queue admission

on:
  pull_request_target:
    types:
      [opened, reopened]

concurrency:
  group: stage-unallocated-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record unrestricted queue admission
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.notice('Queue admission is unrestricted; no hold label or draft transition is applied.');
