name: Independently verify frozen artifacts without publishing

on:
  push:
    branches: ['codex/verify-qualified-freeze-artifacts']

permissions:
  contents: read
  actions: read

concurrency:
  group: qualified-artifact-reverify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - version: v0.49.0
            source: 8af0d47d73e8633c771823fe024a3456441d62c1
          - version: v0.50.0
            source: d52b634a231ce0907b83ea681e1e1aaf02387485
          - version: v0.51.0
            source: 5d4bd98718955fa471fe71d798715864af166d18
    steps:
      - name: Check out fresh immutable source for Git body verification
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Check out separate independent verification controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: controller
          sparse-checkout: publishing/qualified-freeze
          persist-credentials: false
      - name: Test independent verification guards
        run: python3 -B controller/publishing/qualified-freeze/test-reverify.py -v
      - name: Independently verify all artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B controller/publishing/qualified-freeze/reverify.py '${{ matrix.version }}' source export
      - name: Retain verification proof and original metadata only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverified-${{ matrix.version }}-proof
          path: export/proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
