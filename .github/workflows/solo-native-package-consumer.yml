name: Solo verified package consumer

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/solo-native-package-consumer.yml'
      - 'docs/performance/solo-remote-de332-correctness-tooling-plan.json'
      - 'docs/performance/solo-next-geometric-de332-tooling-plan.json'
      - 'scripts/test-solo-de332-correctness.mjs'
      - 'scripts/test-solo-next-de332-admission.mjs'
      - 'scripts/solo-qualification-next-route.mjs'
      - 'scripts/solo-remote-sustained.mjs'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fixed de332 package diagnostics or separate Cocoa codec control. Review first-eight before Next; no automatic retries.'
        type: choice
        required: true
        default: first-eight
        options: [first-eight, next, cocoa, raster, hud-cpu]

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-native-de332-${{ inputs.lane || 'first-eight' }}
  cancel-in-progress: false

jobs:
  cocoa:
    # Explicit separate codec control; never starts from a PR or a Linux lane.
    if: github.repository == 'mekhovov/revealline' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.lane == 'cocoa'
    runs-on: macos-15-intel
    timeout-minutes: 28
    env:
      SOLO_DARWIN_AMBIGUITY_EVIDENCE: 'identity-maps-v2'
      SOLO_TOOLING_REVISION: ${{ github.sha }}
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          # Exact source/test/data closure; this pinned action uses blob:none for sparse fetch.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
