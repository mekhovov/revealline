      - timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 8b01991942dc764b8aa4726851699ce1985e53ae
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - name: Materialize the exact candidate from the shared source object store
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solo-linux-setup"
          bash tools/scripts/solo-shared-source-checkout.sh 8b01991942dc764b8aa4726851699ce1985e53ae 9373b6a74aea8fa1ef47aa17ace140b4cf714609 de3324607c82787c1a1fec9c13d4f8b5cb74cee4 2954fef5b0f1293ff2e6a97ce978a673dddaa7db > "$RUNNER_TEMP/solo-linux-setup/source-checkout.json"
      - timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Record setup and install exact source dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "SOLO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/solo-browser-tools/node_modules/playwright/index.mjs" \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solo-browser-binaries" \
            "OUTPUT=$RUNNER_TEMP/solo-linux-de332-geometric-next-${{ matrix.phase }}-${{ matrix.engine }}-${{ matrix.repetition }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/solo-linux-setup"
          test "$(git -C tools rev-parse HEAD)" = "$SOLO_TOOLING_REVISION"
          npm ci --prefix tools --no-audit --no-fund 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/tools-npm.log"
      - name: Install the separately pinned browser cohort
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/solo-browser-tools"
          npm install --prefix "$RUNNER_TEMP/solo-browser-tools" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.62.1 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/browser-install.log"
          "$RUNNER_TEMP/solo-browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/browser-dependencies.log"
          cp "$RUNNER_TEMP/solo-browser-tools/package-lock.json" "$RUNNER_TEMP/solo-linux-setup/browser-package-lock.json"
      - name: Exercise archive rejection and owned timeout cleanup
        timeout-minutes: 3
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 scripts/test-solo-native-consumer-current.mjs scripts/test-solo-next-de332-admission.mjs scripts/test-solo-next-geometric-admission.mjs scripts/test-solo-next-e1cc-admission.mjs scripts/test-solo-next-baseline-dispatch.mjs scripts/test-solo-remote-correctness.mjs scripts/test-solo-source-verifier-smoke.mjs scripts/test-solo-final-lifecycle-admission.mjs scripts/test-solo-qualification-next-route.mjs scripts/test-solo-qualification-hitch-journal.mjs 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/wrapper-tests.tap"
          node scripts/solo-remote-sustained.mjs bind-plan docs/performance/solo-next-geometric-de332-tooling-plan.json "$RUNNER_TEMP/solo-sustained-job.json" '${{ matrix.engine }}' '${{ matrix.repetition }}'
      - name: Collect six independent candidate-only transition observations with unchanged gates
        timeout-minutes: ${{ matrix.stepMinutes }}
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=30s ${{ matrix.outerSeconds }}s node scripts/run-solo-remote-correctness.mjs "$RUNNER_TEMP/solo-sustained-job.json" "$OUTPUT"
      - name: Describe bounded setup evidence without claiming truncated output complete
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'solo-linux-setup'
          root.mkdir(exist_ok=True)
          rows=[]
          failed=False
          for name in ['source-checkout.json','tools-npm.log','browser-install.log','browser-dependencies.log','wrapper-tests.tap','browser-package-lock.json']:
              path=root/name
              if not path.exists():
                  rows.append({'path':name,'status':'not-retained-setup-incomplete'})
                  continue
              size=path.stat().st_size
              assert size <= 4*1024*1024, 'Setup file exceeded fixed bound'
              capped=size == 4*1024*1024
              failed |= capped
              rows.append({'path':name,'bytes':size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'status':'cap-reached-completeness-unconfirmed' if capped else 'retained'})
          (root/'retention.json').write_text(json.dumps({'status':'failed-output-cap' if failed else 'retained','files':rows,'maximumTotalBytes':24*1024*1024},indent=2)+'\n')
          if failed: raise SystemExit(1)
          PYCODE
      - name: Retain all complete, failed and partial evidence
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-linux-de332-geometric-next-${{ matrix.phase }}-${{ matrix.engine }}-r${{ matrix.repetition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solo-linux-de332-geometric-next-${{ matrix.phase }}-${{ matrix.engine }}-${{ matrix.repetition }}/evidence/
            ${{ runner.temp }}/solo-linux-setup/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
