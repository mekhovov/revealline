            dpkg-query -W -f='${binary:Package} ${Version}\n' x11-utils xvfb xauth
            for tool in xvfb-run Xvfb xauth xdpyinfo; do test -x "/usr/bin/$tool"; done
            timeout 10s /usr/bin/xdpyinfo -version
          } 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/browser-dependencies.log"
          cp "$RUNNER_TEMP/solo-browser-tools/package-lock.json" "$RUNNER_TEMP/solo-linux-setup/browser-package-lock.json"
      - name: Exercise archive rejection and owned timeout cleanup
        timeout-minutes: 3
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 scripts/test-solo-remote-correctness.mjs scripts/test-solo-remote-baseline.mjs scripts/test-solo-source-verifier-smoke.mjs scripts/test-solo-remote-demo.mjs scripts/test-solo-demo-797e03-admission.mjs scripts/test-solo-demo-797e03-tooling-admission.mjs scripts/test-solo-demo-trusted-close-admission.mjs scripts/test-solo-owned-resource-assessment.mjs scripts/test-solo-qualification-snapshot-store.mjs scripts/test-solo-native-consumer-shared-demo.mjs 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-linux-setup/wrapper-tests.tap"
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {validateDemoPlan} from "./scripts/solo-remote-demo.mjs"; validateDemoPlan(JSON.parse(await readFile("docs/performance/solo-demo-recovery-797e03-current-tooling-plan.json", "utf8")));'
      - name: Run the separate fixed Demo recovery observation
        timeout-minutes: 79
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=30s 4620s node scripts/run-solo-remote-correctness.mjs docs/performance/solo-demo-recovery-797e03-current-tooling-plan.json "$OUTPUT"
      - name: Describe bounded setup evidence without claiming truncated output complete
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'solo-linux-setup'
          root.mkdir(exist_ok=True)
          rows=[]
          failed=False
          for name in ['source-checkout.json','tools-npm.log','browser-install.log','browser-dependencies.log','wrapper-tests.tap','browser-package-lock.json']:
              path=root/name
              if not path.exists():
                  rows.append({'path':name,'status':'not-retained-setup-incomplete'})
                  continue
              size=path.stat().st_size
              assert size <= 4*1024*1024, 'Setup file exceeded fixed bound'
              capped=size == 4*1024*1024
              failed |= capped
              rows.append({'path':name,'bytes':size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'status':'cap-reached-completeness-unconfirmed' if capped else 'retained'})
          (root/'retention.json').write_text(json.dumps({'status':'failed-output-cap' if failed else 'retained','files':rows,'maximumTotalBytes':24*1024*1024},indent=2)+'\n')
          if failed: raise SystemExit(1)
          PYCODE
      - name: Retain all complete, failed and partial evidence
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-linux-runtime797-demo-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solo-linux-runtime797-demo-recovery/evidence/
            ${{ runner.temp }}/solo-linux-setup/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

