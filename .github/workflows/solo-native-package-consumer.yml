name: Solo verified package consumer

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/solo-native-package-consumer.yml'
      - 'docs/performance/solo-remote-de332-correctness-plan.json'
      - 'docs/performance/solo-next-geometric-de332-plan.json'
      - 'scripts/test-solo-de332-correctness.mjs'
      - 'scripts/test-solo-next-de332-admission.mjs'
      - 'scripts/solo-qualification-next-route.mjs'
      - 'scripts/solo-remote-sustained.mjs'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Exact de332 package. Select Next only after reviewing its fresh first-eight result.'
        type: choice
        required: true
        default: first-eight
        options: [first-eight, next]

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-native-de332-${{ inputs.lane || 'first-eight' }}
  cancel-in-progress: false

jobs:
  correctness:
    # Only the reviewed PR edge or explicit fixed-source manual selection; fresh owners remain mandatory.
    if: github.repository == 'mekhovov/revealline' && ((github.event_name == 'pull_request' && github.event.pull_request.number == 1578 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'c82d0825999f014c7a5c17386542f3219f4f04e5') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.lane == 'first-eight'))
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Initialize paths after the runner is assigned
        timeout-minutes: 1
        shell: bash
        run: |
          printf '%s\n' \
            "SOLO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/solo-browser-tools/node_modules/playwright/index.mjs" \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solo-browser-binaries" \
            "OUTPUT=$RUNNER_TEMP/solo-linux-de332-correctness" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
