      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        timeout-minutes: 1
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Install the pinned owner tooling dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-owner-v2-dependencies.log"
      - name: Compile and retain the exact V3 read-only process inventory
        timeout-minutes: 2
        run: |
          set -euo pipefail
          owner_dir=$(mktemp -d /tmp/solo-process-owner-v2.XXXXXX)
          owner_dir=$(cd "$owner_dir" && pwd -P)
          node scripts/solo-darwin-process-inventory.mjs build "$owner_dir" "$RUNNER_TEMP/solo-owner-v2-build.json"
      - name: Run pure and mocked SDK contracts before any native owned family
        timeout-minutes: 3
        env:
          SOLO_DARWIN_FAULT_EVIDENCE: ${{ runner.temp }}/solo-owner-v2-sdk-observations.json
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 scripts/test-solo-darwin-process-inventory.mjs scripts/test-solo-darwin-process-inventory-sdk.mjs scripts/test-solo-darwin-owner-preflight.mjs > "$RUNNER_TEMP/solo-owner-v2-contracts.tap" 2>&1
      - name: Observe the three declared non-browser process cases once
        id: owner-proof
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node scripts/solo-darwin-owner-preflight.mjs run "$RUNNER_TEMP/solo-owner-v2-preflight"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, appendFile, lstat } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { assessDarwinOwnerCase } from './scripts/solo-darwin-owner-preflight.mjs';
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          // BEGIN OWNER HANDOFF ADMISSION
          function admitOwnerHandoff(report, source, sources) {
            assert.match(source, /^[a-f0-9]{40}$/);
            assert.equal(report.format, 'SoloDarwinNonBrowserOwnerPreflightV1');
            assert.equal(report.sourceRevision, source);
            assert.equal(report.status, 'passed');
            assert.equal(report.platform, 'darwin');
            assert.equal(report.architecture, 'x64');
            assert(!report.failure);
            assert.equal(report.ownershipQualification, false);
            assert.equal(report.browserObservations, 0);
            assert.equal(report.mediaObservations, 0);
            assert.equal(report.performanceQualification, false);
            assert.deepEqual(report.sources, sources);
            assert.deepEqual(report.cases.map(row => row.id), ['leader', 'tree', 'deadline']);
            for (const row of report.cases) {
              assert(!row.failure);
              const assessed = assessDarwinOwnerCase(row.id, row.command, row.observations, source);
              assert.deepEqual(row.assessment, assessed);
              assert.equal(row.status, row.id === 'deadline' ? 'expected-negative-observed' : 'passed');
              assert.equal(assessed.status, row.status);
            }
            return true;
          }
          // END OWNER HANDOFF ADMISSION
          const source = process.env.SOLO_TOOLING_REVISION;
          const reportPath = process.env.RUNNER_TEMP + '/solo-owner-v2-preflight/report.json';
          const before = await lstat(reportPath);
          assert(before.isFile() && !before.isSymbolicLink() && before.size <= 262144);
          const bytes = await readFile(reportPath), after = await lstat(reportPath);
          assert(bytes.length === before.size && after.ino === before.ino && after.dev === before.dev && after.size === before.size && after.mtimeMs === before.mtimeMs);
          const sources = [];
          for (const path of ['scripts/solo-darwin-owner-preflight.mjs', 'scripts/solo-darwin-process-inventory.mjs', 'scripts/solo-darwin-process-inventory.c', 'scripts/run-solo-remote-correctness.mjs']) {
            const stat = await lstat(path);
            assert(stat.isFile() && !stat.isSymbolicLink() && stat.size <= 262144);
            const data = await readFile(path);
            assert.equal(data.length, stat.size);
            sources.push({ path, bytes: data.length, sha256: hash(data) });
          }
          admitOwnerHandoff(JSON.parse(bytes), source, sources);
          await appendFile(process.env.GITHUB_OUTPUT, `status=passed\nsource=${source}\nreportSha256=${hash(bytes)}\nreportBytes=${bytes.length}\n`);
          NODE
      - name: Retain complete, failed, partial and withheld ownership results
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-darwin-owner-v2-preflight-${{ github.run_id }}-${{ github.run_attempt }}
