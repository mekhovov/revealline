            /scripts/offline-core-closure.mjs
            /scripts/pack-indexes.mjs
            /scripts/run-solo-remote-correctness.mjs
            /scripts/serve-production-preview.mjs
            /scripts/solo-darwin-owner-preflight.mjs
            /scripts/solo-darwin-process-inventory.c
            /scripts/solo-darwin-process-inventory.mjs
            /scripts/test-solo-darwin-owner-preflight.mjs
            /scripts/test-solo-darwin-process-inventory-sdk.mjs
            /scripts/test-solo-darwin-process-inventory.mjs
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        timeout-minutes: 1
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Install the pinned owner tooling dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-owner-v2-dependencies.log"
      - name: Compile and retain the exact V3 read-only process inventory
        timeout-minutes: 2
        run: |
          set -euo pipefail
          owner_dir=$(mktemp -d /tmp/solo-process-owner-v2.XXXXXX)
          owner_dir=$(cd "$owner_dir" && pwd -P)
          node scripts/solo-darwin-process-inventory.mjs build "$owner_dir" "$RUNNER_TEMP/solo-owner-v2-build.json"
      - name: Run pure and mocked SDK contracts before any native owned family
        timeout-minutes: 3
        env:
          SOLO_DARWIN_FAULT_EVIDENCE: ${{ runner.temp }}/solo-owner-v2-sdk-observations.json
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 scripts/test-solo-darwin-process-inventory.mjs scripts/test-solo-darwin-process-inventory-sdk.mjs scripts/test-solo-darwin-owner-preflight.mjs > "$RUNNER_TEMP/solo-owner-v2-contracts.tap" 2>&1
      - name: Observe the three declared non-browser process cases once
        timeout-minutes: 6
        run: node scripts/solo-darwin-owner-preflight.mjs run "$RUNNER_TEMP/solo-owner-v2-preflight"
      - name: Retain complete, failed, partial and withheld ownership results
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-darwin-owner-v2-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solo-owner-v2-preflight
            ${{ runner.temp }}/solo-owner-v2-build.json
            ${{ runner.temp }}/solo-owner-v2-contracts.tap
            ${{ runner.temp }}/solo-owner-v2-dependencies.log
            ${{ runner.temp }}/solo-owner-v2-sdk-observations.json
          if-no-files-found: warn
          retention-days: 14
