            /scripts/test-solo-remote-correctness.mjs
      - timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Retain the exact successful prerequisite identity before native setup
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          const env = process.env;
          assert.equal(env.PRIOR_OWNER_STATUS, 'passed');
          assert.equal(env.PRIOR_OWNER_SOURCE, env.SOLO_TOOLING_REVISION);
          assert.match(env.PRIOR_OWNER_SOURCE, /^[a-f0-9]{40}$/);
          assert.match(env.PRIOR_OWNER_REPORT_SHA256, /^[a-f0-9]{64}$/);
          assert.match(env.PRIOR_OWNER_REPORT_BYTES, /^[1-9][0-9]*$/);
          assert(Number(env.PRIOR_OWNER_REPORT_BYTES) <= 262144);
          assert.match(env.GITHUB_RUN_ID, /^[1-9][0-9]*$/);
          assert.match(env.GITHUB_RUN_ATTEMPT, /^[1-9][0-9]*$/);
          await writeFile(env.RUNNER_TEMP + '/solo-native-mp3-prerequisite.json', JSON.stringify({
            format: 'SoloCocoaPrerequisiteJobReceiptV1',
            workflowRun: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT,
            sourceRevision: env.PRIOR_OWNER_SOURCE,
            report: {bytes: Number(env.PRIOR_OWNER_REPORT_BYTES), sha256: env.PRIOR_OWNER_REPORT_SHA256},
            prerequisiteJob: 'preflight', status: 'passed-declared-non-browser-cases',
            scope: 'Same-workflow prior-host case proof only; this Cocoa host still requires its own inventory and blank-browser owner gate.',
          }, null, 2) + '\n', {flag: 'wx'});
          NODE
      - name: Compile the exact read-only SDK inventory and pin its owned binary
        timeout-minutes: 2
        run: |
          set -euo pipefail
          owner_dir=$(mktemp -d /tmp/solo-process-owner.XXXXXX)
          owner_dir=$(cd "$owner_dir" && pwd -P)
          node scripts/solo-darwin-process-inventory.mjs build "$owner_dir" "$RUNNER_TEMP/solo-native-mp3-owner-build.json"
      - name: Verify native inventory and existing process/media ownership contracts
        timeout-minutes: 2
        env:
          SOLO_RUN_DARWIN_OWNER_TESTS: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=2 scripts/test-solo-darwin-process-inventory.mjs scripts/test-solo-native-mp3-control.mjs scripts/test-solo-qualification-browser-context.mjs scripts/test-solo-remote-correctness.mjs
      - name: Install exact Cocoa WebKit without changing the declared browser version
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/solo-native-mp3-tools" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.62.1
          echo "SOLO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/solo-native-mp3-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solo-native-mp3-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/solo-native-mp3-browsers" node "$RUNNER_TEMP/solo-native-mp3-tools/node_modules/playwright/cli.js" install webkit
      - name: Require clean blank-context ownership then observe the original Bossa Blob
        timeout-minutes: 12
        run: node scripts/solo-native-mp3-control.mjs run-cocoa "$RUNNER_TEMP/solo-native-mp3-evidence"
      - name: Retain all original values, failures and process/context closure receipts
        if: always()
        timeout-minutes: 1
