name: Temporary non-browser Darwin ownership preflight

on:
  pull_request:
    paths:
      - '.github/workflows/solo-darwin-owner-preflight-temporary.yml'
      - 'scripts/solo-darwin-owner-preflight.mjs'
      - 'scripts/test-solo-darwin-owner-preflight.mjs'
      - 'scripts/solo-darwin-process-inventory.*'
      - 'scripts/test-solo-darwin-process-inventory*.mjs'

permissions:
  contents: read

concurrency:
  group: solo-darwin-owner-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preflight:
    # One setup-corrected observation; the exact 0feb discovery failure remains failed.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == '0febd334619731adc26dfa3df78aab02991563af'
    runs-on: macos-15-intel
    timeout-minutes: 24
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-darwin-inventory-diagnostic-temporary.yml
            /.github/workflows/solo-darwin-owner-preflight-temporary.yml
            /.github/workflows/solo-native-mp3-cocoa-temporary.yml
            /docs/performance/fixtures/solo-darwin-inventory/696-v1-source.json
            /game/campaign-contexts.mjs
