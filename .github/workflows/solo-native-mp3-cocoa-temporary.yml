name: Temporary native macOS MP3 control

on:
  pull_request:
    paths:
      - '.github/workflows/solo-native-mp3-cocoa-temporary.yml'
      - 'scripts/solo-native-mp3-control.mjs'
      - 'scripts/test-solo-native-mp3-control.mjs'
      - 'scripts/solo-darwin-process-inventory.*'
      - 'scripts/test-solo-darwin-process-inventory.mjs'
      - 'scripts/run-solo-remote-correctness.mjs'
      - 'docs/performance/solo-native-mp3-control-20261017.md'

permissions:
  contents: read

concurrency:
  group: solo-native-mp3-cocoa-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnostic:
    # One reviewed synchronize edge only; subsequent pushes cannot repeat this control.
    # Native macOS codec observation only; no game or timing qualification.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'a6eacee2f09f06f9ffa76fe8cd5d674aff0475a4'
    runs-on: macos-15-intel
    timeout-minutes: 28
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          # Exact source/test/data closure; this pinned action uses blob:none for sparse fetch.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-native-mp3-backend-temporary.yml
            /.github/workflows/solo-native-mp3-cocoa-temporary.yml
            /.github/workflows/solo-native-mp3-control-temporary.yml
