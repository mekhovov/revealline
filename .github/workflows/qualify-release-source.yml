name: Qualify release source

on:
  workflow_call:
    inputs:
      operation:
        description: Qualify source, or inspect/upload one already frozen artifact
        required: false
        default: qualify
        type: string
      artifact_binding:
        description: Reviewed exact JSON binding for utility modes; empty when qualifying
        required: false
        default: ""
        type: string
      freeze_snapshot:
        description: Preserve a playable snapshot after every source gate passes
        required: false
        default: false
        type: boolean
      run_tests:
        description: Request automated suites after full CI has been restored; ignored in fast-release mode
        required: false
        default: false
        type: boolean
    outputs:
      version:
        description: Exact frozen version with the v prefix
        value: ${{ jobs.freeze.outputs.version }}
      source_tree:
        description: Exact frozen source tree
        value: ${{ jobs.freeze.outputs.source_tree }}
      artifact_id:
        description: Immutable qualified artifact ID
        value: ${{ jobs.freeze.outputs.artifact_id }}
      artifact_digest:
        description: Immutable qualified artifact SHA-256 digest
        value: ${{ jobs.freeze.outputs.artifact_digest }}
      artifact_name:
        description: Immutable qualified artifact name
        value: ${{ jobs.freeze.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      operation:
        description: Qualify source, or inspect/upload one already frozen artifact
        required: true
        type: choice
        default: qualify
        options: [qualify, inspect-artifact, upload-originals]
      artifact_binding:
        description: Reviewed exact JSON binding for utility modes; empty when qualifying
        required: false
        type: string
      freeze_snapshot:
        description: Preserve a playable snapshot after every source gate passes
        required: false
        default: false
        type: boolean
      run_tests:
        description: Request automated suites after full CI has been restored; ignored in fast-release mode
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Identical manual candidates share a lane. A lightweight gate below prevents
  # a second workflow run from repeating the expensive checkout and build.
  group: source-qualification-${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_qualify: ${{ steps.queue.outputs.should_qualify }}
    steps:
      - name: Admit one manual qualification for this exact source
        id: queue
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation || 'qualify' }}
          SOURCE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = qualify ] && [ "$SOURCE_REF" != refs/heads/main ]; then
            echo "::error::Release qualification is reserved for merged main; received $SOURCE_REF."
            exit 1
          fi
          if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$OPERATION" != qualify ]; then
            echo 'should_qualify=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A later run for the same immutable SHA is redundant. Do this before
          # any repository checkout; utility operations retain their own lanes.
          earlier_run="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/qualify-release-source.yml/runs?event=workflow_dispatch&status=in_progress&per_page=100" \
            | jq -rs \
              '[.[] | .workflow_runs[] | select(.head_sha == env.GITHUB_SHA and (.id | tostring) != env.GITHUB_RUN_ID and .id < (env.GITHUB_RUN_ID | tonumber)) | .id] | min // empty')"
          if [ -n "$earlier_run" ]; then
            echo "A qualification for $GITHUB_SHA is already active in run $earlier_run; skipping this duplicate."
            echo 'should_qualify=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Once an exact SHA has a successful frozen snapshot, another
          # qualification cannot add release evidence; it only consumes the
          # serialized archive lane and risks a second write attempt. Utility
          # inspection/upload operations deliberately remain available.
          while read -r completed_run; do
            [ -n "$completed_run" ] || continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$completed_run/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "freeze" and .status == "completed" and .conclusion == "success")] | length > 0' \
              | grep -qx true; then
              echo "A successful frozen snapshot for $GITHUB_SHA already exists in run $completed_run; skipping this duplicate."
              echo 'should_qualify=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/qualify-release-source.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .conclusion == "success" and (.id | tostring) != env.GITHUB_RUN_ID) | .id')

          echo 'should_qualify=true' >> "$GITHUB_OUTPUT"

  qualify:
    if: >-
      inputs.operation == 'qualify' &&
      needs.deduplicate.outputs.should_qualify == 'true'
    needs: deduplicate
    outputs:
      runTests: ${{ steps.test_policy.outputs.runTests }}
      testMode: ${{ steps.test_policy.outputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          # Qualification verifies the checked-out commit and tree. It does not
          # walk history, so avoid cloning the full release archive.
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Read explicit automated-suite policy
        id: test_policy
        env:
          RUN_FULL_TESTS: ${{ vars.REVEALLINE_FULL_CI == 'true' && inputs.run_tests && 'true' || 'false' }}
        run: node publishing/test-policy.mjs --force-tests "$RUN_FULL_TESTS"

      - name: Record ignored full-test request in fast-release mode
        if: inputs.run_tests && vars.REVEALLINE_FULL_CI != 'true'
        run: |
          echo '::warning::Full-test requests are disabled while fast-release mode is active; no automated suites were run.'
          printf '%s\n' \
            '### Fast-release mode' \
            '' \
            'The manual `run_tests` request was ignored. Restore full CI before running automated suites from this release workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          node --version
          sha256sum package.json package-lock.json scripts/game-cli.mjs scripts/run-test-shard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check hosted artifact utility locally
        if: steps.test_policy.outputs.runTests == 'true'
        run: python3 -m unittest discover -s publishing/utility -p 'test_*.py'

      - name: Validate source
        run: npm run validate

      # Fast-release mode waives the long automated suites only. These bounded
      # source and production-provenance gates remain required release evidence
      # and retain their stable step names for the evidence assembler.
      - name: Lint source
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check native formatting
        run: npm run format:native:check

      - name: Check motion lab syntax
        run: node --check authoring/motion-lab/app.js

      - name: Reproduce production collection when available
        if: ${{ hashFiles('scripts/produce-field-kit-theme.mjs') != '' }}
        run: node scripts/produce-field-kit-theme.mjs --check

      - name: Require reviewed production slots in the committed ledger
        run: node scripts/check-field-kit-readiness.mjs

      - name: Verify qualified tracked source is unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

  test:
    if: needs.qualify.outputs.runTests == 'true'
    needs: qualify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Record source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          node --version
          sha256sum package.json package-lock.json scripts/game-cli.mjs scripts/run-test-shard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Record exact shard files
        run: node scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4 --list

      - name: Run test shard ${{ matrix.shard }}/4
        run: |
          mkdir -p .cache
          node scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4

      - name: Verify tested tracked source is unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

  freeze:
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          inputs.operation == 'qualify' && inputs.freeze_snapshot &&
          needs.qualify.result == 'success' &&
          ((needs.qualify.outputs.testMode == 'required' && needs.test.result == 'success') ||
           (needs.qualify.outputs.testMode == 'waived' && needs.test.result == 'skipped')) }}
    needs: [qualify, test]
    outputs:
      version: ${{ steps.snapshot.outputs.version }}
      source_tree: ${{ steps.snapshot.outputs.source_tree }}
      artifact_id: ${{ steps.snapshot_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.snapshot_artifact.outputs.artifact-digest }}
      artifact_name: qualified-release-${{ steps.snapshot.outputs.version }}-${{ github.sha }}
    runs-on: ubuntu-latest
    # A frozen source archive is intentionally large, but it must fail visibly
    # instead of holding the single release lane forever.
    timeout-minutes: 90
    steps:
      - name: Check out the qualified source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Install dependencies
        run: npm ci

      - name: Freeze the exact qualified commit
        id: snapshot
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          VERSION=$(node --input-type=module <<'JS'
          import fs from 'node:fs';
          const read = file => JSON.parse(fs.readFileSync(file));
          const version = read('package.json').version;
          const lock = read('package-lock.json');
          if (!/^\d+\.\d+\.\d+$/.test(version) ||
              [lock.version, lock.packages[''].version, read('game/build-config.json').version].some(v => v !== version))
            throw new Error('All package/build versions must match one stable numeric version');
          process.stdout.write(`v${version}`);
          JS
          )
          node scripts/game-cli.mjs release-snapshot --ref "$GITHUB_SHA" --version "$VERSION"
          (cd "releases/$VERSION/site" && sha256sum distribution.zip) > "releases/$VERSION/distribution.zip.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Retain original release assets
        id: snapshot_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-release-${{ steps.snapshot.outputs.version }}-${{ github.sha }}
          path: |
            releases/*/release.json
            releases/*/source.tar
            releases/*/distribution.zip.sha256
            releases/*/site/manifest.json
            releases/*/site/distribution.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Record immutable frozen-artifact identity
        run: |
          printf '%s\n' \
            '### Qualified frozen artifact' \
            '' \
            'Version: `${{ steps.snapshot.outputs.version }}`' \
            'Source: `${{ github.sha }}`' \
            'Artifact ID: `${{ steps.snapshot_artifact.outputs.artifact-id }}`' \
            'Artifact digest: `${{ steps.snapshot_artifact.outputs.artifact-digest }}`' >> "$GITHUB_STEP_SUMMARY"

  inspect-artifact:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
      inputs.operation == 'inspect-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the actual utility workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/workflows/qualify-release-source.yml
            publishing/test-policy.mjs
            publishing/test-policy.json
            publishing/utility/
          sparse-checkout-cone-mode: false

      - name: Set up explicit test policy runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Read explicit automated-suite policy
        id: test_policy
        env:
          RUN_FULL_TESTS: ${{ vars.REVEALLINE_FULL_CI == 'true' && inputs.run_tests && 'true' || 'false' }}
        run: node automation/publishing/test-policy.mjs --force-tests "$RUN_FULL_TESTS"

      - name: Validate the reviewed binding before source checkout
        id: binding
        env:
          UTILITY_BINDING: ${{ inputs.artifact_binding }}
        run: >-
          python3 automation/publishing/utility/release_artifact.py validate
          --mode inspect-artifact --repository "$GITHUB_REPOSITORY"

      - name: Check out the exact qualified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.binding.outputs.source }}
          path: qualified
          fetch-depth: 1
          persist-credentials: false

      - name: Verify local utility tests before authenticated work
        if: steps.test_policy.outputs.runTests == 'true'
        run: python3 -m unittest discover -s automation/publishing/utility -p 'test_*.py'

      - name: Inspect all frozen originals without release writes
        env:
          GH_TOKEN: ${{ github.token }}
          UTILITY_BINDING: ${{ inputs.artifact_binding }}
          UTILITY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: >-
          python3 automation/publishing/utility/release_artifact.py run
          --mode inspect-artifact --repository "$GITHUB_REPOSITORY"
          --repo qualified --out utility-output

      - name: Retain bounded original metadata and every attempt outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inspect-artifact-evidence
          path: utility-output/evidence/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

  upload-originals:
    concurrency:
      group: frozen-original-upload-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
      inputs.operation == 'upload-originals'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the actual utility workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/workflows/qualify-release-source.yml
            publishing/test-policy.mjs
            publishing/test-policy.json
            publishing/utility/
          sparse-checkout-cone-mode: false

      - name: Set up explicit test policy runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Read explicit automated-suite policy
        id: test_policy
        env:
          RUN_FULL_TESTS: ${{ vars.REVEALLINE_FULL_CI == 'true' && inputs.run_tests && 'true' || 'false' }}
        run: node automation/publishing/test-policy.mjs --force-tests "$RUN_FULL_TESTS"

      - name: Validate the reviewed binding before source checkout
        id: binding
        env:
          UTILITY_BINDING: ${{ inputs.artifact_binding }}
        run: >-
          python3 automation/publishing/utility/release_artifact.py validate
          --mode upload-originals --repository "$GITHUB_REPOSITORY"

      - name: Check out the exact qualified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.binding.outputs.source }}
          path: qualified
          fetch-depth: 1
          persist-credentials: false

      - name: Verify local utility tests before authenticated work
        if: steps.test_policy.outputs.runTests == 'true'
        run: python3 -m unittest discover -s automation/publishing/utility -p 'test_*.py'

      - name: Verify all originals and upload two absent members to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          UTILITY_BINDING: ${{ inputs.artifact_binding }}
          UTILITY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: >-
          python3 automation/publishing/utility/release_artifact.py run
          --mode upload-originals --repository "$GITHUB_REPOSITORY"
          --repo qualified --out utility-output

      - name: Retain bounded original metadata and every attempt outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upload-originals-evidence
          path: utility-output/evidence/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
