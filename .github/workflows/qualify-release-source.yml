name: Audit exact public Archive31 bytes
on:
  workflow_dispatch:
    inputs:
      archive_binding:
        description: Root-reviewed exact archive31-only binding JSON
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: readonly-archive31-public-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the actual reviewed utility workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
          sparse-checkout: |
            publishing/utility/archive31-public-audit
            .github/workflows/qualify-release-source.yml
          sparse-checkout-cone-mode: false
      - name: Check out the immutable archive source
        uses: actions/checkout@v4
        with:
          repository: mekhovov/revealline-archive-31
          ref: f476c311e0050b47d7408db51d57239fba7bece6
          path: archive-source
          persist-credentials: false
          fetch-depth: 1
      - name: Test bounded public transport without network
        env:
          REVEALLINE_ARCHIVE_SOURCE: ${{ github.workspace }}/archive-source
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONOPTIMIZE: '0'
        run: python3 -B -m unittest discover -s automation/publishing/utility/archive31-public-audit/payload/http/http-tools -p test_http_audit.py -v
      - name: Test the exact dispatch and authority boundaries without network
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONOPTIMIZE: '0'
        run: python3 -B -m unittest discover -s automation/publishing/utility/archive31-public-audit -p test_hosted_run.py -v
      - name: Read and verify every exact public body
        env:
          ARCHIVE_BINDING: ${{ inputs.archive_binding }}
          UTILITY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONOPTIMIZE: '0'
        run: >-
          python3 -B automation/publishing/utility/archive31-public-audit/hosted_run.py
          --source "${{ github.workspace }}/archive-source"
          --out "${{ runner.temp }}/archive31-public-audit"
      - name: Retain bounded original evidence including failure outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive31-public-byte-audit-evidence
          path: ${{ runner.temp }}/archive31-public-audit/
          include-hidden-files: true
          compression-level: 6
          retention-days: 14
          if-no-files-found: warn
