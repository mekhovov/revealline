name: UX0 Linux runtime diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
      - name: Install dependencies
        run: npm ci
      - name: Compare unchanged route checkpoints and public replay
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createAuthoredJourneyRoute } from './game/content-design/route.mjs';
          import { compileContentProject, resolveMission } from './game/content-design/project.mjs';
          import { createRun, stepRun, FIXED_DT } from './game/core/index.mjs';
          import { applyGameplayTuning, resolveGameplayTuning } from './game/gameplay-tuning.mjs';
          import {authoritativeCheckpoint, createRecorder,recordInput,exportReplay,verifyReplay} from './game/replay.mjs';
          const project=compileContentProject(createAuthoredJourneyRoute('authored').source);
          const fixture=JSON.parse(await readFile('./game/test/fixtures/candidate-solo-tuned-host-routes.json'));
          const results=[];
          for(const [id,,,expected,segments] of [...fixture.rows,...fixture.optional]) {
           const level=applyGameplayTuning(resolveMission(project,id).level,resolveGameplayTuning('standard'));
           const options={seed:1,classId:'scout',turnPolicy:'immediate'};
           const run=createRun(level,options),recorder=createRecorder(level,options);
           for(const [direction,ticks] of segments)for(let i=0;i<ticks;i++){recordInput(recorder,{direction});stepRun(run,{direction},FIXED_DT);}
           const checkpoint=authoritativeCheckpoint(run), replay=verifyReplay(exportReplay(recorder,run));
           results.push({id,expected,checkpoint,status:run.status,tick:run.tick,replayMatch:replay.match});
           if(id==='two-bays')console.log('TWO_BAYS_STATE='+JSON.stringify(run));
          }
          console.log(JSON.stringify({node:process.version,v8:process.versions.v8,arch:process.arch,results},null,2));
          JS
