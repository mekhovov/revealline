name: Audit exact v0.65.0 public main bytes
on:
  workflow_dispatch:
    inputs:
      main_binding:
        description: Root-reviewed actual final main-public binding JSON
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: readonly-v0650-main-public-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out reviewed utility only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
          sparse-checkout: |
            publishing/utility/main-public-v0650
            .github/workflows/qualify-release-source.yml
          sparse-checkout-cone-mode: false
      - name: Select Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate helper contracts without public requests
        working-directory: automation/publishing/utility/main-public-v0650/payload
        run: |
          node tools/self-check.mjs
          node tools/test-cohort-output.mjs
          node tools/test-all-history-policy.mjs
          node tools/test-admissions.mjs
      - name: Verify the complete pinned deployed inventory
        env:
          MAIN_BINDING: ${{ inputs.main_binding }}
          UTILITY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONOPTIMIZE: '0'
        run: >-
          python3 -B automation/publishing/utility/main-public-v0650/hosted_run.py
          --out "${{ runner.temp }}/v0650-main-public-audit"
      - name: Retain bounded evidence including incomplete attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0650-main-public-audit-evidence
          path: ${{ runner.temp }}/v0650-main-public-audit/
          include-hidden-files: true
          compression-level: 6
          retention-days: 14
          if-no-files-found: warn
