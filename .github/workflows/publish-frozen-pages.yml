name: Validate frozen release publication

on:
  pull_request:
    branches: [main]
    paths:
      - "publishing/pages-controller/**"
      - ".github/workflows/publish-frozen-pages.yml"
      - "scripts/pages-archive.mjs"
      - "scripts/pages-current-entry.mjs"
      - "publishing/edition-promotion.mjs"
      - "publishing/optional-package-*.mjs"
      - "publishing/edition-admission.mjs"
      - "publishing/edition-zip.mjs"
      - "game/edition-context.mjs"

permissions:
  contents: read

# This workflow validates the retained frozen-release machinery without writing
# production Pages. The production root is owned solely by deploy-main-pages.yml.
concurrency:
  group: frozen-pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
  queue: single

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing controller and immutable tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          show-progress: false
          sparse-checkout: |
            /.github/workflows/deploy-pages.yml
            /.github/workflows/publish-frozen-pages.yml
            /.github/workflows/qualify-release-source.yml
            /publishing/pages-controller/
            /publishing/edition-promotion.mjs
            /publishing/optional-package-promotion.mjs
            /publishing/optional-package-admission.mjs
            /publishing/optional-package-policy.mjs
            /publishing/edition-admission.mjs
            /publishing/edition-zip.mjs
            /game/edition-context.mjs
            /publishing/test-policy.json
            /publishing/test-policy.mjs
            /publishing/test-policy.test.mjs
            /scripts/pages-archive.mjs
            /scripts/pages-current-entry.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.2

      - name: Read explicit automated-suite policy
        id: test_policy
        run: node publishing/test-policy.mjs

      - name: Verify metadata bridges and bounded ZIP extraction in full mode
        if: vars.REVEALLINE_FULL_CI == 'true' && steps.test_policy.outputs.runTests == 'true'
        run: |
          node --test publishing/test-policy.test.mjs publishing/pages-controller/*.test.mjs
          python3 -m unittest discover -s publishing/pages-controller -p 'test_*.py' -v

      - name: Record deferred publisher tests
        if: vars.REVEALLINE_FULL_CI != 'true' || steps.test_policy.outputs.runTests != 'true'
        run: |
          echo "::warning::Focused publisher tests are deferred by fast-release policy; artifact and selector verification still run."
          printf '%s\n' \
            '### Fast-release mode' \
            '' \
            'Focused publisher tests are deferred. Selector, source-qualification, artifact-byte, and latest-release verification remain mandatory.' >> "$GITHUB_STEP_SUMMARY"

      - name: Require publication workspace capacity
        run: |
          python3 - <<'PY'
          import shutil
          free = shutil.disk_usage('.').free
          assert free >= 8 * 1024**3, f'At least 8 GiB free required; found {free}'
          PY

      - name: Validate main-repository selector and current source qualification
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ github.event_name == 'pull_request' && '--preview' || '' }}
        run: node publishing/pages-controller/publish.mjs verify $PREVIEW

      - name: Assemble exact current ZIP and historical metadata bridges
        if: github.event_name != 'pull_request' || vars.REVEALLINE_FULL_CI == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ github.event_name == 'pull_request' && '--preview' || '' }}
        run: node publishing/pages-controller/publish.mjs build $PREVIEW

      - name: Independently reread every prepared artifact byte
        if: github.event_name != 'pull_request' || vars.REVEALLINE_FULL_CI == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ github.event_name == 'pull_request' && '--preview' || '' }}
        run: node publishing/pages-controller/publish.mjs verify-artifact $PREVIEW

      - name: Defer Pages artifact assembly to main publication
        if: github.event_name == 'pull_request' && vars.REVEALLINE_FULL_CI != 'true'
        run: |
          echo 'Fast mode: selector and current source validation passed; full Pages bytes are assembled once after merge.'
          echo 'Production assembly, independent byte reread, upload, and deployment remain blocking.'

      - name: Preserve exact publishing receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frozen-pages-receipts
          path: .cache/frozen-pages/*-receipt.json
          if-no-files-found: warn
