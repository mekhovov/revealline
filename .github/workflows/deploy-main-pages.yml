name: Deploy protected main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages has one production environment. New protected-main commits supersede
# unfinished older builds and never participate in pull-request required checks.
concurrency:
  group: pages-production
  cancel-in-progress: true

env:
  # Keep enough headroom for GitHub Pages packaging while the repository grows.
  # Full releases still retain the complete source and optional authoring artwork.
  MAX_PUBLISHED_BYTES: 950000000

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      build_version: ${{ steps.identity.outputs.build_version }}
      game_version: ${{ steps.identity.outputs.game_version }}
      files: ${{ steps.inventory.outputs.files }}
      bytes: ${{ steps.inventory.outputs.bytes }}
    steps:
      - name: Check out the exact protected main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Set up deterministic build runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.2

      - name: Bind the deployment identity
        id: identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          build_version="main-${source_sha:0:12}"
          game_version="$(node -e "const c=require('./game/build-config.json'); if(!/^(0|[1-9][0-9]{0,4})\\.(0|[1-9][0-9]{0,4})\\.(0|[1-9][0-9]{0,4})$/.test(c.version)) process.exit(1); process.stdout.write(c.version)")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "game_version=$game_version" >> "$GITHUB_OUTPUT"

      - name: Require hosted build capacity
        run: |
          python3 - <<'PY'
          import shutil
          free = shutil.disk_usage('.').free
          assert free >= 8 * 1024**3, f'At least 8 GiB free required; found {free}'
          PY

      - name: Verify exact tracked source before build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-source-identity.mjs --root .

      - name: Install the locked build dependencies
        run: npm ci --prefer-offline

      - name: Build the protected main snapshot
        env:
          GAME_VERSION: ${{ steps.identity.outputs.game_version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/game-cli.mjs build \
            --out "$RUNNER_TEMP/main-pages" \
            --version "$GAME_VERSION" \
            --revision "$SOURCE_SHA" \
            --publication-profile main-pages
          rm "$RUNNER_TEMP/main-pages/distribution.zip" \
            "$RUNNER_TEMP/main-pages/distribution.zip.sha256"

      - name: Stage independently reviewed practice packages and explicit catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-optional-packages.mjs stage-pages \
            --repository mekhovov/revealline --base-path /revealline/ \
            --selector publishing/pages-controller/optional-packages.json \
            --out "$RUNNER_TEMP/main-pages"

      - name: Add explicit rolling-channel metadata
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.build_version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMITTED_AT="$(git show -s --format=%cI "$SOURCE_SHA")" \
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUNNER_TEMP + '/main-pages';
          const deployment = {
            format: 'revealline-main-deployment.v1',
            channel: 'main',
            sourceRevision: process.env.SOURCE_SHA,
            sourceCommittedAt: process.env.SOURCE_COMMITTED_AT,
            buildVersion: process.env.BUILD_VERSION,
            play: 'game/',
            releases: 'https://github.com/mekhovov/revealline/releases',
          };
          const json = JSON.stringify(deployment, null, 2) + '\n';
          fs.writeFileSync(path.join(root, 'main-deployment.json'), json, { flag: 'wx' });
          fs.writeFileSync(path.join(root, 'release.json'), json, { flag: 'wx' });
          fs.mkdirSync(path.join(root, 'releases'), { recursive: true });
          fs.writeFileSync(
            path.join(root, 'releases/index.html'),
            '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>FPV / LINE releases</title><p>Immutable downloads and release notes are available on <a href="https://github.com/mekhovov/revealline/releases">github.com/mekhovov/revealline/releases</a>.',
            { flag: 'wx' },
          );
          NODE

      - name: Report largest Pages files
        run: |
          set -euo pipefail
          echo "## Largest files in Pages snapshot"
          find "$RUNNER_TEMP/main-pages" -type f -printf '%s\t%p\n' \
            | sort -nr \
            | awk 'NR <= 50 { size=$1; name=$2; if(size>=1024*1024) printf "%6.1f MB  %s\n", size/(1024*1024), name; else printf "%6.1f KB  %s\n", size/1024, name }'

      - name: Enforce the Pages publication budget
        id: inventory
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, stat
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'main-pages'
          files = 0
          total = 0
          for entry in root.rglob('*'):
            mode = entry.lstat().st_mode
            assert not stat.S_ISLNK(mode), f'Symbolic link is not publishable: {entry}'
            if entry.is_file():
              files += 1
              total += entry.stat().st_size
          maximum = int(os.environ['MAX_PUBLISHED_BYTES'])
          assert total <= maximum, f'Pages snapshot exceeds {maximum} bytes: {total}'
          receipt = {
            'format': 'revealline-main-pages-receipt.v1',
            'sourceRevision': os.environ['SOURCE_SHA'],
            'files': files,
            'bytes': total,
            'maximumBytes': maximum,
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'main-pages-receipt.json').write_text(
            json.dumps(receipt, indent=2) + '\n'
          )
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a') as stream:
            stream.write(f'files={files}\nbytes={total}\n')
          PY

      - name: Verify exact tracked source after build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-source-identity.mjs --root .

      - name: Preserve the bounded build receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: main-pages-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/main-pages-receipt.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload the exact main Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/main-pages
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact protected main snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-public-main:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact deployed practice selector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up public verification runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Verify the public root identifies the exact main revision
        env:
          BUILD_VERSION: ${{ needs.build.outputs.build_version }}
          GAME_VERSION: ${{ needs.build.outputs.game_version }}
          PUBLIC_ROOT: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root = process.env.PUBLIC_ROOT.replace(/\/$/, '');
          const expected = {
            format: 'revealline-main-deployment.v1',
            channel: 'main',
            sourceRevision: process.env.SOURCE_SHA,
            buildVersion: process.env.BUILD_VERSION,
            play: 'game/',
          };
          const read = async (path) => {
            let last;
            for (let attempt = 1; attempt <= 20; attempt++) {
              try {
                const response = await fetch(`${root}/${path}?main=${process.env.SOURCE_SHA}-${attempt}`, {
                  cache: 'no-store',
                  headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
                  signal: AbortSignal.timeout(15_000),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
              } catch (error) {
                last = error;
                if (attempt < 20) await new Promise((resolve) => setTimeout(resolve, 3_000));
              }
            }
            throw last;
          };
          const deployment = await read('main-deployment.json');
          for (const [key, value] of Object.entries(expected))
            if (deployment[key] !== value)
              throw new Error(`Public ${key} mismatch: ${deployment[key]} != ${value}`);
          const build = await read('game/build-info.json');
          if (
            build.sourceRevision !== expected.sourceRevision ||
            build.version !== process.env.GAME_VERSION ||
            build.entry !== 'game/index.html'
          ) throw new Error('Public game build does not match the protected main deployment.');
          console.log(JSON.stringify({ root, ...expected }));
          NODE

      - name: Verify catalogue, stable launchers and every selected practice dependency
        env:
          PUBLIC_ROOT: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-practice-site.mjs "$PUBLIC_ROOT"

      - name: Record the rolling production boundary
        run: |
          printf '%s\n' \
            '### Continuous main Pages' \
            '' \
            "Source: \`${{ needs.build.outputs.source_sha }}\`" \
            "Build: \`${{ needs.build.outputs.build_version }}\`" \
            "Game version: \`${{ needs.build.outputs.game_version }}\`" \
            "Files: \`${{ needs.build.outputs.files }}\`" \
            "Bytes: \`${{ needs.build.outputs.bytes }}\`" \
            "Public root: ${{ needs.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
