name: Industrial feature verification

on:
  pull_request:
    paths:
      - '.github/workflows/industrial-feature-tests.yml'
      - 'publishing/**'
      - 'scripts/**'
      - 'game/**'
      - 'services/rooms/**'
      - 'optional-practice/**'
      - 'authoring/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: industrial-features-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        phase: [gameplay, creator, presentation, recordings, rooms, local-ux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the phase runner and restored policy
        run: node --test scripts/test-industrial-verifier.mjs publishing/test-policy.test.mjs
      - name: Execute the feature phase on the exact PR head
        run: node scripts/verify-industrial-features.mjs --phase ${{ matrix.phase }}
      - name: Retain TAP and source-bound receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-${{ matrix.phase }}-${{ github.event.pull_request.head.sha }}
          path: .cache/industrial-verification/
          if-no-files-found: warn
