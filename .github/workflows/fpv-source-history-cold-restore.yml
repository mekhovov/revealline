name: Original source history cold restore
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/fpv-source-history-cold-restore.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-cold-restore:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify original source checkpoint from GitHub only
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,subprocess,hashlib,base64,pathlib,struct,datetime,time
          ROOT=pathlib.Path(os.environ['RUNNER_TEMP'])/'fpv-original-source-cold';ROOT.mkdir(exist_ok=False);REPO='mekhovov/revealline';MANIFEST_OID='fa480ab2e044215378bc580d1e5eb2bb611596d5';MANIFEST_SHA256='f0c47c80d5798f186a15573330cbdcbd033b250dfeb3086653e6cdb1a81a3477';BUNDLE_SHA256='d21fd37f7ca6231ce0b6622e5591b3db4dac282f9f62520f024620d797292636';ASSET=646261949
          
          def api(path):
           p=subprocess.run(['gh','api','repos/'+REPO+'/'+path],capture_output=True,check=True);return json.loads(p.stdout)
          def sha256(path):
           h=hashlib.sha256()
           with path.open('rb') as f:
            while b:=f.read(1048576):h.update(b)
           return h.hexdigest()
          blob=api('git/blobs/'+MANIFEST_OID);body=base64.b64decode(blob['content']);assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==MANIFEST_OID;assert hashlib.sha256(body).hexdigest()==MANIFEST_SHA256;m=json.loads(body);manifest=ROOT/'allowlist.json';manifest.write_bytes(body);assert len(m['objects'])==17824 and len(m['prerequisiteCommitSHAs'])==555
          asset=api('releases/assets/'+str(ASSET));assert asset['size']==389261798 and asset['state']=='uploaded' and asset['digest']=='sha256:'+BUNDLE_SHA256;bundle=ROOT/'history.bundle'
          with bundle.open('xb') as f:
           p=subprocess.run(['gh','api','-H','Accept: application/octet-stream','repos/'+REPO+'/releases/assets/'+str(ASSET)],stdout=f,stderr=subprocess.PIPE,timeout=1200);assert p.returncode==0,p.stderr[:500]
          assert bundle.stat().st_size==389261798 and sha256(bundle)==BUNDLE_SHA256
          repo=ROOT/'recovery.git';env={k:v for k,v in os.environ.items() if k not in ['GIT_DIR','GIT_COMMON_DIR','GIT_WORK_TREE','GIT_OBJECT_DIRECTORY','GIT_ALTERNATE_OBJECT_DIRECTORIES','GIT_INDEX_FILE']};env.update(GIT_NO_LAZY_FETCH='1',GIT_OPTIONAL_LOCKS='0',GIT_TERMINAL_PROMPT='0',GIT_AUTHOR_NAME='Codex',GIT_AUTHOR_EMAIL='codex@users.noreply.github.com',GIT_COMMITTER_NAME='Codex',GIT_COMMITTER_EMAIL='codex@users.noreply.github.com',GIT_AUTHOR_DATE='2026-10-16T05:20:00Z',GIT_COMMITTER_DATE='2026-10-16T05:20:00Z')
          def git(args,timeout=600):
           p=subprocess.run(['git','--git-dir='+str(repo)]+args,capture_output=True,env=env,timeout=timeout);assert p.returncode==0,(args,p.stderr[-1200:]);return p.stdout
          subprocess.run(['git','init','--bare',str(repo)],capture_output=True,check=True)
          for k,v in [('remote.origin.url','https://github.com/'+REPO+'.git'),('remote.origin.promisor','true'),('remote.origin.partialclonefilter','blob:none')]:git(['config',k,v])
          keys=m['prerequisiteCommitSHAs'];git(['fetch','--depth=1','--filter=blob:none','--no-tags','origin']+keys,1200);assert not (repo/'objects/info/alternates').exists();assert not (repo/'objects').is_symlink();assert set((repo/'shallow').read_text().splitlines())==set(keys)
          first=git(['cat-file','commit',keys[0]]);tree=next(l[5:].decode() for l in first.split(b'\n\n',1)[0].splitlines() if l.startswith(b'tree '));args=['commit-tree',tree]
          for p in keys:args+=['-p',p]
          p=subprocess.run(['git','--git-dir='+str(repo)]+args,input=b'Local verification-only prerequisite support; recreate from declared GitHub commits.\n',capture_output=True,env=env,timeout=60);assert p.returncode==0;support=p.stdout.decode().strip();git(['update-ref','refs/preservation/verification-only-public-prerequisites',support])
          # All later verification must succeed with lazy fetching disabled and an unusable remote URL.
          git(['config','remote.origin.url','https://example.invalid/no-lazy-fetch']);git(['bundle','verify',str(bundle)]);git(['bundle','unbundle',str(bundle)]);git(['update-ref',m['ref'],m['head']]);git(['fsck','--connectivity-only','--no-reflogs'])
          raw=bundle.open('rb');lines=[]
          while True:
           l=raw.readline();lines.append(l)
           if l==b'\n':break
          position=raw.tell();assert raw.read(4)==b'PACK';version,n=struct.unpack('>II',raw.read(8));assert version==2 and n==17824;raw.seek(-20,2);packSHA=raw.read(20).hex();raw.close();headerPrereqs={l[1:41].decode() for l in lines if l.startswith(b'-')};assert headerPrereqs==set(keys)
          idx=repo/'objects/pack'/('pack-'+packSHA+'.idx');d=idx.read_bytes();assert d[:4]==b'\xfftOc' and struct.unpack('>I',d[4:8])[0]==2 and hashlib.sha1(d[:-20]).digest()==d[-20:];count=struct.unpack('>I',d[1028:1032])[0];ids={d[1032+i*20:1052+i*20].hex() for i in range(count)};assert ids=={v['sha'] for v in m['objects']};assert not ids&set(m['forbiddenObjectSHAs']);assert d[-40:-20].hex()==packSHA
          p=subprocess.Popen(['git','--git-dir='+str(repo),'cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,env=env);rowHash=hashlib.sha256();total=0;types={};started=time.time()
          for number,v in enumerate(sorted(m['objects'],key=lambda x:x['sha']),1):
           oid=v['sha'];p.stdin.write((oid+'\n').encode());p.stdin.flush();h=p.stdout.readline().split();assert len(h)==3 and h[0].decode()==oid;kind=h[1].decode();size=int(h[2]);assert kind==v['type'] and size+len(kind)+len(str(size))+2==v['rawBytes'];digest=hashlib.sha1(kind.encode()+b' '+str(size).encode()+b'\0');bodyHash=hashlib.sha256();left=size
           while left:
            b=p.stdout.read(min(left,1048576));assert b;left-=len(b);digest.update(b);bodyHash.update(b)
           assert p.stdout.read(1)==b'\n' and digest.hexdigest()==oid;rowHash.update(json.dumps({'sha':oid,'type':kind,'bytes':size,'bodySHA256':bodyHash.hexdigest()},sort_keys=True,separators=(',',':')).encode()+b'\n');total+=size;types[kind]=types.get(kind,0)+1
           if number%2000==0:print(json.dumps({'coldObjectsVerified':number,'of':17824}),flush=True)
          p.stdin.close();p.terminate()
          reached={l.split()[0] for l in git(['rev-list','--parents',m['head']]).decode().splitlines()};selected={v['sha'] for v in m['objects'] if v['type']=='commit' and not v.get('archivalSynthetic')};assert len(selected)==2790 and selected<=reached
          for oid in m['forbiddenObjectSHAs']:
           p=subprocess.run(['git','--git-dir='+str(repo),'cat-file','-e',oid],capture_output=True,env=env,timeout=15);assert p.returncode!=0
          receipt={'format':'GitHubHostedOriginalSourceHistoryColdRestore.v1','createdUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runId':os.environ['GITHUB_RUN_ID'],'runURL':'https://github.com/'+REPO+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'assetId':ASSET,'assetBytes':389261798,'assetSHA256':BUNDLE_SHA256,'manifestGitBlob':MANIFEST_OID,'manifestSHA256':MANIFEST_SHA256,'declaredPublicPrerequisites':555,'bundleVerify':True,'unbundle':True,'nativeFsckConnectivity':True,'actualPackIDsExactlyAllowlist':True,'all17824NewRawGitObjectSHA1Readbacks':True,'all2790SelectedCommitsReachable':True,'allExcludedPrivateObjectsAbsent':True,'newObjectTypes':types,'newObjectBodyBytes':total,'sortedObjectReadbackRowsSHA256':rowHash.hexdigest(),'noAlexOrOriginalSourceStoreInputs':True,'noAlternatesOrObjectDirectorySymlinks':True,'verificationRemoteDisabledAfterGitHubFetch':True,'localPublicPrerequisiteSupportRecreated':True,'scope':'Original16-store checkpoint only. Expanded all-volume and private companion preservation remain separate. Sparse public prerequisites require GitHub for omitted public bodies/older ancestry; no app persistence/offline/endurance qualification.'};(ROOT/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Original source checkpoint cold restore passed.\n\n```json\n'+json.dumps(receipt,indent=2)+'\n```\n')
          PY
