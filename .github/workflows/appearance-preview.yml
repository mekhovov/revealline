          set -euo pipefail
          node scripts/refresh-theme-bootstrap.mjs --check
          node scripts/refresh-interface-material-grain.mjs --check
          node scripts/refresh-fpv-presentation-assets.mjs --check
          node authoring/fpv-worlds/industrial-markings/generate.mjs --check
      - name: Run focused appearance, SIM and curated-community checks
        timeout-minutes: 45
        id: focused
        if: steps.test_policy.outputs.runTests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          read -r -a test_files <<< "$APPEARANCE_TEST_FILES"
          node --test --test-concurrency=1 "${test_files[@]}" | tee .cache/appearance-preview/focused-tests.tap
      - name: Build the full game and separate Worlds playtest
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          # The job has 70 minutes; reserve two for job startup and final runner cleanup.
          # Admit the 12-minute build only with 11 more minutes for evidence and closure.
          [[ "${PREVIEW_STARTED_AT:-}" =~ ^[1-9][0-9]{8,11}$ ]] || { echo 'Missing packaging start clock.'; exit 1; }
          elapsed=$(( $(date +%s) - PREVIEW_STARTED_AT ))
          remaining=$(( 68 * 60 - elapsed ))
          echo "Packaging admission: elapsed=${elapsed}s remaining=${remaining}s required=1380s."
          if (( elapsed < 0 || remaining < 23 * 60 )); then
            echo 'Insufficient time remains for bounded build and evidence retention.'
            exit 1
          fi
          node scripts/game-cli.mjs build --out .cache/appearance-game --revision "$PREVIEW_HEAD_SHA" > .cache/appearance-preview/main-build.json
          node scripts/build-fpv-worlds-playtest.mjs --out .cache/appearance-worlds > .cache/appearance-preview/world-build.json
          cp .cache/appearance-game/distribution.zip .cache/appearance-preview/distribution.zip
          cp .cache/appearance-worlds/fpv-worlds-playtest.zip .cache/appearance-preview/fpv-worlds-playtest.zip
          cp docs/appearance-preview-testing.md .cache/appearance-preview/README.md
      - name: Bind checksums and policy-qualified evidence to the exact source
        timeout-minutes: 1
        env:
          TEST_POLICY_MODE: ${{ steps.test_policy.outputs.mode }}
          TEST_POLICY_SHA256: ${{ steps.test_policy.outputs.policySha256 }}
          FOCUSED_RESULT: ${{ steps.focused.outcome }}
          ADMISSION_PROOF: ${{ needs.admission.outputs.proof }}
          ADMISSION_ARTIFACT_ID: ${{ needs.admission.outputs.artifactId }}
          ADMISSION_ARTIFACT_URL: ${{ needs.admission.outputs.artifactURL }}
          ADMISSION_ARTIFACT_DIGEST: ${{ needs.admission.outputs.artifactDigest }}
          DEMO_ADMISSION_PROOF: ${{ needs.demo_admission.outputs.proof }}
          DEMO_ADMISSION_ARTIFACT_ID: ${{ needs.demo_admission.outputs.artifactId }}
          DEMO_ADMISSION_ARTIFACT_URL: ${{ needs.demo_admission.outputs.artifactURL }}
          DEMO_ADMISSION_ARTIFACT_DIGEST: ${{ needs.demo_admission.outputs.artifactDigest }}
          INSTALLED_ADMISSION_PROOF: ${{ needs.installed_admission.outputs.proof }}
          INSTALLED_ADMISSION_ARTIFACT_ID: ${{ needs.installed_admission.outputs.artifactId }}
          INSTALLED_ADMISSION_ARTIFACT_URL: ${{ needs.installed_admission.outputs.artifactURL }}
          INSTALLED_ADMISSION_ARTIFACT_DIGEST: ${{ needs.installed_admission.outputs.artifactDigest }}
          TEAM_ADMISSION_PROOF: ${{ needs.team_admission.outputs.proof }}
          TEAM_ADMISSION_ARTIFACT_ID: ${{ needs.team_admission.outputs.artifactId }}
          TEAM_ADMISSION_ARTIFACT_URL: ${{ needs.team_admission.outputs.artifactURL }}
          TEAM_ADMISSION_ARTIFACT_DIGEST: ${{ needs.team_admission.outputs.artifactDigest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { parseTestPolicy, policyDecision } from './publishing/test-policy.mjs';
          const root = '.cache/appearance-preview/';
          const head = process.env.PREVIEW_HEAD_SHA;
          if (!/^[a-f0-9]{40}$/.test(head)) throw new Error('An exact PR head is required.');
          const policyBytes = await readFile('publishing/test-policy.json');
          const policy = parseTestPolicy(policyBytes.toString('utf8'));
          const decision = policyDecision(policy);
          const policySha256 = createHash('sha256').update(policyBytes).digest('hex');
          if (decision.mode !== process.env.TEST_POLICY_MODE || policySha256 !== process.env.TEST_POLICY_SHA256)
            throw new Error('Test policy changed after the workflow decision.');
          const waived = decision.mode === 'waived';
          if (process.env.FOCUSED_RESULT !== (waived ? 'skipped' : 'success'))
            throw new Error('Focused-check outcome does not match the explicit test policy.');
          const testOutput = waived ? 'focused-tests-waived.json' : 'focused-tests.tap';
          const testPolicy = { ...decision, policySha256, policy };
          const sourceTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          const additionalCohorts = [];
          for (const [prefix, fileVariable, outputPrefix] of [
            ['ADMISSION', 'APPEARANCE_ADMISSION_TEST_FILES', 'admission'],
            ['TEAM_ADMISSION', 'APPEARANCE_TEAM_TEST_FILES', 'team-admission'],
            ['DEMO_ADMISSION', 'APPEARANCE_DEMO_TEST_FILES', 'demo-admission'],
            ['INSTALLED_ADMISSION', 'APPEARANCE_INSTALLED_TEST_FILES', 'installed-admission'],
          ]) {
            const admissionText = process.env[`${prefix}_PROOF`] || '';
            if (!admissionText || Buffer.byteLength(admissionText) > 16 * 1024)
              throw new Error('Bounded predecessor admission proof required.');
            const admission = JSON.parse(admissionText);
            const expectedFiles = process.env[fileVariable].trim().split(/\s+/);
            if (admission.format !== 'AppearanceAdmissionProofV1' || admission.sourceRevision !== head ||
                admission.sourceTree !== sourceTree || admission.workflowRun !== process.env.PREVIEW_RUN_URL ||
                admission.node !== process.version || JSON.stringify(admission.testPolicy) !== JSON.stringify(testPolicy) ||
                admission.result !== (waived ? 'waived' : 'passed') || admission.executed !== !waived ||
                admission.command !== (waived ? null : 'node --test --test-concurrency=1') ||
                JSON.stringify(admission.files) !== JSON.stringify(expectedFiles) ||
                admission.output?.path !== `${outputPrefix}-tests${waived ? '-waived.json' : '.tap'}` ||
                !Number.isSafeInteger(admission.output?.bytes) || admission.output.bytes <= 0 || admission.output.bytes > 8 * 1024 ** 2 ||
                !/^[a-f0-9]{64}$/.test(admission.output?.sha256 || ''))
              throw new Error('Predecessor admission source, policy, outcome or output mismatch.');
            const artifactID = process.env[`${prefix}_ARTIFACT_ID`];
            if (!/^[1-9][0-9]*$/.test(artifactID || '') || !Number.isSafeInteger(Number(artifactID)) ||
                process.env[`${prefix}_ARTIFACT_URL`] !== `${process.env.PREVIEW_RUN_URL}/artifacts/${artifactID}` ||
                !/^[a-f0-9]{64}$/.test(process.env[`${prefix}_ARTIFACT_DIGEST`] || ''))
              throw new Error('Successfully uploaded admission artifact identity required.');
            const admissionReceipt = Buffer.from(JSON.stringify(admission, null, 2) + '\n');
            additionalCohorts.push({ ...admission,
              receipt: { path: `${outputPrefix}-proof.json`, bytes: admissionReceipt.length,
                sha256: createHash('sha256').update(admissionReceipt).digest('hex') },
              artifact: { id: Number(artifactID), url: process.env[`${prefix}_ARTIFACT_URL`],
                sha256: process.env[`${prefix}_ARTIFACT_DIGEST`] },
            });
          }
          if (waived) await writeFile(root + testOutput, JSON.stringify({
            result: 'waived',
            executed: false,
            statement: 'Automated suites were skipped by explicit user authorization; no passing test verdict is claimed.',
            testPolicy,
          }, null, 2) + '\n');
          const main = JSON.parse(await readFile(root + 'main-build.json', 'utf8'));
          const world = JSON.parse(await readFile(root + 'world-build.json', 'utf8'));
          const rows = [];
          for (const [path, expected] of [
            ['distribution.zip', main.sha256],
            ['fpv-worlds-playtest.zip', world.zipSha256],
          ]) {
            const bytes = await readFile(root + path);
            const sha256 = createHash('sha256').update(bytes).digest('hex');
            if (sha256 !== expected) throw new Error(`Builder checksum mismatch: ${path}`);
            rows.push({ path, bytes: bytes.length, sha256 });
          }
          if (main.sourceRevision !== head) throw new Error('Game source revision mismatch.');
          await writeFile(root + 'preview-identity.json', JSON.stringify({
            format: 'AppearancePreview.v1',
            sourceRevision: head,
            sourceTree,
            pullRequest: Number(process.env.PREVIEW_PR),
            workflowRun: process.env.PREVIEW_RUN_URL,
            node: process.version,
            testPolicy,
            focusedTests: {
              result: waived ? 'waived' : 'passed',
              executed: !waived,
              command: waived ? null : 'node --test --test-concurrency=1',
              files: process.env.APPEARANCE_TEST_FILES.trim().split(/\s+/),
              output: testOutput,
              additionalCohorts,
            },
            artifacts: rows,
            qualification: 'development-preview',
            deployed: false,
            releaseQualified: false,
          }, null, 2) + '\n');
          const names = [...rows.map(row => row.path), 'main-build.json', 'world-build.json',
            'preview-identity.json', testOutput, 'README.md'];
          const checksums = [];
          for (const name of names.sort()) {
            const bytes = await readFile(root + name);
            checksums.push(`${createHash('sha256').update(bytes).digest('hex')}  ${name}`);
          }
          await writeFile(root + 'SHA256SUMS', checksums.join('\n') + '\n');
          NODE
      - name: Upload playable preview archives and receipts
        timeout-minutes: 2
        id: playable_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: appearance-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .cache/appearance-preview/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Bind small metadata to the successfully uploaded exact package
        timeout-minutes: 2
        env:
          PREVIEW_ARTIFACT_ID: ${{ steps.playable_archive.outputs.artifact-id }}
          PREVIEW_ARTIFACT_URL: ${{ steps.playable_archive.outputs.artifact-url }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.playable_archive.outputs.artifact-digest }}
        run: node scripts/prepare-appearance-preview-metadata.mjs
      - name: Upload compact package identity for remote verification
        timeout-minutes: 3
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: appearance-preview-metadata-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .cache/appearance-preview-metadata/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain focused diagnostics when packaging does not finish
        timeout-minutes: 2
        if: ${{ always() && (failure() || cancelled()) && steps.test_policy.outputs.runTests == 'true' && (steps.focused.outcome == 'success' || steps.focused.outcome == 'failure' || steps.focused.outcome == 'cancelled') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: appearance-preview-failed-tests-${{ github.event.pull_request.head.sha }}
          path: .cache/appearance-preview/focused-tests.tap
          if-no-files-found: error
          retention-days: 7
      - name: Report preview scope
        timeout-minutes: 1
        env:
          FOCUSED_RESULT: ${{ steps.focused.outcome }}
          TEST_POLICY_MODE: ${{ steps.test_policy.outputs.mode }}
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Appearance preview: $PREVIEW_HEAD_SHA"
            if [ "$TEST_POLICY_MODE" = 'waived' ]; then
              echo 'Focused appearance checks: waived by explicit user policy; not run and not passed.'
            else
              echo "Focused appearance checks: $FOCUSED_RESULT. Policy: ${TEST_POLICY_MODE:-unavailable}; missing or malformed policy never authorizes a waiver."
            fi
            echo 'Successful runs attach two playable ZIPs, SHA256SUMS, source identity, policy evidence and a local testing guide. Required tests include TAP output; waived tests include a waiver receipt instead. Failed runs are not qualified previews.'
            echo 'A separate exact-source predecessor runs the complete optional-proof and saved-flight regressions. Its result, complete files, output checksum and separate evidence artifact are bound into preview identity; an explicit waiver remains unexecuted.'
            echo 'Nothing is deployed. This does not claim full-suite, production artwork, password-gated browser, offline-installation or physical-device acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
