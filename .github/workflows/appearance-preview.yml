            throw new Error('Admission outcome does not match the explicit test policy.');
          const testPolicy = { ...decision, policySha256, policy };
          const output = waived ? 'demo-admission-tests-waived.json' : 'demo-admission-tests.tap';
          if (waived) await writeFile(root + output, JSON.stringify({
            result: 'waived', executed: false, testPolicy,
            statement: 'Explicit user waiver; automated tests were not executed and no passing verdict is claimed.',
          }, null, 2) + '\n');
          const info = await lstat(root + output);
          if (!info.isFile() || info.isSymbolicLink() || info.size <= 0 || info.size > 8 * 1024 ** 2)
            throw new Error('Bounded admission output required.');
          const bytes = await readFile(root + output);
          if (bytes.length !== info.size) throw new Error('Admission output changed during readback.');
