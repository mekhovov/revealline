      - name: Read exact-source Demo admission policy
        timeout-minutes: 1
        id: test_policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_HEAD_SHA"
          mkdir -p .cache/appearance-demo-admission
          node publishing/test-policy.mjs
      - name: Install Demo admission test dependencies
        timeout-minutes: 3
        if: steps.test_policy.outputs.runTests == 'true'
        run: npm ci
      - name: Run complete Demo ownership, transitions and resources regressions
        timeout-minutes: 5
        id: admission_tests
        if: steps.test_policy.outputs.runTests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          read -r -a test_files <<< "$APPEARANCE_DEMO_TEST_FILES"
          node --test --test-concurrency=1 "${test_files[@]}" | tee .cache/appearance-demo-admission/demo-admission-tests.tap
      - name: Bind exact-source Demo admission proof
        timeout-minutes: 1
        id: admission_receipt
        env:
          TEST_POLICY_MODE: ${{ steps.test_policy.outputs.mode }}
          TEST_POLICY_SHA256: ${{ steps.test_policy.outputs.policySha256 }}
          ADMISSION_RESULT: ${{ steps.admission_tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          node --input-type=module <<'NODE'
          import { readFile, writeFile, appendFile, lstat } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { parseTestPolicy, policyDecision } from './publishing/test-policy.mjs';
          const root = '.cache/appearance-demo-admission/';
          const head = process.env.PREVIEW_HEAD_SHA;
          if (!/^[a-f0-9]{40}$/.test(head)) throw new Error('Exact admission source required.');
          const policyBytes = await readFile('publishing/test-policy.json');
          const policy = parseTestPolicy(policyBytes.toString('utf8'));
          const decision = policyDecision(policy);
          const policySha256 = createHash('sha256').update(policyBytes).digest('hex');
          if (decision.mode !== process.env.TEST_POLICY_MODE || policySha256 !== process.env.TEST_POLICY_SHA256)
            throw new Error('Admission policy changed after the decision.');
          const waived = decision.mode === 'waived';
