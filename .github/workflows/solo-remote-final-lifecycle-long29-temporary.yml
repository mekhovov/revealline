name: Temporary Solo final lifecycle-long29 diagnostics

# Retired after the single admitted PR #1544 release edge was merged.
# Keep the diagnostic definition and exact execution guard for historical review.
# No automatic event starts this workflow; no repository workflow calls it.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-final-lifecycle-long29-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  declare:
    # One reviewed release edge; no automatic retry or continuation.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'a7e0219818842f02399317ca6d2a14bdd506da3d'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.phase.outputs.matrix }}
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/performance/solo-final-long29-plan.json
            /scripts/solo-qualification-observation.mjs
            /scripts/solo-qualification.mjs
            /scripts/solo-remote-sustained.mjs
      - timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Admit exactly one reviewed phase; no automatic continuation
        id: phase
        timeout-minutes: 1
        run: node scripts/solo-remote-sustained.mjs matrix-plan docs/performance/solo-final-long29-plan.json >> "$GITHUB_OUTPUT"
  sustained:
    needs: declare
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.jobMinutes }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.declare.outputs.matrix) }}
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-remote-final-lifecycle-long29-temporary.yml
            /.github/workflows/solo-remote-final-lifecycle-next-temporary.yml
            /.github/workflows/solo-remote-final-lifecycle-retry-temporary.yml
            /.github/workflows/solo-remote-final-soak-temporary.yml
            /.github/workflows/solo-remote-final-soak-v2-temporary.yml
            /.github/workflows/solo-remote-final-timing-cold-first30-temporary.yml
            /.github/workflows/solo-remote-final-timing-cold-first30-v2-temporary.yml
            /.github/workflows/solo-remote-final-timing-long-rail-temporary.yml
            /.github/workflows/solo-remote-final-timing-long-rail-v2-temporary.yml
            /.github/workflows/solo-remote-final-timing-sentry-temporary.yml
            /.github/workflows/solo-remote-final-timing-sentry-v2-temporary.yml
            /.github/workflows/solo-remote-final-timing-warm-first30-temporary.yml
            /.github/workflows/solo-remote-final-timing-warm-first30-v2-temporary.yml
            /.github/workflows/solo-remote-sustained-temporary.yml
            /.github/workflows/solo-remote-timing-temporary.yml
            /docs/performance/fixtures/solo-final-timing/historical-a6-source.json
            /docs/performance/fixtures/solo-final-wave/a7e-execution-source.json
            /docs/performance/fixtures/solo-remote-sustained/first-return.xonix.fixture
