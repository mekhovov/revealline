name: Temporary Solo exact main normal baseline

on:
  pull_request:
    paths:
      - '.github/workflows/solo-remote-baseline-temporary.yml'
      - 'scripts/produce-solo-normal-baseline.mjs'
      - 'scripts/test-produce-solo-normal-baseline.mjs'
      - 'scripts/solo-remote-baseline.mjs'
      - 'scripts/solo-remote-archive.py'
      - 'scripts/test-solo-remote-baseline.mjs'
      - 'docs/performance/solo-normal-baseline-8b019-plan.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-normal-baseline-8b019-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  produce:
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == '1ccf8368a3dcd099e1608c8a9433e6f0c0518e8f'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
      - timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 8b01991942dc764b8aa4726851699ce1985e53ae
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Install locked tooling and exact baseline dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solo-baseline-setup"
          test "$(git -C tools rev-parse HEAD)" = "$SOLO_TOOLING_REVISION"
          test "$(git -C baseline rev-parse HEAD)" = '8b01991942dc764b8aa4726851699ce1985e53ae'
          npm ci --prefix tools --no-audit --no-fund 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-baseline-setup/tools-npm.log"
          npm ci --prefix baseline --no-audit --no-fund 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-baseline-setup/baseline-npm.log"
      - name: Verify old and new source contracts plus owner/archive rejection
        timeout-minutes: 3
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-solo-remote-baseline.mjs scripts/test-produce-solo-normal-baseline.mjs scripts/test-solo-remote-correctness.mjs scripts/test-solo-build-worker-closure.mjs 2>&1 | head -c 4194304 > "$RUNNER_TEMP/solo-baseline-setup/contracts.tap"
      - name: Produce only the exact normal baseline and its proof
        timeout-minutes: 53
        working-directory: tools
        run: timeout --signal=TERM --kill-after=30s 52m node scripts/produce-solo-normal-baseline.mjs docs/performance/solo-normal-baseline-8b019-plan.json "$RUNNER_TEMP/solo-normal-baseline-8b019"
      - name: Read back positive source-bound publication before upload
        id: ready
        timeout-minutes: 2
        working-directory: tools
        run: node scripts/solo-remote-baseline.mjs admit-upload "$RUNNER_TEMP/solo-normal-baseline-8b019/work/baseline-build" 8b01991942dc764b8aa4726851699ce1985e53ae 9373b6a74aea8fa1ef47aa17ace140b4cf714609
      - name: Retain the independently verified normal package
        if: ${{ success() && steps.ready.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-normal-baseline-8b019919-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solo-normal-baseline-8b019/work/baseline-build/distribution.zip
            ${{ runner.temp }}/solo-normal-baseline-8b019/work/baseline-build/manifest.json
            ${{ runner.temp }}/solo-normal-baseline-8b019/work/baseline-build/normal-baseline-proof/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Describe complete or bounded setup output
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'solo-baseline-setup'
          root.mkdir(exist_ok=True)
          rows=[]
          failed=False
          for name in ['tools-npm.log','baseline-npm.log','contracts.tap']:
              path=root/name
              if not path.exists():
                  rows.append({'path':name,'status':'not-retained-setup-incomplete'})
                  continue
              size=path.stat().st_size
              assert size <= 4*1024*1024
              capped=size == 4*1024*1024
              failed |= capped
              rows.append({'path':name,'bytes':size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'status':'cap-reached-completeness-unconfirmed' if capped else 'retained'})
          (root/'retention.json').write_text(json.dumps({'status':'failed-output-cap' if failed else 'retained','files':rows,'maximumTotalBytes':12*1024*1024},indent=2)+'\n')
          if failed: raise SystemExit(1)
          PYCODE
      - name: Retain every failed, partial and complete command and proof receipt
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solo-normal-baseline-8b019919-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solo-normal-baseline-8b019/evidence/
            ${{ runner.temp }}/solo-baseline-setup/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
