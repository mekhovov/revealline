name: Worlds fixed whole-file memory comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/world-appearance-memory-comparison.yml'
      - 'scripts/world-appearance-memory-comparison.py'
      - 'scripts/world-appearance-memory-comparison-pins.json'
      - 'scripts/test_world_appearance_memory_comparison.py'
      - 'docs/verification/world-appearance-memory-comparison.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: world-memory-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  immutable:
    name: diagnostic-${{ matrix.label }}-whole-file
    if: >-
      github.repository == 'mekhovov/revealline' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: baseline
            source: a7c8be6ff7f4cf2ee0409edbab136e398f21c1c2
          - label: feature
            source: 2d15ac09834c762a543d5aa3edcb9114f6135b88
    env:
      PYTHONDONTWRITEBYTECODE: 1
      GIT_NO_LAZY_FETCH: 1
      GIT_OPTIONAL_LOCKS: 0
    steps:
      - name: Check out only reviewed diagnostic controls
        env:
          GIT_NO_LAZY_FETCH: '0'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controls
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/world-appearance-memory-comparison.yml
            /scripts/world-appearance-memory-comparison.py
            /scripts/world-appearance-memory-comparison-pins.json
            /scripts/test_world_appearance_memory_comparison.py
            /docs/verification/world-appearance-memory-comparison.md
      - name: Check out the fixed immutable target
        env:
          GIT_NO_LAZY_FETCH: '0'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ matrix.source }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Set up the identical native Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.2
      - name: Verify reviewed controls and pure evidence checks
        working-directory: controls
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib, pathlib
          expected = {"scripts/world-appearance-memory-comparison.py":"c8e0cc312dd1a904c6d17016cfa9514b0d096a1eb306182e7db01af4d9b87f35","scripts/world-appearance-memory-comparison-pins.json":"679106613c26d3c5d50512e20de207c5b452aaad1cca639ff9c9d8f60ca65091","scripts/test_world_appearance_memory_comparison.py":"e81fc2d0643d39258da07d550294d573cc3c01f809e6bfb244a1dd4f0cac6573","docs/verification/world-appearance-memory-comparison.md":"3bc5d7ea99120c4034d78b6b05d1bff2dd635a8ef98392c4428c1b3f85c616e4"}
          for name, digest in expected.items():
              p = pathlib.Path(name)
              assert p.is_file() and not p.is_symlink()
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest
          PY
          python3 -I -B scripts/test_world_appearance_memory_comparison.py
      - name: Retain the original preparation disk floor
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, shutil
          assert min(shutil.disk_usage('candidate').free,
                     shutil.disk_usage(os.environ['RUNNER_TEMP']).free) > 2 * 1024**3
          PY
      - name: Install locked target dependencies without scripts
        working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Install locked World fixture dependencies without scripts
        working-directory: candidate
        run: npm ci --prefix authoring/fpv-worlds --ignore-scripts
      - name: Bind immutable guard auditor and executed control workflow
        env:
          DIAGNOSTIC_READ_TOKEN: ${{ github.token }}
        run: >-
          python3 -B controls/scripts/world-appearance-memory-comparison.py prepare
          --control "$GITHUB_WORKSPACE/controls"
          --root "$GITHUB_WORKSPACE/candidate"
          --label "${{ matrix.label }}"
          --trusted "$RUNNER_TEMP/world-memory-trusted-${{ matrix.label }}"
      - name: Observe the complete file with unchanged native limits
        id: observation
        run: >-
          python3 -B controls/scripts/world-appearance-memory-comparison.py run
          --control "$GITHUB_WORKSPACE/controls"
          --root "$GITHUB_WORKSPACE/candidate"
          --label "${{ matrix.label }}"
          --trusted "$RUNNER_TEMP/world-memory-trusted-${{ matrix.label }}"
          --output "$RUNNER_TEMP/world-memory-${{ matrix.label }}"
      - name: Retain the actual failed or successful observation
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: world-memory-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          path: ${{ runner.temp }}/world-memory-${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 14

  comparison:
    name: Record both outcomes without feature qualification
    needs: immutable
    if: >-
      always() &&
      github.repository == 'mekhovov/revealline' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: 1
      GIT_NO_LAZY_FETCH: 1
      GIT_OPTIONAL_LOCKS: 0
    steps:
      - name: Check out only reviewed diagnostic controls
        env:
          GIT_NO_LAZY_FETCH: '0'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controls
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/world-appearance-memory-comparison.yml
            /scripts/world-appearance-memory-comparison.py
            /scripts/world-appearance-memory-comparison-pins.json
            /scripts/test_world_appearance_memory_comparison.py
            /docs/verification/world-appearance-memory-comparison.md
      - name: Verify reviewed observer controls
        working-directory: controls
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib, pathlib
          expected = {"scripts/world-appearance-memory-comparison.py":"c8e0cc312dd1a904c6d17016cfa9514b0d096a1eb306182e7db01af4d9b87f35","scripts/world-appearance-memory-comparison-pins.json":"679106613c26d3c5d50512e20de207c5b452aaad1cca639ff9c9d8f60ca65091","scripts/test_world_appearance_memory_comparison.py":"e81fc2d0643d39258da07d550294d573cc3c01f809e6bfb244a1dd4f0cac6573","docs/verification/world-appearance-memory-comparison.md":"3bc5d7ea99120c4034d78b6b05d1bff2dd635a8ef98392c4428c1b3f85c616e4"}
          for name, digest in expected.items():
              p = pathlib.Path(name)
              assert p.is_file() and not p.is_symlink()
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest
          PY
      - name: Validate both bounded failed or successful artifacts
        env:
          DIAGNOSTIC_READ_TOKEN: ${{ github.token }}
        run: >-
          python3 -B controls/scripts/world-appearance-memory-comparison.py aggregate
          --control "$GITHUB_WORKSPACE/controls"
          --output "$RUNNER_TEMP/world-memory-comparison"
      - name: Retain comparison and any rejected or incomplete evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: world-memory-comparison-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-memory-comparison/
          if-no-files-found: error
          retention-days: 14
