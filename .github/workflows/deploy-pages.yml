name: Build and deploy GitHub Pages

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest stable release tag to deploy (for example, v0.46.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  release_gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Deploy only the latest stable release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          should_deploy=true
          if [ "$EVENT_NAME" = release ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            latest_tag="$(gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" | jq -r 'add | [.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')"
            if [ "$latest_tag" = null ]; then
              echo "No published stable release was found."
              exit 1
            fi
            if [ "$TARGET_REF" != "$latest_tag" ]; then
              echo "Skipping $TARGET_REF because $latest_tag is the latest stable release."
              should_deploy=false
            fi
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

  preflight:
    if: needs.release_gate.outputs.should_deploy == 'true'
    needs: release_gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, lint, and format source
        run: |
          npm run validate
          npm run lint
          npm run format:check
          npm run format:native:check
          node --check authoring/motion-lab/app.js

      - name: Initialize generated test cache
        run: mkdir -p .cache

      - name: Verify immutable production sources first
        run: node --test scripts/test-production-*.mjs

  test:
    if: needs.release_gate.outputs.should_deploy == 'true'
    needs: [release_gate, preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          path: source

      - name: Check out the workflow's test runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/run-test-shard.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Initialize generated test cache
        working-directory: source
        run: mkdir -p .cache

      - name: Run test shard ${{ matrix.shard }}/4
        working-directory: source
        run: node ../automation/scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4 --root .

  build:
    if: needs.release_gate.outputs.should_deploy == 'true'
    needs: [release_gate, preflight, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pull-request artifact
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Build current game and tagged releases
        if: github.event_name != 'pull_request'
        run: npm run build:pages -- --archive-plan scripts/pages-archives.json --source-repository mekhovov/revealline

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
