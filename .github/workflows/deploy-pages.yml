name: Build and deploy GitHub Pages

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'publishing/pages-controller/**'
      - '.github/workflows/publish-frozen-pages.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.cursor/skills/deploy-release-pages/**'
      - 'docs/deployment.md'
      - 'docs/fast-release-mode.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest stable release tag to deploy (for example, v0.46.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  # Superseded PR heads cannot qualify the current source; do not queue behind them.
  # Release routing and manual runs keep their existing serialization.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release_gate:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Read publication ownership from main, not the historical tag
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up publishing policy runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Match latest stable release to the reviewed frozen selector
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: node publishing/pages-controller/release-policy.mjs route

      - name: Dispatch the sole Pages publisher on main
        if: steps.gate.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh workflow run publish-frozen-pages.yml --repo mekhovov/revealline --ref main -f "release_tag=$REQUESTED_RELEASE"

  preflight:
    if: github.event_name == 'pull_request'
    outputs:
      runTests: ${{ steps.test_policy.outputs.runTests }}
      testMode: ${{ steps.test_policy.outputs.mode }}
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Check out the workflow's source verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/check-source-identity.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Read explicit automated-suite policy
        id: test_policy
        run: node .source-gate-automation/publishing/test-policy.mjs

      - name: Verify exact tracked source before commands
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Record temporary fast-release policy
        env:
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
        run: |
          if [ "$FULL_CI" = true ]; then
            echo "Full CI is enabled; the build job will run extended static and provenance checks."
          else
            echo "::warning::Fast-release mode is active. Full tests, lint, formatting, native formatting, and extended production checks are deferred."
            printf '%s\n' \
              '### Fast-release mode' \
              '' \
              'Only exact-source identity, release-critical validation, and the production build block this PR.' \
              'No passing verdict is claimed for deferred checks. See `docs/fast-release-mode.md`.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify tracked source after preflight
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

  test:
    if: >-
      github.event_name == 'pull_request' &&
      vars.REVEALLINE_FULL_CI == 'true' &&
      needs.preflight.outputs.runTests == 'true'
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          path: source

      - name: Check out the workflow's test runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/run-test-shard.mjs
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify exact tracked source before commands
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Run test shard ${{ matrix.shard }}/4
        working-directory: source
        run: |
          mkdir -p .cache
          node ../automation/scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4 --root .

      - name: Verify tracked source after test shard
        working-directory: source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

  build:
    if: github.event_name == 'pull_request'
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    # Fast-release mode installs dependencies only once. The separate preflight
    # remains a cheap, stable exact-source check for release evidence tooling.
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@v4
        with:
          # The PR build checks only its exact commit and tree. Immutable tags
          # and full history remain confined to the frozen Pages publisher.
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Check out the workflow's source verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Verify exact tracked source before commands
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies
        run: npm ci

      - name: Validate release-critical source
        run: npm run validate

      - name: Run extended static and provenance checks
        if: vars.REVEALLINE_FULL_CI == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run format:native:check
          node --check authoring/motion-lab/app.js
          node scripts/produce-field-kit-theme.mjs --check
          mkdir -p .cache
          node --test scripts/test-production-*.mjs

      - name: Build pull-request artifact
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Verify tracked source after build
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

  release-ready:
    if: always() && github.event_name == 'pull_request'
    needs: [preflight, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Apply the selected PR gate policy
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$BUILD_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$TEST_RESULT" = success
          else
            echo "Full tests are deferred and do not block this PR."
          fi
