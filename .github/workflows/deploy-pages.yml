name: Validate source for continuous main

on:
  pull_request:
    branches: [main]
    # Metadata changes do not alter admission. Gate only source-head lifecycle
    # events so title, labels, milestones, and draft promotion cannot create
    # redundant queue work.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  # Superseded PR heads cannot qualify the current source; do not queue behind them.
  # Release routing and manual runs keep their existing serialization.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `release-ready` is the single required status on protected `main`. Do not add
# pull-request path filters above: a filtered workflow leaves a required check
# pending forever. Maintenance is classified in preflight and exits quickly.

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    outputs:
      runTests: ${{ steps.test_policy.outputs.runTests }}
      testMode: ${{ steps.test_policy.outputs.mode }}
      admission: ${{ steps.admission.outputs.mode }}
      focusedRequired: ${{ steps.admission.outputs.focusedRequired }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workflow's test policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/deploy-pages.yml
            publishing/admission-binding.mjs
            publishing/admission-preflight.mjs
            publishing/focused-test-map.json
            publishing/focused-tests.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x

      - name: Read explicit automated-suite policy
        id: test_policy
        run: node .source-gate-automation/publishing/test-policy.mjs

      - name: Classify the pull request for the release train
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: node .source-gate-automation/publishing/admission-preflight.mjs

      - name: Preserve exact source and admission metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission.json
          if-no-files-found: error
          retention-days: 7

      - name: Record temporary fast-release policy
        env:
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
        run: |
          if [ "$FULL_CI" = true ]; then
            echo "Full CI is enabled; the build job will run extended static and provenance checks."
          else
            echo "::warning::Fast-release mode is active. Full tests, lint, formatting, native formatting, and extended production checks are deferred."
            printf '%s\n' \
              '### Fast-release mode' \
              '' \
              'Only exact-source identity and release-critical validation block this PR.' \
              'No passing verdict is claimed for deferred checks. See `docs/fast-release-mode.md`.' >> "$GITHUB_STEP_SUMMARY"
          fi

  focused:
    if: >-
      github.event_name == 'pull_request' &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.admission != 'hold' &&
      needs.preflight.outputs.focusedRequired == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    # Host fixtures are CPU-intensive. Two workers preserve parallel progress
    # without starving async test handoffs on the standard hosted runner.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false

      - name: Check out trusted focused-gate automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            publishing/focused-test-map.json
            publishing/focused-tests.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Download the immutable preflight path inventory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight-admission

      - name: Capture the reviewed changed-path set
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/preflight-admission/admission.json`, 'utf8'));
          if (receipt.headSha !== process.env.EXPECTED_SOURCE || receipt.paths.some(p => /[\r\n]/.test(p))) throw new Error('Invalid exact-head path inventory');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/focused-paths.txt`, receipt.paths.join('\n') + '\n');
          NODE
          test -s "$RUNNER_TEMP/focused-paths.txt"

      - name: Select the fail-closed focused gate
        id: plan
        env:
          FALLBACK_HANDLED_BY_BUILD: ${{ needs.preflight.outputs.admission == 'release' || needs.preflight.outputs.admission == 'release-evidence' }}
        run: |
          extra=()
          if [ "$FALLBACK_HANDLED_BY_BUILD" = true ]; then
            extra+=(--fallback-handled)
          fi
          node automation/publishing/focused-tests.mjs \
            --root source \
            --paths "$RUNNER_TEMP/focused-paths.txt" \
            --manifest automation/publishing/focused-test-map.json \
            --test-policy automation/publishing/test-policy.json \
            --plan-only \
            "${extra[@]}"

      - name: Verify exact tracked source before commands
        if: steps.plan.outputs.required == 'true'
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies once for selected focused gates
        if: steps.plan.outputs.required == 'true'
        working-directory: source
        run: npm ci --prefer-offline

      - name: Install pinned authoring dependencies for selected focused gates
        if: steps.plan.outputs.required == 'true'
        working-directory: source
        run: npm ci --prefix authoring/fpv-worlds --ignore-scripts --include=dev --prefer-offline

      - name: Run selected focused gates
        if: steps.plan.outputs.required == 'true'
        env:
          FALLBACK_HANDLED_BY_BUILD: ${{ needs.preflight.outputs.admission == 'release' || needs.preflight.outputs.admission == 'release-evidence' }}
        run: |
          extra=()
          if [ "$FALLBACK_HANDLED_BY_BUILD" = true ]; then
            extra+=(--fallback-handled)
          fi
          node automation/publishing/focused-tests.mjs \
            --root source \
            --paths "$RUNNER_TEMP/focused-paths.txt" \
            --manifest automation/publishing/focused-test-map.json \
            --test-policy automation/publishing/test-policy.json \
            "${extra[@]}"

      - name: Verify exact tracked source after commands
        if: always() && steps.plan.outputs.required == 'true'
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

  test:
    if: >-
      github.event_name == 'pull_request' &&
      needs.preflight.outputs.admission == 'release' &&
      vars.REVEALLINE_FULL_CI == 'true' &&
      needs.preflight.outputs.runTests == 'true'
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          path: source

      - name: Check out the workflow's test runner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/run-test-shard.mjs
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify exact tracked source before commands
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Run test shard ${{ matrix.shard }}/4
        working-directory: source
        run: |
          mkdir -p .cache
          node ../automation/scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4 --root .

      - name: Verify tracked source after test shard
        working-directory: source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

  build:
    if: >-
      github.event_name == 'pull_request' &&
      (needs.preflight.outputs.admission == 'release' ||
       needs.preflight.outputs.admission == 'release-evidence')
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    # Preflight selects the test policy. This is the sole PR source checkout.
    # Fast mode validates the exact source and defers the heavyweight artifact
    # assembly to merged-source qualification; full CI retains the PR build.
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The PR build checks only its exact commit and tree. Immutable tags
          # and full history remain confined to release qualification.
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Check out the workflow's source verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x
          cache: npm

      - name: Verify exact tracked source before commands
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies
        run: npm ci

      - name: Validate release-critical source
        run: npm run validate

      - name: Run extended source checks
        if: vars.REVEALLINE_FULL_CI == 'true'
        run: |
          node --check authoring/motion-lab/app.js
          mkdir -p .cache
          node --test scripts/test-production-*.mjs

      - name: Build pull-request artifact
        if: vars.REVEALLINE_FULL_CI == 'true'
        run: npm run build

      - name: Verify tracked source after build
        if: always() && vars.REVEALLINE_FULL_CI == 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Defer full artifact build to merged-source qualification
        if: vars.REVEALLINE_FULL_CI != 'true'
        run: |
          echo 'Fast mode: the complete deterministic release artifact is built once from the merged commit.'
          echo 'The merged-source qualification and frozen-artifact inspection remain release blockers.'

      - name: Verify tracked source after fast release gate
        if: always() && vars.REVEALLINE_FULL_CI != 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

  release-ready:
    if: always() && github.event_name == 'pull_request'
    needs: [preflight, focused, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Apply the selected PR gate policy
        env:
          ADMISSION: ${{ needs.preflight.outputs.admission }}
          BUILD_RESULT: ${{ needs.build.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          FOCUSED_REQUIRED: ${{ needs.preflight.outputs.focusedRequired }}
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          if [ "$ADMISSION" != hold ]; then
            if [ "$FOCUSED_REQUIRED" = true ]; then
              test "$FOCUSED_RESULT" = success
            else
              test "$FOCUSED_REQUIRED" = false
              test "$FOCUSED_RESULT" = skipped
            fi
          fi
          if [ "$ADMISSION" = maintenance ]; then
            echo 'Bounded documentation/controller maintenance: selected validation passed under the explicit test policy; waived suites are not passed. Product build not required.'
            exit 0
          fi
          if [ "$ADMISSION" = scheduled ]; then
            echo 'Explicit milestone schedule: selected validation passed under the explicit test policy; waived suites are not passed.'
            exit 0
          fi
          if [ "$ADMISSION" = release-evidence ]; then
            echo 'Docs-only post-merge release evidence: exact-source validation is required without allocating another product version.'
            test "$BUILD_RESULT" = success
            exit 0
          fi
          if [ "$ADMISSION" != release ]; then
            echo '::error::This product PR is not assigned an immutable release slot. Keep it draft/stacked, or promote one reviewed root by titling it Release vX.Y.Z.'
            exit 1
          fi
          test "$BUILD_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$TEST_RESULT" = success
          else
            echo "Full tests are deferred and do not block this PR."
          fi
