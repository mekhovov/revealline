name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'publishing/pages-controller/**'
      - '.github/workflows/publish-frozen-pages.yml'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'publishing/pages-controller/**'
      - '.github/workflows/publish-frozen-pages.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      frozen-controller: ${{ steps.publication.outputs.frozen-controller }}
    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Lint source
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Check native formatting and motion lab syntax
        run: |
          npm run format:native:check
          node --check authoring/motion-lab/app.js

      - name: Select publication owner
        id: publication
        run: |
          if test -f publishing/pages-controller/publication.json; then
            echo "frozen-controller=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen-controller=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build current game and tagged releases
        if: steps.publication.outputs.frozen-controller != 'true'
        run: npm run build:pages -- --archive-plan scripts/pages-archives.json --source-repository mekhovov/revealline

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.publication.outputs.frozen-controller != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.outputs.frozen-controller != 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
