name: Validate source for continuous main

on:
  pull_request:
    branches: [main]
    # Metadata changes do not alter admission. Gate only source-head lifecycle
    # events so title, labels, milestones, and draft promotion cannot create
    # redundant queue work.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  # Superseded PR heads cannot qualify the current source; do not queue behind them.
  # Release routing and manual runs keep their existing serialization.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `release-ready` is the single required status on protected `main`. Do not add
# pull-request path filters above: a filtered workflow leaves a required check
# pending forever. Maintenance is classified in preflight and exits quickly.

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    outputs:
      runTests: ${{ steps.test_policy.outputs.runTests }}
      testMode: ${{ steps.test_policy.outputs.mode }}
      admission: ${{ steps.admission.outputs.mode }}
      focusedPlanSha256: ${{ steps.compact_plan.outputs.focusedPlanSha256 }}
      focusedMatrix: ${{ steps.compact_plan.outputs.focusedMatrix }}
      focusedShards: ${{ steps.compact_plan.outputs.focusedShards }}
      focusedContract: ${{ steps.compact_plan.outputs.focusedContract }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workflow's test policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/deploy-pages.yml
            publishing/admission-binding.mjs
            publishing/admission-preflight.mjs
            publishing/admission-paths.mjs
            publishing/focused-test-map.json
            publishing/focused-tests.mjs
            publishing/focused-shard-plan.mjs
            publishing/focused-git-inputs.mjs
            publishing/focused-compact.mjs
            publishing/focused-compact-cli.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x

      - name: Read explicit automated-suite policy
        id: test_policy
        run: node .source-gate-automation/publishing/test-policy.mjs

      - name: Classify the pull request for the release train
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: node .source-gate-automation/publishing/admission-preflight.mjs

      - name: Preserve exact source and admission metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission.json
          if-no-files-found: error
          retention-days: 7

      - name: Check out only exact-head planning data
        if: steps.admission.outputs.mode != 'hold'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: focused-plan-inputs
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /.npmrc
            /authoring/fpv-worlds/package.json
            /authoring/fpv-worlds/package-lock.json
            /authoring/fpv-worlds/.npmrc
          sparse-checkout-cone-mode: false

      - name: Prepare the final nonempty focused assignments
        if: steps.admission.outputs.mode != 'hold'
        id: compact_plan
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
          EXPECTED_AUTOMATION: ${{ github.workflow_sha }}
        run: |
          node .source-gate-automation/publishing/focused-compact-cli.mjs prepare \
            --automation .source-gate-automation \
            --root focused-plan-inputs \
            --admission "$RUNNER_TEMP/admission.json" \
            --packet "$RUNNER_TEMP/focused-plan.json"

      - name: Preserve the exact focused plan
        if: steps.admission.outputs.mode != 'hold'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: focused-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Record temporary fast-release policy
        env:
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
        run: |
          if [ "$FULL_CI" = true ]; then
            echo "Full CI is enabled; the build job will run extended static and provenance checks."
          else
            echo "::warning::Fast-release mode is active. Full tests, lint, formatting, native formatting, and extended production checks are deferred."
            printf '%s\n' \
              '### Fast-release mode' \
              '' \
              'Only exact-source identity and release-critical validation block this PR.' \
              'No passing verdict is claimed for deferred checks. See `docs/fast-release-mode.md`.' >> "$GITHUB_STEP_SUMMARY"
          fi

  focused_shards:
    if: >-
      github.event_name == 'pull_request' &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.admission != 'hold' &&
      needs.preflight.outputs.focusedContract == 'revealline-focused-plan.v2' &&
      needs.preflight.outputs.focusedShards != '0'
    needs: preflight
    runs-on: ubuntu-latest
    # Host fixtures are CPU-intensive. Two workers preserve parallel progress
    # without starving async test handoffs on the standard hosted runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.preflight.outputs.focusedMatrix) }}
    permissions:
      contents: read
      pull-requests: read
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
      EXPECTED_AUTOMATION: ${{ github.workflow_sha }}
      EXPECTED_PLAN_SHA256: ${{ needs.preflight.outputs.focusedPlanSha256 }}
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false

      - name: Check out trusted focused-gate automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/deploy-pages.yml
            publishing/admission-binding.mjs
            publishing/admission-preflight.mjs
            publishing/admission-paths.mjs
            publishing/focused-test-map.json
            publishing/focused-tests.mjs
            publishing/focused-shard-plan.mjs
            publishing/focused-git-inputs.mjs
            publishing/focused-compact.mjs
            publishing/focused-compact-cli.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Download the immutable preflight path inventory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight-admission

      - name: Download the exact preflight execution plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: focused-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-plan

      - name: Verify exact tracked source before commands
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies once for selected focused gates
        working-directory: source
        run: npm ci --prefer-offline

      - name: Install pinned authoring dependencies for selected focused gates
        working-directory: source
        run: npm ci --prefix authoring/fpv-worlds --ignore-scripts --include=dev --prefer-offline

      - name: Run selected focused gates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/focused-shard"
          node automation/publishing/focused-compact-cli.mjs execute \
            --automation automation \
            --root source \
            --packet "$RUNNER_TEMP/focused-plan/focused-plan.json" \
            --plan-sha256 "$EXPECTED_PLAN_SHA256" \
            --shard ${{ matrix.shard }} \
            --receipt "$RUNNER_TEMP/focused-shard/receipt.json" \
            --admission "$RUNNER_TEMP/preflight-admission/admission.json" \
            2>&1 | tee "$RUNNER_TEMP/focused-shard/output.log"

      - name: Verify exact tracked source after commands
        if: always()
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

      - name: Retain available focused shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: focused-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/focused-shard/
          if-no-files-found: error
          retention-days: 7

  focused:
    # Keep the existing required status: no individual shard can qualify the gate.
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.admission != 'hold' &&
      needs.preflight.outputs.focusedContract == 'revealline-focused-plan.v2' &&
      needs.preflight.outputs.focusedShards != '0'
    needs: [preflight, focused_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
      EXPECTED_AUTOMATION: ${{ github.workflow_sha }}
      EXPECTED_PLAN_SHA256: ${{ needs.preflight.outputs.focusedPlanSha256 }}
      WORKERS_RESULT: ${{ needs.focused_shards.result }}
    steps:
      - name: Require the planned worker job outcome
        env:
          SHARDS_RESULT: ${{ needs.focused_shards.result }}
          SHARDS_COUNT: ${{ needs.preflight.outputs.focusedShards }}
        run: |
          case "$SHARDS_COUNT" in
            1|2|3|4) test "$SHARDS_RESULT" = success ;;
            *) exit 1 ;;
          esac

      - name: Check out trusted focused receipt verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/deploy-pages.yml
            publishing/admission-binding.mjs
            publishing/admission-preflight.mjs
            publishing/admission-paths.mjs
            publishing/focused-test-map.json
            publishing/focused-tests.mjs
            publishing/focused-shard-plan.mjs
            publishing/focused-git-inputs.mjs
            publishing/focused-compact.mjs
            publishing/focused-compact-cli.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x

      - name: Download immutable preflight admission
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight-admission

      - name: Download the exact preflight execution plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: focused-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-plan

      - name: Download one focused shard into its exact namespace
        if: needs.preflight.outputs.focusedShards == '1'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: focused-shard-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: ${{ runner.temp }}/focused-shards/focused-shard-${{ github.run_id }}-${{ github.run_attempt }}-1

      - name: Download the planned focused shard receipts
        if: needs.preflight.outputs.focusedShards != '0' && needs.preflight.outputs.focusedShards != '1'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: focused-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/focused-shards
          merge-multiple: false

      - name: Require exact complete command coverage or typed non-applicability
        run: |
          node automation/publishing/focused-compact-cli.mjs verify \
            --automation automation \
            --packet "$RUNNER_TEMP/focused-plan/focused-plan.json" \
            --plan-sha256 "$EXPECTED_PLAN_SHA256" \
            --receipts "$RUNNER_TEMP/focused-shards" \
            --prefix "focused-shard-${{ github.run_id }}-${{ github.run_attempt }}-" \
            --admission "$RUNNER_TEMP/preflight-admission/admission.json"

  test:
    if: >-
      github.event_name == 'pull_request' &&
      needs.preflight.outputs.admission == 'release' &&
      vars.REVEALLINE_FULL_CI == 'true' &&
      needs.preflight.outputs.runTests == 'true'
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          path: source

      - name: Check out the workflow's test runner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/run-test-shard.mjs
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify exact tracked source before commands
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Run test shard ${{ matrix.shard }}/4
        working-directory: source
        run: |
          mkdir -p .cache
          node ../automation/scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4 --root .

      - name: Verify tracked source after test shard
        working-directory: source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

  build:
    if: >-
      github.event_name == 'pull_request' &&
      (needs.preflight.outputs.admission == 'release' ||
       needs.preflight.outputs.admission == 'release-evidence')
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    # Preflight selects the test policy. This is the sole PR source checkout.
    # Fast mode validates the exact source and defers the heavyweight artifact
    # assembly to merged-source qualification; full CI retains the PR build.
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The PR build checks only its exact commit and tree. Immutable tags
          # and full history remain confined to release qualification.
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Check out the workflow's source verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x
          cache: npm

      - name: Verify exact tracked source before commands
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies
        run: npm ci

      - name: Validate release-critical source
        run: npm run validate

      - name: Run extended source checks
        if: vars.REVEALLINE_FULL_CI == 'true'
        run: |
          node --check authoring/motion-lab/app.js
          mkdir -p .cache
          node --test scripts/test-production-*.mjs

      - name: Build pull-request artifact
        if: vars.REVEALLINE_FULL_CI == 'true'
        run: npm run build

      - name: Verify tracked source after build
        if: always() && vars.REVEALLINE_FULL_CI == 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Defer full artifact build to merged-source qualification
        if: vars.REVEALLINE_FULL_CI != 'true'
        run: |
          echo 'Fast mode: the complete deterministic release artifact is built once from the merged commit.'
          echo 'The merged-source qualification and frozen-artifact inspection remain release blockers.'

      - name: Verify tracked source after fast release gate
        if: always() && vars.REVEALLINE_FULL_CI != 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

  release-ready:
    if: always() && github.event_name == 'pull_request'
    needs: [preflight, focused_shards, focused, test, build]
    runs-on: ubuntu-latest
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
      EXPECTED_AUTOMATION: ${{ github.workflow_sha }}
      EXPECTED_PLAN_SHA256: ${{ needs.preflight.outputs.focusedPlanSha256 }}
      WORKERS_RESULT: ${{ needs.focused_shards.result }}
    steps:
      # Zero work adds no focused runner. Authenticate its typed proof in this
      # already-required gate; skipped jobs alone are never sufficient.
      - name: Check out trusted zero-work verifier
        if: >-
          needs.preflight.result == 'success' &&
          needs.preflight.outputs.focusedContract == 'revealline-focused-plan.v2' &&
          needs.preflight.outputs.focusedShards == '0'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/deploy-pages.yml
            publishing/admission-binding.mjs
            publishing/admission-preflight.mjs
            publishing/admission-paths.mjs
            publishing/focused-test-map.json
            publishing/focused-tests.mjs
            publishing/focused-shard-plan.mjs
            publishing/focused-git-inputs.mjs
            publishing/focused-compact.mjs
            publishing/focused-compact-cli.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js for zero-work verification
        if: >-
          needs.preflight.result == 'success' &&
          needs.preflight.outputs.focusedContract == 'revealline-focused-plan.v2' &&
          needs.preflight.outputs.focusedShards == '0'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 20.19.x

      - name: Download immutable zero-work admission
        if: >-
          needs.preflight.result == 'success' &&
          needs.preflight.outputs.focusedContract == 'revealline-focused-plan.v2' &&
          needs.preflight.outputs.focusedShards == '0'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight-admission

      - name: Download the authenticated zero-work plan
        if: >-
          needs.preflight.result == 'success' &&
          needs.preflight.outputs.focusedContract == 'revealline-focused-plan.v2' &&
          needs.preflight.outputs.focusedShards == '0'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: focused-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-plan

      - name: Require typed zero commands and no worker receipts
        id: zero_focused
        if: >-
          needs.preflight.result == 'success' &&
          needs.preflight.outputs.focusedContract == 'revealline-focused-plan.v2' &&
          needs.preflight.outputs.focusedShards == '0'
        run: |
          test "$WORKERS_RESULT" = skipped
          node automation/publishing/focused-compact-cli.mjs verify \
            --automation automation \
            --packet "$RUNNER_TEMP/focused-plan/focused-plan.json" \
            --plan-sha256 "$EXPECTED_PLAN_SHA256" \
            --receipts "$RUNNER_TEMP/focused-zero-receipts" \
            --prefix "focused-shard-${{ github.run_id }}-${{ github.run_attempt }}-" \
            --admission "$RUNNER_TEMP/preflight-admission/admission.json"

      - name: Apply the selected PR gate policy
        env:
          ADMISSION: ${{ needs.preflight.outputs.admission }}
          BUILD_RESULT: ${{ needs.build.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          FOCUSED_CONTRACT: ${{ needs.preflight.outputs.focusedContract }}
          FOCUSED_SHARDS: ${{ needs.preflight.outputs.focusedShards }}
          SHARDS_RESULT: ${{ needs.focused_shards.result }}
          ZERO_FOCUSED_RESULT: ${{ steps.zero_focused.outcome }}
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          if [ "$ADMISSION" != hold ]; then
            test "$FOCUSED_CONTRACT" = revealline-focused-plan.v2
            if [ "$FOCUSED_SHARDS" = 0 ]; then
              test "$FOCUSED_RESULT" = skipped
              test "$SHARDS_RESULT" = skipped
              test "$ZERO_FOCUSED_RESULT" = success
            else
              case "$FOCUSED_SHARDS" in 1|2|3|4) ;; *) exit 1 ;; esac
              test "$FOCUSED_RESULT" = success
            fi
          fi
          if [ "$ADMISSION" = maintenance ]; then
            echo 'Bounded documentation/controller maintenance: selected validation passed under the explicit test policy; waived suites are not passed. Product build not required.'
            exit 0
          fi
          if [ "$ADMISSION" = scheduled ]; then
            echo 'Explicit milestone schedule: selected validation passed under the explicit test policy; waived suites are not passed.'
            exit 0
          fi
          if [ "$ADMISSION" = release-evidence ]; then
            echo 'Docs-only post-merge release evidence: exact-source validation is required without allocating another product version.'
            test "$BUILD_RESULT" = success
            exit 0
          fi
          if [ "$ADMISSION" != release ]; then
            echo '::error::This product PR is not assigned an immutable release slot. Keep it draft/stacked, or promote one reviewed root by titling it Release vX.Y.Z.'
            exit 1
          fi
          test "$BUILD_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$TEST_RESULT" = success
          else
            echo "Full tests are deferred and do not block this PR."
          fi
