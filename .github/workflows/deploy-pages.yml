name: Build and deploy GitHub Pages

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'publishing/pages-controller/**'
      - '.github/workflows/publish-frozen-pages.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.cursor/skills/deploy-release-pages/**'
      - 'docs/deployment.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest stable release tag to deploy (for example, v0.46.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_gate:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Read publication ownership from main, not the historical tag
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up publishing policy runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Match latest stable release to the reviewed frozen selector
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: node publishing/pages-controller/release-policy.mjs route

      - name: Dispatch the sole Pages publisher on main
        if: steps.gate.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh workflow run publish-frozen-pages.yml --repo mekhovov/revealline --ref main -f "release_tag=$REQUESTED_RELEASE"

  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, lint, and format source
        run: |
          npm run validate
          npm run lint
          npm run format:check
          npm run format:native:check
          node --check authoring/motion-lab/app.js

      - name: Verify immutable production sources first
        run: |
          # Production tests use .cache for temporary fixtures.
          mkdir -p .cache
          node --test scripts/test-production-*.mjs

  test:
    if: github.event_name == 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test shard ${{ matrix.shard }}/4
        run: |
          mkdir -p .cache
          node scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4

  build:
    if: github.event_name == 'pull_request'
    needs: [preflight, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pull-request artifact
        if: github.event_name == 'pull_request'
        run: npm run build
