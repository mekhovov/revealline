name: Build and deploy GitHub Pages

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest stable release tag to deploy (for example, v0.46.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-gates-${{ github.ref }}
  # Superseded PR heads cannot qualify the current source; do not queue behind them.
  # Release routing and manual runs keep their existing serialization.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `release-ready` is the single required status on protected `main`. Do not add
# pull-request path filters above: a filtered workflow leaves a required check
# pending forever. Maintenance is classified in preflight and exits quickly.

jobs:
  release_gate:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Read publication ownership from main, not the historical tag
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up publishing policy runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Match latest stable release to the reviewed frozen selector
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: node publishing/pages-controller/release-policy.mjs route

      - name: Dispatch the sole Pages publisher on main
        if: steps.gate.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh workflow run publish-frozen-pages.yml --repo mekhovov/revealline --ref main -f "release_tag=$REQUESTED_RELEASE"

  preflight:
    if: github.event_name == 'pull_request'
    outputs:
      runTests: ${{ steps.test_policy.outputs.runTests }}
      testMode: ${{ steps.test_policy.outputs.mode }}
      admission: ${{ steps.admission.outputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workflow's test policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            publishing/pages-controller/metadata.mjs
            publishing/pages-controller/publication.json
            publishing/pages-controller/release-policy.mjs
            publishing/pages-controller/release-train-boundary.mjs
            publishing/test-policy.json
            publishing/test-policy.mjs
            scripts/pages-archive.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Read explicit automated-suite policy
        id: test_policy
        run: node .source-gate-automation/publishing/test-policy.mjs

      - name: Classify the pull request for the release train
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # A product change consumes an immutable version slot only when an
          # owner explicitly promotes it with a stable release title. A
          # milestone is an explicit source-only schedule: it may merge into
          # the accumulating train, while the one promoted release remains the
          # only PR that builds and publishes a versioned artifact.
          if [[ "$PR_TITLE" =~ ^Release\ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo 'mode=release' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          milestone="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.milestone.title // ""')"
          if [[ "$milestone" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo 'mode=scheduled' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t paths < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename')
          if [ "${#paths[@]}" -gt 0 ] && printf '%s\n' "${paths[@]}" | \
            grep -Ev '^(docs/|publishing/|\.github/workflows/|game/test/)' >/dev/null; then
            echo 'mode=hold' >> "$GITHUB_OUTPUT"
          else
            # Documentation, test-only evidence, and release-controller
            # maintenance are bounded non-product work; they do not allocate a
            # product release slot. Any accompanying runtime path still holds
            # the whole PR in the product lane.
            echo 'mode=maintenance' >> "$GITHUB_OUTPUT"
          fi

      - name: Require the previous stable release on public Pages
        if: steps.admission.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          base_version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$PR_BASE_SHA" \
            --jq .content | base64 --decode | jq -r .version)"
          PR_BASE_VERSION="$base_version" \
            node .source-gate-automation/publishing/pages-controller/release-train-boundary.mjs public

      - name: Record temporary fast-release policy
        env:
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
        run: |
          if [ "$FULL_CI" = true ]; then
            echo "Full CI is enabled; the build job will run extended static and provenance checks."
          else
            echo "::warning::Fast-release mode is active. Full tests, lint, formatting, native formatting, and extended production checks are deferred."
            printf '%s\n' \
              '### Fast-release mode' \
              '' \
              'Only exact-source identity and release-critical validation block this PR.' \
              'No passing verdict is claimed for deferred checks. See `docs/fast-release-mode.md`.' >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    if: >-
      github.event_name == 'pull_request' &&
      needs.preflight.outputs.admission == 'release' &&
      vars.REVEALLINE_FULL_CI == 'true' &&
      needs.preflight.outputs.runTests == 'true'
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          path: source

      - name: Check out the workflow's test runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/run-test-shard.mjs
            scripts/check-source-identity.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify exact tracked source before commands
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Run test shard ${{ matrix.shard }}/4
        working-directory: source
        run: |
          mkdir -p .cache
          node ../automation/scripts/run-test-shard.mjs --shard ${{ matrix.shard }}/4 --root .

      - name: Verify tracked source after test shard
        working-directory: source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node ../automation/scripts/check-source-identity.mjs --root .

  build:
    if: github.event_name == 'pull_request' && needs.preflight.outputs.admission == 'release'
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    # Preflight selects the test policy. This is the sole PR source checkout.
    # Fast mode validates the exact source and defers the heavyweight artifact
    # assembly to merged-source qualification; full CI retains the PR build.
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@v4
        with:
          # The PR build checks only its exact commit and tree. Immutable tags
          # and full history remain confined to the frozen Pages publisher.
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Check out the workflow's source verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .source-gate-automation
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            publishing/pages-controller/metadata.mjs
            publishing/pages-controller/publication.json
            publishing/pages-controller/release-policy.mjs
            publishing/pages-controller/release-train-boundary.mjs
            scripts/check-source-identity.mjs
            scripts/pages-archive.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Verify exact tracked source before commands
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Require exact release version identity
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .source-gate-automation/publishing/pages-controller/release-train-boundary.mjs source .

      - name: Install dependencies
        run: npm ci

      - name: Validate release-critical source
        run: npm run validate

      - name: Run extended static and provenance checks
        if: vars.REVEALLINE_FULL_CI == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run format:native:check
          node --check authoring/motion-lab/app.js
          node scripts/produce-field-kit-theme.mjs --check
          mkdir -p .cache
          node --test scripts/test-production-*.mjs

      - name: Build pull-request artifact
        if: vars.REVEALLINE_FULL_CI == 'true'
        run: npm run build

      - name: Verify tracked source after build
        if: always() && vars.REVEALLINE_FULL_CI == 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

      - name: Defer full artifact build to merged-source qualification
        if: vars.REVEALLINE_FULL_CI != 'true'
        run: |
          echo 'Fast mode: the complete deterministic release artifact is built once from the merged commit.'
          echo 'The merged-source qualification and frozen-artifact inspection remain release blockers.'

      - name: Verify tracked source after fast release gate
        if: always() && vars.REVEALLINE_FULL_CI != 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node .source-gate-automation/scripts/check-source-identity.mjs --root .

  release-ready:
    if: always() && github.event_name == 'pull_request'
    needs: [preflight, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Apply the selected PR gate policy
        env:
          ADMISSION: ${{ needs.preflight.outputs.admission }}
          BUILD_RESULT: ${{ needs.build.result }}
          FULL_CI: ${{ vars.REVEALLINE_FULL_CI || 'false' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          if [ "$ADMISSION" = maintenance ]; then
            echo 'Bounded documentation/controller maintenance: product build not required.'
            exit 0
          fi
          if [ "$ADMISSION" = scheduled ]; then
            echo 'Explicit milestone schedule: source-only merge admitted; the promoted release is the sole artifact build and publication gate.'
            exit 0
          fi
          if [ "$ADMISSION" != release ]; then
            echo '::error::This product PR is not assigned an immutable release slot. Keep it draft/stacked, or promote one reviewed root by titling it Release vX.Y.Z.'
            exit 1
          fi
          test "$BUILD_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$TEST_RESULT" = success
          else
            echo "Full tests are deferred and do not block this PR."
          fi
