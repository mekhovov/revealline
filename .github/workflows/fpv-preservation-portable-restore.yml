name: FPV preservation portable restore

on:
  pull_request:
    paths:
      - authoring/fpv-development-preservation/**
      - docs/reports/fpv-development-preservation-20261016/final-index/**
      - .github/workflows/fpv-preservation-portable-restore.yml

permissions:
  contents: read

concurrency:
  group: fpv-preservation-portable-restore-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  final-index:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.index.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            docs/reports/fpv-development-preservation-20261016/final-index
      - id: index
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('docs/reports/fpv-development-preservation-20261016/final-index/preservation-index.json')
          ready = False
          if path.exists():
              index = json.loads(path.read_text())
              if any(index.get(k) is not True for k in ['inventoryComplete', 'inventorySetFinal', 'coverageComplete']):
                  raise SystemExit('Final index is not root-confirmed and complete')
              ready = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('ready=' + str(ready).lower() + '\n')
          PY
  restore:
    needs: final-index
    if: >-
      needs.final-index.outputs.ready == 'true' &&
      github.event.pull_request.number == 1552 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/fpv-development-preservation-tools-20261016'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Draft release visibility only; restoration uses authenticated GET requests.
    timeout-minutes: 120
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            authoring/fpv-development-preservation
            docs/reports/fpv-development-preservation-20261016/final-index
      - name: Verify exact head and required readers
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          command -v gh
          sudo apt-get update -qq
          sudo apt-get install -y zstd
      - name: Measure capacity and restore every final relative path and link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/portable-restore-receipts"
          python3 authoring/fpv-development-preservation/portable_restore_check.py \
            --index docs/reports/fpv-development-preservation-20261016/final-index/preservation-index.json \
            --work "$RUNNER_TEMP/portable-restore" \
            --receipt "$RUNNER_TEMP/portable-restore-receipts/full-portable-restore.json"
      - name: Retain only small restoration receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preservation-portable-restore
          path: |
            ${{ runner.temp }}/portable-restore-receipts/*.json
          if-no-files-found: warn
          retention-days: 90
