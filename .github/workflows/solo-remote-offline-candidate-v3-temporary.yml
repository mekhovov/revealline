name: Temporary Solo verifier-closure successor independent final offline persistence

on:
  pull_request:
    paths:
      - 'scripts/test-solo-final-offline-audio-v2-release.mjs'
      - 'scripts/test-solo-source-verifier-smoke.mjs'
      - 'scripts/test-solo-verifier-successor-admission.mjs'
      - 'scripts/test-solo-final-offline-audio-release.mjs'
      - '.github/workflows/solo-remote-offline-candidate-v3-temporary.yml'
      - 'scripts/run-solo-remote-correctness.mjs'
      - 'scripts/solo-remote-archive.py'
      - 'scripts/test-solo-remote-correctness.mjs'
      - 'docs/performance/solo-remote-offline-candidate-v3-plan.json'
      - 'scripts/solo-remote-offline.mjs'
      - 'scripts/solo-offline-gameplay.mjs'
      - 'scripts/test-solo-offline-gameplay.mjs'
      - 'scripts/test-solo-offline-starter.mjs'
      - 'docs/performance/fixtures/solo-remote-offline/**'
      - 'scripts/observe-solo-offline-persistence.mjs'
      - 'scripts/test-solo-remote-offline.mjs'
      - 'scripts/solo-remote-baseline.mjs'
      - 'scripts/test-solo-remote-baseline.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-offline-candidate-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  correctness:
    # Exact successful final a6 package admitted for one independent offline observation.
    # Separately declared setup-only successor; prior no-observation outcome is retained.
    # Historical paired failure is preserved; this is one independent candidate observation.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'c41a02216c0811952232a387fd1743e09452c269'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Initialize paths after the runner is assigned
        timeout-minutes: 1
        shell: bash
        run: |
          printf '%s\n' \
            "SOLO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/solo-browser-tools/node_modules/playwright/index.mjs" \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/solo-browser-binaries" \
            "OUTPUT=$RUNNER_TEMP/solo-linux-offline" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
