name: Temporary Solo final paired audio confirmation

on:
  pull_request:
    paths:
      - 'scripts/test-solo-final-offline-audio-release.mjs'
      - '.github/workflows/solo-remote-final-audio-temporary.yml'
      - 'docs/performance/solo-final-audio-plan.json'
      - 'scripts/prepare-solo-audio-fixtures.mjs'
      - 'scripts/qualify-solo-runtime.mjs'
      - 'scripts/run-solo-remote-correctness.mjs'
      - 'scripts/solo-qualification-replay.mjs'
      - 'scripts/solo-remote-auxiliary.mjs'
      - 'scripts/solo-remote-baseline.mjs'
      - 'scripts/test-prepare-solo-audio-fixtures.mjs'
      - 'scripts/test-solo-qualification-browser-context.mjs'
      - 'scripts/test-solo-qualification.mjs'
      - 'scripts/test-solo-remote-auxiliary.mjs'
      - 'scripts/test-solo-remote-baseline.mjs'
      - 'scripts/test-solo-remote-correctness.mjs'
      - 'scripts/verify-solo-build.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: solo-linux-final-audio-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  declare:
    # Exact successful final a6 package and complete tooling closure admitted for one observation wave.
    # One-shot edge is before a6eacee2f09f06f9ffa76fe8cd5d674aff0475a4.
    if: github.event.pull_request.number == 1544 && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && github.event.before == 'a6eacee2f09f06f9ffa76fe8cd5d674aff0475a4'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.phase.outputs.matrix }}
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/performance/solo-final-audio-plan.json
            /scripts/solo-remote-auxiliary.mjs
      - timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Admit four paired speech and music jobs
        id: phase
        timeout-minutes: 1
        run: node scripts/solo-remote-auxiliary.mjs matrix-plan docs/performance/solo-final-audio-plan.json >> "$GITHUB_OUTPUT"
  auxiliary:
    needs: declare
    name: ${{ matrix.observation }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.jobMinutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.declare.outputs.matrix) }}
    env:
      SOLO_TOOLING_REVISION: ${{ github.event.pull_request.head.sha }}
      SOLO_BASELINE_SOURCE: ${{ github.workspace }}/baseline
      SOLO_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/solo-remote-auxiliary-temporary.yml
            /.github/workflows/solo-remote-final-audio-temporary.yml
            /.github/workflows/solo-remote-offline-candidate-temporary.yml
            /authoring/library/licensed-audio/provenance/expansion-downloads.json
            /docs/performance/fixtures/solo-final-recovery/historical-a6-source.json
            /docs/performance/fixtures/solo-remote-auxiliary/first-return.xonix.fixture
            /docs/performance/fixtures/solo-remote-auxiliary/long-rail.xonix.fixture
            /docs/performance/fixtures/solo-remote-auxiliary/recorded-music.qualification.fixture
            /docs/performance/fixtures/solo-remote-auxiliary/recorded-speech.qualification.fixture
            /docs/performance/fixtures/solo-remote-auxiliary/recovery.qualification.fixture
            /docs/performance/fixtures/solo-remote-auxiliary/signal-07.xonix.fixture
