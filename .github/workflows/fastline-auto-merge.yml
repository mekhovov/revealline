name: Fastline exact-head auto-merge

on:
  workflow_run:
    workflows: [Build and deploy GitHub Pages]
    types: [completed]
  pull_request:
    branches: [main]
    types:
      [
        synchronize,
        edited,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
        ready_for_review,
        converted_to_draft,
      ]
  pull_request_review:
    branches: [main]
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: fastline-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # This privileged controller checks out automation only from protected main.
      # It never checks out or executes pull-request code.
      - name: Check out trusted controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: publishing/fastline-merge-controller.mjs
          sparse-checkout-cone-mode: false

      - name: Reconcile exact-head admission
        env:
          ACTIVE_MILESTONE: ${{ vars.REVEALLINE_ACTIVE_RELEASE }}
          GH_TOKEN: ${{ github.token }}
        run: node publishing/fastline-merge-controller.mjs
