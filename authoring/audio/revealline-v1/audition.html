<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RevealLine sound audition</title><style>body{background:#101723;color:#edf5ff;font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}button,select,input{font:inherit;margin:6px;padding:10px}button{background:#24384e;color:inherit;border:1px solid #607890;border-radius:8px}canvas{width:100%;background:#162a37;border-radius:12px}#cues{display:flex;flex-wrap:wrap}pre{white-space:pre-wrap}</style><h1>RevealLine · Sound audition</h1><p>Production sound bank and mixer. Start audio, then compare cues and approach the moving source. This is a presentation fixture; it does not change game saves.</p><button id="enable">Start audio</button><button id="mute">Mute</button><label>Enemy distance <input id="distance" type="range" min="0" max="80" value="25"></label><label><input type="checkbox" id="moving" checked>Moving player</label><label>Body <select id="body"><option value="fpv-scout">FPV rotor</option><option value="heritage-bird">Bird wings</option><option value="heritage-weaver">Thread / paper</option><option value="ground-rover">Ground wheels</option><option value="arcade">Arcade motor</option></select></label><canvas width="900" height="180" id="board"></canvas><p id="movementstatus">Movement preview is off.</p><div id="cues"></div><pre id="status">Audio not activated.</pre><script type="module">
import {Soundscape} from '../../../game/ui/audio.mjs';
import {createAudioMaster} from '../../../game/ui/audio-master.mjs';
import {EFFECT_BANK} from '../../../game/audio/effects/bank.mjs';
const master=createAudioMaster({muted:false,volume:.65});
const sound=new Soundscape({audioMaster:master});sound.configure({master:1,music:0,sfx:.7});
const $=id=>document.getElementById(id),ctx=$('board').getContext('2d');
const run={width:100,height:100,cells:new Uint8Array(10000),totalClaimable:10000,tick:0,time:0,status:'running',player:{x:10,y:50},enemies:[{id:'audition',type:'bouncer',x:35,y:50}]};
let ready=false,frame;
$('enable').onclick=async()=>{ready=await sound.enable();await Promise.all(sound.feedbackDirector.pending.values());$('status').textContent=`${sound.feedbackDirector.buffers.size}/${Object.keys(EFFECT_BANK).length} decoded. The fixture is ready.`;};
$('mute').onclick=()=>{master.setMuted(!master.snapshot().muted);$('mute').textContent=master.snapshot().muted?'Unmute':'Mute';};
for(const name of Object.keys(EFFECT_BANK).filter(n=>!EFFECT_BANK[n].loop)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>sound.feedbackDirector.play(name,{ui:['focus','confirm','cancel'].includes(name),radio:name.startsWith('radio-')});$('cues').append(b);}
const boot=document.createElement('button');boot.textContent='FPV boot → Armed';boot.onclick=()=>{sound.feedbackDirector.reset();sound.feedbackDirector.update(true,{family:'fpv'},run);$('status').textContent=[...sound.voices].some(v=>v.radio)?'FPV startup scheduled; Armed follows the motor cue.':'No radio cue scheduled. Activate audio and enable FPV radio announcements.';};$('cues').append(boot);
for(const [label,count] of [['Small capture',100],['Medium capture',400],['Large capture',1000],['Capture → victory',1000]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{run.tick++;const events=[{type:'cut.closed',tick:run.tick},{type:'cells.claimed',tick:run.tick,indices:Array.from({length:count},(_,i)=>i)}];if(label.includes('victory'))events.push({type:'run.completed',tick:run.tick,status:'won'});sound.events(events,run,{family:'fpv'});};$('cues').append(b);}
function draw(t){run.tick++;run.time=t/1000;run.player.x=$('moving').checked?10+Math.sin(t/900)*4:10;run.enemies[0].x=run.player.x+Number($('distance').value);run.enemies[0].y=50+Math.sin(t/700)*.6;if(ready)sound.feedback(!document.hidden,{family:'fpv'},run,{silentStart:true,bodyId:$('body').value});const loops=sound.feedbackDirector.boards.get('solo')?.loops;const playerVoice=loops?.get('player:0'),enemyVoice=loops?.get('enemy:audition');$('movementstatus').textContent=`Player: ${playerVoice?.name??'quiet'} · Enemy: ${enemyVoice?.name??'quiet / out of range'}`;ctx.clearRect(0,0,900,180);ctx.fillStyle='#8decdd';ctx.beginPath();ctx.arc(run.player.x*9,90,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb16f';ctx.fillRect(run.enemies[0].x*9-10,80,20,20);ctx.fillStyle='white';ctx.fillText('YOU',run.player.x*9-12,130);ctx.fillText('ENEMY',run.enemies[0].x*9-20,130);frame=requestAnimationFrame(draw);}frame=requestAnimationFrame(draw);
document.addEventListener('visibilitychange',()=>{if(document.hidden)sound.suspend();});window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);void sound.dispose();});
</script></html>
