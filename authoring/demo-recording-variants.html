<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../game/presentation/theme-bootstrap.mjs" data-theme-density="studio" data-theme-follow-context="true"></script>
    <link
      rel="stylesheet"
      href="../game/presentation/industrial-workshop.css"
      data-industrial-workshop
    />
    <script type="module" src="../game/presentation/theme-entry.mjs"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo recording variant authoring</title>
  </head>
  <body>
    <h1>Demo recording variant authoring</h1>
    <p>
      Records the committed input traces in this browser, preserving ordinary strict replay
      verification.
    </p>
    <button id="run">Run and verify recordings</button
    ><button id="export" disabled>Export verified bundle</button>
    <button id="verify">Verify all shipped scene adapters</button>
    <pre id="status" role="status">Ready.</pre>
    <textarea
      id="bundle"
      aria-label="Verified recording bundle"
      rows="5"
      cols="100"
      readonly
    ></textarea>
    <script type="module" src="./demo-recording-variants.mjs"></script>
    <script type="module" src="../game/ui/authoring-input-entry.mjs"></script>
  </body>
</html>
