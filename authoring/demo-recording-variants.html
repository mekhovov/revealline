<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Demo recording variant authoring</title>
  <body>
    <h1>Demo recording variant authoring</h1>
    <p>
      Records the committed input traces in this browser, preserving ordinary strict replay
      verification.
    </p>
    <button id="run">Run and verify recordings</button
    ><button id="export" disabled>Export verified bundle</button>
    <button id="verify">Verify all shipped scene adapters</button>
    <pre id="status" role="status">Ready.</pre>
    <textarea
      id="bundle"
      aria-label="Verified recording bundle"
      rows="5"
      cols="100"
      readonly
    ></textarea>
    <script type="module" src="./demo-recording-variants.mjs"></script>
    <script type="module" src="../game/ui/authoring-input-entry.mjs"></script>
  </body>
</html>
