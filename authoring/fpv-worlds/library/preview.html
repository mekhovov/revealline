<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Library verification catalog preview</title>
  <script
    src="../../../game/presentation/theme-bootstrap.mjs"
    data-theme-density="studio"
    data-theme-follow-context="true"
  ></script>
  <link
    rel="stylesheet"
    href="../../../game/presentation/industrial-workshop.css"
    data-industrial-workshop
  />
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      background: #101923;
      color: #eef4f4;
      font: 14px system-ui;
    }
    p {
      margin: 8px;
    }
    iframe {
      display: block;
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
    }
  </style>
  <p>Verification catalog only · one qualified authoring starter. Production catalog is empty.</p>
  <p id="status" role="status">Opening native Library…</p>
  <p>Preview-only language controls: <button id="en">EN</button> <button id="uk">УК</button></p>
  <iframe id="sim" title="Actual native Library"></iframe>
  <script type="module">
    const memory = new Map([
      [
        'revealline.fpv.world-settings.v1',
        JSON.stringify({
          'world-language': 'en',
          'flight-quality': 'low',
          'sim-motion': 'reduced',
        }),
      ],
    ]);
    window.fixtureStorage = {
      getItem: (k) => memory.get(k) ?? null,
      setItem: (k, v) => memory.set(k, String(v)),
      removeItem: (k) => memory.delete(k),
    };
    window.fixturePrefix = 'fpv-library-visual-' + crypto.randomUUID() + ':';
    window.fixtureDatabases = new Set();
    const frame = document.getElementById('sim'),
      status = document.getElementById('status');
    async function until(f) {
      const start = performance.now();
      while (!f()) {
        if (performance.now() - start > 30000) throw Error('Preview timeout');
        await new Promise((r) => setTimeout(r, 20));
      }
    }
    try {
      const fixture = await (await fetch('./fixture.json')).json();
      frame.src = './player/optional-practice/fpv-worlds/fixture-host.html?token=visual#packs';
      await until(
        () => frame.contentWindow?.fixtureToken === 'visual' && frame.contentWindow.fpvWorldStudio,
      );
      const w = frame.contentWindow,
        d = frame.contentDocument;
      for (const language of ['en', 'uk'])
        document.getElementById(language).onclick = () => {
          const select = d.getElementById('world-language');
          select.value = language;
          select.dispatchEvent(new w.Event('change', { bubbles: true }));
        };
      await w.fpvWorldStudio.ready;
      w.fixtureNetwork.index = { format: 'FPVWorldLibrary.v1', worlds: [fixture.asset] };
      d.getElementById('worlds-shell-action-missions').click();
      d.querySelector('[data-tab=packs]').click();
      d.querySelector('#optional-world-library button').click();
      await until(() => !d.querySelector('#optional-world-library button').disabled);
      status.textContent =
        'Use the preview EN/УК controls and resize. They dispatch the existing language select change; native language navigation is not qualified.';
    } catch (error) {
      status.textContent = String(error);
    }
  </script>
</html>
