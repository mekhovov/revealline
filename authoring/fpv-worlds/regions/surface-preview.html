<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Canyon surface study</title>
    <script
      src="../../../game/presentation/theme-bootstrap.mjs"
      data-theme-density="studio"
      data-theme-follow-context="true"
    ></script>
    <link
      rel="stylesheet"
      href="../../../game/presentation/industrial-workshop.css"
      data-industrial-workshop
    />
    <style>
      body {
        margin: 0;
        font: 16px var(--iw-font-ui, system-ui);
        color: var(--iw-text, #eee);
        background: var(--iw-bg, #101922);
      }
      header {
        padding: 12px;
      }
      p {
        margin: 8px 0;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
      }
      label {
        display: grid;
        gap: 4px;
      }
      input {
        width: min(520px, 80vw);
      }
      button,
      input,
      select {
        font: inherit;
        min-height: 44px;
        padding: 8px;
        color: var(--iw-text, #eee);
        background: var(--iw-panel, #182a36);
      }
      canvas {
        display: block;
        width: 100%;
        height: 65dvh;
        min-height: 240px;
      }
      output {
        display: block;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Canyon sediment · material study</strong>
      <p>
        Verified terrain, original rock and sand shading. Authoring inspection only; no player
        admission.
      </p>
      <form>
        <label>Region manifest<input id="manifest" required /></label>
        <label
          >Surface<select id="surface">
            <option value="canyon">Canyon sediment</option>
            <option value="plain">Plain comparison</option>
          </select></label
        >
        <label
          >Detail<select id="quality">
            <option value="performance">Performance</option>
            <option value="balanced" selected>Balanced</option>
            <option value="quality">Quality</option>
          </select></label
        >
        <label
          >View<select id="view">
            <option value="gorge">Gorge</option>
            <option value="basin">Basin</option>
            <option value="spires">Spires</option>
          </select></label
        >
        <button>Prepare view</button><button id="release" type="button">Release resources</button>
      </form>
      <output id="status" role="status">Choose the prepared Canyon manifest.</output>
    </header>
    <canvas aria-label="Canyon surface comparison"></canvas>
    <script type="module" src="../../../game/presentation/theme-entry.mjs"></script>
    <script type="module" src="./surface-preview.mjs"></script>
  </body>
</html>
