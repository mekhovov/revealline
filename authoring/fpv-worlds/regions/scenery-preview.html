<!doctype html>
<html lang="en" data-theme-density="studio">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regional scenery preparation</title>
    <script
      src="../../../game/presentation/theme-bootstrap.mjs"
      data-theme-density="studio"
    ></script>
    <link
      rel="stylesheet"
      href="../../../game/presentation/industrial-workshop.css"
      data-industrial-workshop
    />
    <style>
      body {
        margin: 0;
        background: var(--iw-ink, #121b24);
        color: var(--iw-text, #f3eee0);
        font: var(--iw-text-size, 16px) var(--iw-font-ui, system-ui);
      }
      header {
        padding: 14px;
      }
      button,
      input {
        font: inherit;
        padding: 10px;
        margin: 4px;
        background: var(--iw-panel, #223441);
        color: var(--iw-text, #f3eee0);
        border: 1px solid var(--iw-line, #81939d);
      }
      input {
        width: min(70vw, 620px);
      }
      button:disabled {
        opacity: 0.5;
      }
      canvas {
        display: block;
        width: 100%;
        height: 70vh;
      }
      p {
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Regional scenery · authoring inspection</b>
      <p>
        Verified scenery and terrain with matching collision. Regional appearance study; no flight
        or default player admission.
      </p>
      <form>
        <label>Region manifest <input id="manifest" required /></label><button>Load study</button>
      </form>
      <nav id="views"></nav>
      <button id="release" type="button">Release resources</button>
      <p id="status" role="status">Choose a prepared regional scenery manifest.</p>
    </header>
    <canvas aria-label="Verified regional scenery preview"></canvas>
    <script type="module" src="../../../game/presentation/theme-entry.mjs"></script>
    <script type="module" src="./scenery-preview.mjs"></script>
  </body>
</html>
